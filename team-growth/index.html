id) { return c.S.pl[id].aff; }\nfunction done(c, k) { return !!c.S.flags[k]; }\nfunction since(c, k) { var f = c.S.flags[k]; return f ? c.S.week - (f - 1) : -1; }\nfunction calm(c) { return c.S.week - c.S.lastEvent >= 1; }\nreturn {\n  id: 'psg', title: '巴黎养成计划', version: '1.1', saveVersion: 1,\n  saveKey: 'psg-yangcheng-v1@20261016a',\n  bonusScale: 5.2, calib: -15, club: 'PSG', short: '巴黎', coach: '恩里克', stadium: '王子公园球场', motto: 'Paris Saint-Germain · 2026–27',\n  seasonStart: '2026-08-17', seasonEnd: '2027-06-14',\n  author: '作者：发财喵喵 · 由 Claude 生成',\n  disclaimer: '本游戏为 Claude 生成的球迷自制内容，球员数值与赛程来自公开数据整理，剧情与人物性格皆为虚构，与真实人物、俱乐部无关。',\n  theme: {\n    light: { plate: '#004170', plateInk: '#FFFFFF', accent: '#004170', accentText: '#003358', tint: '#E1EAF2', navy: '#004170' },\n    dark: { plate: '#0B2A47', plateInk: '#FFFFFF', accent: '#4C8FCC', accentText: '#A5CBEE', tint: '#14283A', navy: '#A5CBEE' }\n  },\n  ucl: { dates: ['2026-09-09', '2026-10-14', '2026-10-20', '2026-11-03', '2026-11-25', '2026-12-08', '2027-01-20', '2027-01-27'] },\n  cups: [\n    { id: 'CDF', name: '法国杯', rounds: [\n      { st: 'r64', name: '64 强', date: '2026-12-20', topWeight: .4, lowerWeight: 3 },\n      { st: 'r32', name: '32 强', date: '2027-01-09', topWeight: 1, lowerWeight: 2 },\n      { st: 'r16', name: '16 强', date: '2027-02-03', topWeight: 2.5, lowerWeight: 1 },\n      { st: 'qf', name: '八强战', date: '2027-03-03', topWeight: 5, lowerWeight: .5 },\n      { st: 'sf', name: '半决赛', date: '2027-04-21', neutral: true, venue: '中立场地', topWeight: 8, lowerWeight: .3 },\n      { st: 'f', name: '决赛', date: '2027-05-15', neutral: true, venue: '圣但尼 法兰西体育场', final: true, topWeight: 10, lowerWeight: .2 }] }\n  ],\n  rivals: ['OM', 'LIL', 'ASM'],\n  intro: '你在巴黎拿到了欧冠，也拿到了一个几乎没人相信的“没有超级巨星的巴黎”。现在，你的球队还是那套：高位压迫、短传推进、所有人一起跑。你要证明的，是这套东西能不能再赢一次。\\n\\n新赛季，董事会没有给你新的承诺，只给了你一张周历。每个周一，你可以看数值、找球员聊聊，然后把这一周的训练一格一格排满。剩下的，交给周末。',\n\n  /* 关键球员：养成的主要对象。tags 决定谈话效果；aff 好感初值；ego 傲气初值 */\n  keyPlayers: [\n    { id: DE, tags: ['star', 'hot'], aff: 45, ego: 55, role: '前锋 · 压迫的第一个人', blurb: '笑得最多，也是球队里最难被说服的人。吃激将也吃表扬，傲气一高，就容易把比赛玩成自己的舞台。',\n      talk: { criticize: { good: ['{p}瞪着你，半天才吐出一句：“行，我知道了。”下午的训练里他回追了三次。'], bad: ['{p}把手套摔在凳子上：“我已经跑成这样了，你还要我怎样？”'] }, encourage: { bad: ['{p}笑着说：“教练，这句话我昨天也听过。”'] } } },\n    { id: KV, tags: ['star', 'perfectionist', 'sensitive'], aff: 45, ego: 45, role: '左边锋 · 左路的完美主义者', blurb: '一个动作能练到天黑的人。对自己的要求比谁都高，一次没踢好的球，能在脑子里放一整晚。',\n      talk: { focus: { good: ['{p}只说了一句话：“明白。”那一周，他的每次突破都带着刻意的节奏。'] }, criticize: { bad: ['{p}低头看着地面，很久才说：“我知道我哪里错了。”声音很轻。'] } } },\n    { id: DO, tags: ['young', 'pressure'], aff: 50, ego: 35, role: '边锋 · 二十一岁的天赋', blurb: '才二十一岁，被说成下一个传奇。比所有人更想证明自己，也比所有人更怕搞砸。',\n      talk: { encourage: { good: ['{p}眼睛一亮：“教练，我今天想多跑一点。”'] }, heart: { good: ['{p}说起小时候踢球被教练说“个子太小”的事，笑了笑：“所以我现在什么都想试。”'] } } },\n    { id: VI, tags: ['leader', 'calm'], aff: 55, ego: 30, role: '中场 · 球队的大脑', blurb: '不爱说话，但每一次触球都像在下指令。很多比赛的节奏，是他一个人定下来的。',\n      talk: { consult: { good: ['{p}拿出一页自己手写的压迫触发图：“教练，边路这里，我想让他们早一步。”'] }, heart: { good: ['{p}聊起小时候在葡萄牙的小球场，“那时候我们只有一个球，所以每个人都想先抢到。”'] } } },\n    { id: MQ, tags: ['veteran', 'leader', 'calm'], aff: 60, ego: 25, role: '后卫 · 队长', blurb: '更衣室里最年长的锚。比起表扬，他更习惯被当成同事。一场比赛的好坏，他先看后防线的距离。',\n      talk: { consult: { good: ['{p}想了一会儿：“教练，防线再靠前三米，年轻人能跟上。”'] }, heart: { good: ['{p}聊起他第一次踢欧冠的夜晚，“那天我一晚上没睡着。”'] } } },\n    { id: NM, tags: ['young', 'hot'], aff: 50, ego: 45, role: '左后卫 · 边路发动机', blurb: '速度和脾气一样快。训练场上的气氛担当，也是最容易冲动的人。',\n      talk: { encourage: { good: ['{p}大笑：“教练你再这么说，我今天还能多跑十公里！”'] }, criticize: { bad: ['{p}把水瓶砸在地上，“我已经够拼了！”'] } } }\n  ],\n\n  /* 事件。week 指定则必在该周出现；force 条件满足必出；其余按权重随机。who: 球员ID 或 'random' */\n  events: [\n    { id: 'goal', week: 0, cat: '董事会', t: '赛季开始前，CEO 在办公室里问你：“今年的目标是什么？”窗外训练场上，球员们正在热身。', o: [\n      { t: '稳稳地进欧冠，这是底线', tip: '董事会更宽容，奖励较小', fx: { goal: 'safe', board: 3 }, r: '“很务实。”CEO 点点头，在文件上签了字。' },\n      { t: '继续称霸法甲', tip: '期望更高，成功的回报也更高', fx: { goal: 'push', fans: 3, morale: 2 }, r: '“我们等这一天很久了。”CEO 说。球迷论坛里一夜之间多了几千条评论。' },\n      { t: '法甲、法国杯、欧冠，三个都要', tip: '压力最大，容错最低', fx: { goal: 'dream', morale: 4, board: -4 }, r: '会议室里安静了五秒，然后所有人都笑了。你没笑——你在想那一晚是怎么做到的。' }] },\n    { id: 'winter', win: [17, 21], cat: '冬歇之前', t: '圣诞前后，冬歇之前的赛程像下雨一样往头上砸，球队只有几天能喘口气。助教建议利用这段空档做一次重点调整，你只能选一个。', o: [\n      { t: '把防守体系再磨一遍', fx: { def: 6, fatigue: 6 }, r: '高位防守的距离，现在每个人都能闭着眼站出来。' },\n      { t: '把进攻套路练熟', fx: { atk: 6, fatigue: 6 }, r: '肋部的三角传递和最后一传，终于对上了节奏。' },\n      { t: '体能储备，赛季下半程靠它', fx: { cond: 6, fatigue: 10 }, r: '最后一周的拉练让所有人都骂了你，但没人掉队。' },\n      { t: '什么都不练，全队休整、吃饭', fx: { unity: 6, morale: 6, fatigue: -18 }, r: '圣诞聚餐上，几个人为谁买单吵了起来，最后是门将抢到了账单。' }] },\n    { id: 'window', win: [22, 26], cat: '转会窗', t: '一月的转会窗口快关了，董事会问你要不要补强。预算有限，但他们愿意听。', o: [\n      { t: '“不需要，现有的人就够了。”', fx: { unity: 3, morale: 2, board: 1 }, r: '你说得很平静。更衣室里有人听见了，晚上多了几声笑。' },\n      { t: '“给我一个最缺位置的替补。”', fx: { funds: -16, atk: 2, def: 2, board: -1 }, r: '新的替补当天晚上到队，虽然只能站在板凳上，但教练组松了口气。' },\n      { t: '“把钱留着，夏天再说。”', fx: { funds: 16, board: 2 }, r: 'CEO 露出了难得的笑容。' }] },\n    { id: 'crisis', cat: '危机', force: true, cd: 8, when: function (c) { return c.lossStreak >= 3; }, t: '球队已经连续三场没赢。更衣室里有人开始互相指责，球迷论坛也出现了“恩里克下课”的帖子。', o: [\n      { t: '开一次全队会，所有人都要说话', fx: { unity: 4, morale: 3, fatigue: 4 }, r: '会开了两个小时。有人拍桌子，有人沉默，最后所有人一起喊了口号。' },\n      { t: '给全队放一天假', fx: { morale: 4, fatigue: -10, board: -1 }, r: '董事会不太满意，但球员们回来的时候像换了一批人。' },\n      { t: '加练，罚站，让他们记住', fx: { def: 3, atk: 2, morale: -4, fatigue: 8, key: { mood: -3 } }, r: '训练场的灯亮到了十点。有人在回家的路上摔了手机。' }] },\n    { id: 'board_talk', cat: '董事会', force: true, once: true, when: function (c) { return c.S.board < 32 && c.S.week >= 8; }, t: 'CEO 把你叫到办公室，桌上放着一份文件。“我们需要谈谈这个赛季了。”', o: [\n      { t: '“给我三个星期。”', fx: { board: 5, morale: -2 }, r: 'CEO 看着你很久，点了点头。“三个星期。”' },\n      { t: '“你们挑的人，你们说了算。”', fx: { board: -3, fans: 2 }, r: '这句话传出去之后，球迷论坛转了三天。' },\n      { t: '拿出一份赛季回顾报告', fx: { board: 3, funds: -8 }, r: '报告翻了三页，CEO 的表情缓和了一点。' }] },\n    { id: 'unity_party', cat: '更衣室', w: 2, when: function (c) { return c.S.attrs.unity > 60; }, t: '团结指数很高。今天训练结束后，几个年轻球员自发在更衣室里搞了一场“聚餐大会”，他们问你来不来。', o: [\n      { t: '去，当然去', fx: { unity: 3, morale: 3, key: { mood: 2 } }, r: '你坐在角落吃了半个小时，没人提战术。' },\n      { t: '让他们自己玩，你在办公室看录像', fx: { atk: 1, def: 1 }, r: '你关了门，听着楼下的笑声，反而更专心。' }] },\n    { id: 'a_sprint', cat: '教练', w: 2, when: function (c) { return c.last && c.last.out === 'W'; }, t: '终场哨响，你冲出技术区，沿着边线一路跑到了看台下面，第四官员追着你跑了二十米。', o: [\n      { t: '“我只是想和球迷待在一起。”', fx: { fans: 3, morale: 2 }, r: '这段视频成了本周最受欢迎的短视频。' },\n      { t: '向第四官员道歉', fx: { board: 1, fans: 1 }, r: '他接受了道歉，但表情仍然很复杂。' }] },\n    { id: 'press_trap', cat: '媒体', w: 2, t: '一个记者问你：“很多人说，没有了超级巨星，你的巴黎只是一台没有灵魂的机器，你怎么看？”会场安静了下来。', o: [\n      { t: '“灵魂，是十一个人一起跑出来的。”', fx: { fans: 2, board: 1 }, r: '这句话被印在了第二天的小报头条上，旁边配的是你站在场边的照片。' },\n      { t: '笑笑，什么都不说', fx: { board: 1, morale: 1 }, r: '记者追问了三遍，你只是点了点头。' },\n      { t: '“你来训练场看看吧。”', fx: { fans: 1, unity: 1 }, r: '第二天，那个记者真的来了，站在场边被淋了一身水。' }] },\n    { id: 'injury_crisis', cat: '医疗', w: 2, when: function (c) { return c.S.fatigue > 65; }, t: '队医敲门，神色严肃：“教练，最近的伤病报告看起来不太对，大家的身体在报警。”', o: [\n      { t: '这周全队轻练，优先恢复', fx: { fatigue: -14, morale: 1, board: -1 }, r: '队医松了一口气，小声说了句“谢谢”。' },\n      { t: '硬撑过去，赛季不等人', fx: { fatigue: 4, def: 1, unity: -1 }, r: '你拍了拍他的肩：“再坚持两周。”' }] },\n    { id: 'fan_banner', cat: '球迷', w: 2, t: '赛前，南看台升起一条巨大的横幅，上面写着：“这里是巴黎。”', o: [\n      { t: '赛后走到看台，向他们鞠躬', fx: { fans: 4, morale: 2 }, r: '球场的灯一盏盏熄灭，但看台上没有人愿意离开。' },\n      { t: '低头走进球员通道', fx: { fans: 1 }, r: '你什么也没说，但手心是湿的。' }] },\n    { id: 'assistant_idea', cat: '教练组', w: 2, t: '助教拿着笔记本找你：“教练，我有一个新训练想法，但可能需要多花一点时间。”', o: [\n      { t: '听听他的想法，试一次', fx: { atk: 2, chem: 2, fatigue: 3 }, r: '训练课结束，球员们说“这个很新鲜”。助教脸上写满了得意。' },\n      { t: '让他先和队医对一遍', fx: { chem: 1, unity: 1 }, r: '助教有点失望，但第二天他拿来了更完整的版本。' }] },\n    { id: 'dressing_spat', cat: '更衣室', who: 'random', w: 2, when: function (c) { return c.S.attrs.unity < 52 || c.lossStreak >= 2; }, t: '训练中，{p}和一名队友因为一次抢断起了冲突，两个人被队友拉开。更衣室里的空气像是凝固了。', o: [\n      { t: '把两人叫到办公室，当面说开', fx: { unity: 3, fatigue: 2, p: { aff: 2 } }, r: '十分钟后，两个人一起出来，谁也不看谁，但一起去吃了饭。' },\n      { t: '各打五十大板，罚跑', fx: { unity: -1, def: 1, fatigue: 6 }, r: '队友们安静地看着他们跑。从那天起，没人再提这件事。' },\n      { t: '当作没发生', fx: { unity: -4, morale: -2 }, r: '气氛一直没有真正缓和。' }] },\n    { id: 'rain', cat: '日常', w: 1, t: '巴黎下了一周的雨，训练场积水能没过脚踝。助教问你要不要把课改到室内。', o: [\n      { t: '照常训练，下雨才像巴黎', fx: { def: 2, unity: 2, fatigue: 4, morale: 1 }, r: '所有人都回家感冒了，但没有一个人缺席第二天的训练。' },\n      { t: '改到室内做体能和录像', fx: { cond: 1.5, atk: 1, fatigue: -2 }, r: '这周很安静。' }] },\n    { id: 'intl_break', cat: '国家队', who: 'random', w: 1, when: function (c) { return [3, 6, 7, 12, 32].indexOf(c.S.week) >= 0; }, t: '国际比赛日，{p}代表国家队踢了全场，回来时脸上写着“没睡好”。', o: [\n      { t: '让他休息一天', fx: { p: { fit: 8, mood: 2 } }, r: '{p}睡了一整天，醒来先问有没有吃的。' },\n      { t: '“明天正常训练。”', fx: { p: { form: 1 }, fatigue: 3 }, r: '{p}什么也没说，第二天依旧很拼。' }] },\n    { id: 'benched_player', cat: '球员', who: 'random', w: 2, when: function (c) { return c.S.pl && c.S.key.some(function (id) { return c.S.pl[id].mood < 42; }); }, t: '{p}最近情绪低落，训练也不太积极。队友们私下议论，你看在眼里。', o: [\n      { t: '约他单独聊一聊', fx: { p: { mood: 8, aff: 4 } }, r: '{p}说：“教练，我只是想知道自己在你的计划里。”' },\n      { t: '让他自己消化', fx: { p: { mood: 2, aff: -2 } }, r: '几天后他自己好起来了，但看你的眼神变了。' }] },\n    { id: 'owner_visit', cat: '董事会', w: 1, once: true, when: function (c) { return c.S.board > 50 && c.S.week >= 10; }, t: '俱乐部主席来看了一次训练，站在场边一言不发。结束后，他走过来拍了拍你的肩。', o: [\n      { t: '请他到办公室谈', fx: { board: 3, funds: 8 }, r: '他在你的办公室里坐了二十分钟，走的时候留下一句“继续”。' },\n      { t: '“谢谢，下周我们还有比赛。”', fx: { board: 1, morale: 1 }, r: '他笑了笑，转身走了。' }] },\n    { id: 'night_walk', cat: '教练', w: 1, when: function (c) { return c.S.week >= 5; }, t: '深夜你在空无一人的王子公园球场走了一圈。保安认出了你，什么也没说，只是把灯又多开了几盏。', o: [\n      { t: '在草皮上坐一会儿', fx: { morale: 1, fatigue: -3 }, r: '你坐了二十分钟，什么也没想。第二天，你感觉自己年轻了一点。' },\n      { t: '回办公室继续看录像', fx: { atk: 1, def: 1, fatigue: 2 }, r: '凌晨三点你关了电脑，在笔记本上写了一页字。' }] },\n    { id: 'sponsor', cat: '赞助商', w: 2, t: '一家新赞助商想让你亲自出镜拍一条广告，开价不低，时间要占掉半天训练。', o: [\n      { t: '拍，钱是真的', tip: '收入 +，但会累', roll: { p: .7, ok: { fx: { funds: 22, fans: 1, fatigue: 3 }, r: '拍摄很顺利。你全程一个表情，导演说这正好是广告需要的。' }, fail: { fx: { funds: 10, fans: -2, fatigue: 5 }, r: '你把台词说成了“高位压迫”，广告被剪了三遍才勉强能用。' } } },\n      { t: '推掉，训练要紧', fx: { atk: 1, def: 1 }, r: '你让助教回了一封礼貌的邮件。赞助商说下次再约。' }] },\n    { id: 'youth_call', cat: '青训', w: 2, t: '青年队一名 17 岁的中场球员连续几场表现抢眼，青训总监来问：“能不能让他跟一线队训练几天？”', o: [\n      { t: '让他来，看看成色', tip: '有概率给球队带来活力', roll: { p: .6, ok: { fx: { morale: 3, chem: 2, fatigue: -3, board: 1 }, r: '小伙子跑得比谁都欢，老队员们都说“像看到了十年前的自己”。' }, fail: { fx: { morale: -1, unity: -1 }, r: '他在对抗里被几位老队员撞得很惨，当天晚上就回了青年队。' } } },\n      { t: '再等等，别揠苗助长', fx: { board: 1, unity: 1 }, r: '青训总监点点头：“您总是这么稳。”' }] },\n    { id: 'agent_call', cat: '球员', who: 'random', w: 2, t: '{p}的经纪人在媒体上放话，说“有几家俱乐部很感兴趣”。球员本人对此没有表态。', o: [\n      { t: '把球员叫来，问他怎么想', fx: { p: { aff: 4, mood: 2 }, board: -1 }, r: '{p}说：“教练，我只想踢球。”你让他早点回去休息。' },\n      { t: '直接对媒体说“他不卖”', fx: { fans: 3, board: 1, p: { ego: 5 } }, r: '球迷论坛一片叫好，{p}的脸上有点不好意思。' },\n      { t: '装作没看到', fx: { p: { mood: -2, aff: -1 } }, r: '谣言又飘了几天，然后被另一条新闻盖了过去。' }] },\n    { id: 'ref_row', cat: '媒体', w: 2, when: function (c) { return c.last && c.last.out === 'L'; }, t: '输球之后，有记者问你对 VAR 判罚的看法。你的助教在桌子底下悄悄递给你一张纸条：“别说话。”', o: [\n      { t: '照着纸条，什么都不说', fx: { board: 1, morale: 1 }, r: '记者追问两遍，你都只点头。这条新闻没有发酵。' },\n      { t: '“我们没有输给裁判。”', fx: { fans: 2, board: 1, morale: 1 }, r: '这句话在球迷论坛里被转了几千次。' },\n      { t: '“有些判罚，我看不懂。”', fx: { fans: 4, board: -3, morale: 2 }, r: '法国足协的邮件第二天就到了。球迷却很满意。' }] },\n    { id: 'rival_trash', cat: '对手', w: 1, when: function (c) { return soon(c, 'OM', 14) || soon(c, 'LIL', 14) || soon(c, 'ASM', 14); }, t: '对手教练在发布会上暗示：“有些球队只会控球，不会进球。”记者把这句话原封不动地转给了你。', o: [\n      { t: '“他说得对，我们确实喜欢球。”', fx: { fans: 3, morale: 2, atk: 1 }, r: '这句话被印在了第二天的小报头条上，更衣室里传阅了好几遍。' },\n      { t: '“我不评论别人的足球。”', fx: { board: 1 }, r: '你平静地结束了采访。晚上，助教说你太克制了。' }] },\n    { id: 'charity', cat: '俱乐部', w: 1, t: '俱乐部邀请球队去儿童医院做一次探访。半天时间，没有训练，也没有摄像机。', o: [\n      { t: '全队一起去', fx: { unity: 3, morale: 3, fans: 3, fatigue: -4 }, r: '回程的大巴里很安静。没人拿手机出来拍，只是都在看窗外。' },\n      { t: '派几个代表，其他人训练', fx: { fans: 1, atk: 1, def: 1 }, r: '代表们回来说孩子们问了很多关于“你们教练为什么总是不笑”的问题。' }] },\n    { id: 'late_arrival', cat: '球员', who: 'random', w: 2, t: '训练开始五分钟了，{p}还没有出现。队友们互相看了看，没有人说话。', o: [\n      { t: '等他，不扣分', fx: { p: { aff: 3, mood: 2, ego: 4 }, unity: -1 }, r: '{p}满头大汗地跑进来，道歉的话说了三遍。' },\n      { t: '罚他加练，规矩就是规矩', fx: { p: { ego: -6, mood: -3, aff: -2 }, unity: 2 }, r: '{p}被罚了两圈，那天没人再迟到。' },\n      { t: '把他叫到办公室，问出了什么事', roll: { p: .55, ok: { fx: { p: { aff: 6, mood: 4 }, unity: 1 }, r: '{p}家里有点事。你让他先回去处理，他走时的眼神变了。' }, fail: { fx: { p: { aff: -2, mood: -3 }, unity: -1 }, r: '{p}什么也没说。你们沉默了很久。' } } }] },\n    { id: 'legend_visit', cat: '俱乐部', w: 1, once: true, when: function (c) { return c.S.week >= 6; }, t: '一位球队传奇来训练场看望大家，他在场边看了整整一场对抗赛，什么都没说，最后只是笑了笑。', o: [\n      { t: '请他给大家讲几句', fx: { morale: 4, unity: 3, key: { mood: 2 } }, r: '他讲了半个小时，讲到最后一句话时，全队都站了起来。' },\n      { t: '请他单独指点一名球员', fx: { p: { form: 1, aff: 3 } }, r: '你们在场边聊了很久。' }] },\n    { id: 'tactics_leak', cat: '媒体', w: 1, when: function (c) { return c.S.attrs.def > 55; }, t: '训练场外有人拍到了你们的战术演练，视频在网上流传。助教紧张地跑来问：“教练，要不要追查？”', o: [\n      { t: '追查，修个围墙', tip: '花钱，但防止泄露', fx: { funds: -10, board: 1 }, r: '一周后训练场周围多了三米高的围板。有球员说：“像是在拍电影。”' },\n      { t: '不管，他们看得懂吗？', fx: { fans: 1, def: 1 }, r: '你对着镜头的方向挥了挥手。视频后来被删了。' }] },\n    { id: 'diet', cat: '医疗', w: 1, t: '营养师提交报告：球员们最近的饮食越来越随意，建议统一管理，但需要球员们配合。', o: [\n      { t: '全队统一食谱', fx: { cond: 2, unity: -1, morale: -1, fatigue: -4 }, r: '食堂里多了一堆蒸菜，几个球员偷偷点了外卖。' },\n      { t: '让营养师给每人单独方案', fx: { funds: -8, cond: 1.5, morale: 1, fatigue: -3 }, r: '花了一些钱，但没有人抱怨。' },\n      { t: '不管，成年人自己负责', fx: { morale: 1, fatigue: 3 }, r: '周三的更衣室里飘出了烧烤味。' }] },\n    { id: 'bus_break', cat: '日常', w: 1, t: '客场比赛归程中，球队大巴在高速上抛锚。全队站在路边等了两个小时。', o: [\n      { t: '带着大家在路边玩球', fx: { unity: 4, morale: 2, fatigue: 2 }, r: '没人知道谁先开始的，总之一群职业球员在高速路边踢起了五人制。' },\n      { t: '让所有人在车里休息', fx: { fatigue: -3 }, r: '你把外套披在最年轻的球员身上，自己站在车外。' }] },\n    { id: 'prank', cat: '更衣室', who: 'random', w: 2, t: '{p}把一只橡皮鸭放进了助教的战术包里。助教打开包的时候，更衣室里安静了三秒，然后爆发出一阵大笑。', o: [\n      { t: '假装没看见，笑着走出去', fx: { unity: 3, morale: 2, p: { aff: 2 } }, r: '你在走廊里笑了一会儿才回到办公室。' },\n      { t: '“明天训练，每人加一圈。”', fx: { unity: 1, def: 1, fatigue: 3 }, r: '没人抱怨。第二天，那只鸭子被摆在了更衣室的架子上。' }] },\n    { id: 'language', cat: '更衣室', w: 1, t: '一位新来的小将还不太会说法语，在训练里几次因为沟通不畅造成失误，有点沮丧。', o: [\n      { t: '安排老队员带他', fx: { unity: 3, chem: 2, p: { mood: 0 } }, r: '维蒂尼亚每天带他吃午饭，两周后他已经会用法语骂裁判了。' },\n      { t: '请语言老师，每天课后上课', fx: { funds: -6, chem: 2, morale: 1 }, r: '语言老师在训练场边的小黑板上写满了单词。' }] },\n    { id: 'doc_warn', cat: '医疗', w: 2, when: function (c) { return c.S.fatigue > 50; }, t: '队医拿着一份报告来找你：“教练，有三个人的肌肉负荷已经到临界值。”', o: [\n      { t: '听队医的，立刻减量', fx: { fatigue: -10, atk: -.5 }, r: '你把周三的重练改成了泳池恢复。' },\n      { t: '再坚持一场，之后补', tip: '有风险', roll: { p: .5, ok: { fx: { fatigue: 2, def: 1 }, r: '你赌对了。队医看着你，脸上没有表情。' }, fail: { fx: { fatigue: 5, p: { inj: 3 } }, r: '有人在训练里拉伤了，队医什么都没说，只是把报告又递了一次。' } } }] },\n    { id: 'gk_coach', cat: '教练组', w: 1, t: '门将教练来找你：“教练，我想试试给他们加一套新的出击训练。”', o: [\n      { t: '同意，试一个月', fx: { def: 2, fatigue: 2 }, r: '门前的出击更果断了。一个月后，对手的传中少了。' },\n      { t: '“现在这套就够了。”', fx: { board: 1 }, r: '门将教练点点头，带着笔记本回去了。' }] },\n    { id: 'fan_letter', cat: '球迷', w: 1, t: '一位十岁的球迷写来一封信，说他想当球员，但他个子太小。信封里夹着一张他自己画的你。', o: [\n      { t: '回信，并寄去一件训练服', fx: { fans: 2, morale: 1 }, r: '一个月后，他寄回了一张照片：训练服被他穿得过长，袖子卷了三圈。' },\n      { t: '贴在办公室墙上', fx: { morale: 1 }, r: '你每天进门都会看到那幅画。' }] },\n    { id: 'cold_snap', cat: '日常', w: 1, t: '巴黎突然降温，训练场的草皮结了薄霜，球员们裹着外套在场边活动。', o: [\n      { t: '改成室内力量训练', fx: { cond: 2, fatigue: 2 }, r: '体能教练笑得很开心：“终于可以练核心了。”' },\n      { t: '照常训练，穿厚点', fx: { unity: 2, morale: 1, fatigue: 3 }, r: '你看着自己呼出的白气，想起了第一次站在这里的那个早晨。' }] },\n    { id: 'old_boot', cat: '教练', w: 1, once: true, when: function (c) { return c.S.week >= 12; }, t: '你在办公室的抽屉里找到了一双旧球鞋，是你自己踢球时穿的。鞋底已经磨得很薄。', o: [\n      { t: '带到更衣室，放在显眼的地方', fx: { morale: 3, unity: 2 }, r: '鞋被摆在了更衣室的入口。球员们进门都会多看它一眼。' },\n      { t: '放回抽屉', fx: { morale: 1 }, r: '你关上抽屉，笑了笑。' }] },\n    { id: 'surprise_test', cat: '教练组', w: 1, t: '体能教练提出一个想法：搞一次突击体测，让球员们“知道自己真实的状态”。', o: [\n      { t: '搞，当场公布成绩', roll: { p: .6, ok: { fx: { cond: 3, morale: 1, unity: 1 }, r: '全队咬着牙跑完。有人第一次发现自己比队友强，有人第一次发现不是。' }, fail: { fx: { cond: 1, morale: -3, unity: -2 }, r: '结果公布后，更衣室里传出了几声叹息。' } } },\n      { t: '不公布，只给个人反馈', fx: { cond: 1.5, morale: 1 }, r: '体能教练一个一个把球员叫到办公室。' }] },\n    { id: 'ucl_draw', cat: '欧冠', w: 1, once: true, when: function (c) { return c.S.week >= 3 && c.S.week <= 8; }, t: '欧冠联赛阶段的抽签结果出来了。球员们挤在休息室里看直播，谁抽到谁、谁远谁近，每一个名字都有人发出一声惊叹。', o: [\n      { t: '“每一场，都一样。”', fx: { morale: 1, unity: 1 }, r: '你关掉了电视。所有人安静了一秒，然后继续吃饭。' },\n      { t: '把对阵表贴在更衣室墙上', fx: { morale: 3, atk: 1, fatigue: 1 }, r: '第二天，有人在每个对手名字旁边画了一个小小的笑脸，有人画了一个哭脸。' }] },\n    { id: 'derby_eve', cat: '法国德比', force: true, once: true, when: function (c) { return soon(c, 'OM', 6) && c.S.week >= 2; }, t: '本周末是法国国家德比。记者们在训练场外挤成一团，等你说点什么。更衣室里，球员们也在等。', o: [\n      { t: '“一场一场来。”', fx: { morale: 2 }, r: '一句最不像鸡血的话，更衣室里每个人都重复了一遍。' },\n      { t: '让队长给大家讲讲德比', fx: { unity: 3, chem: 2, p: { mood: 4 } }, r: '马尔基尼奥斯站起来讲了三分钟。没有人说话，但也没有人看手机。' },\n      { t: '什么都不说，让他们自己想', fx: { morale: -1, atk: 2, def: 2 }, r: '训练场上，除了脚步声和喘气声，什么也没有。' }] },\n    { id: 'derby_win', cat: '法国德比', w: 3, when: function (c) { return c.last && c.last.opp === 'OM' && c.last.out === 'W' && c.last.cn === '法甲'; }, t: '赢下德比之后，几个年轻球员在更衣室里放起了歌，老球员们围着球场边走边唱。', o: [\n      { t: '一起唱', fx: { morale: 4, fans: 3, unity: 3 }, r: '视频被球员发上社交媒体，评论区一半是庆祝，一半是对面球迷的沉默。' },\n      { t: '“明天训练，八点。”', fx: { board: 1, atk: 1, def: 1 }, r: '歌停了，但没人觉得扫兴。' }] },\n    { id: 'derby_loss', cat: '法国德比', w: 3, when: function (c) { return c.last && c.last.opp === 'OM' && c.last.out === 'L'; }, t: '输给马赛之后，记者翻出旧账，问你：这支球队是不是在最需要凶狠的时候，缺了点凶狠？', o: [\n      { t: '“我只记得下一场。”', fx: { morale: 1, fans: 1 }, r: '同一句话，你在很多场合说过。' },\n      { t: '沉默地看了他一眼', fx: { fans: 3, morale: -1 }, r: '那条新闻最后没有发出来。' }] },\n    { id: 'paris_derby', cat: '巴黎德比', w: 2, once: true, when: function (c) { return soon(c, 'PFC', 8); }, t: '这周要踢巴黎德比，对手是同城的另一支球队。记者问你：这场比赛对你们来说是不是“多余的一场”？', o: [\n      { t: '“没有多余的比赛。”', fx: { morale: 2, def: 1 }, r: '这句话在更衣室里被贴成了一张小纸条。' },\n      { t: '“欢迎他们来王子公园。”', fx: { fans: 3, morale: 1 }, r: '对面球迷的社交账号一晚上刷了几千条。' }] },\n    { id: 'title_rival', cat: '争冠', w: 2, when: function (c) { return c.rank <= 3 && (soon(c, 'LIL', 10) || soon(c, 'ASM', 10) || soon(c, 'OM', 10)) && c.S.week >= 5; }, t: '积分榜上的数字越来越紧。争冠对手的教练在发布会上说：“我们的目标很清楚，别人怎么想，是别人的事。”记者把这句话转给了你。', o: [\n      { t: '“我们也一样。”', fx: { morale: 2, fans: 1 }, r: '一句话，被剪成了短视频，点赞比他那条还多。' },\n      { t: '“我更想聊聊我的球队。”', fx: { board: 1, unity: 1 }, r: '你把话题拉回了球队。助教在桌子底下悄悄竖了个大拇指。' },\n      { t: '让记者去问球员', fx: { fans: 2, morale: -1 }, r: '维蒂尼亚被问到的时候说：“我们一周踢一场，剩下的时间在训练。”' }] },\n    { id: 'a_ucl_night', cat: '俱乐部', w: 2, once: true, when: function (c) { return c.S.week >= 3; }, t: '王子公园球场的欧冠主题旗帜被换成了新赛季的版本。球迷们在看台上挂满了旧横幅：“没有人比一个集体更强。”记者问你，这支球队是不是还是那套老办法？', o: [\n      { t: '“是。我们还会再用一次。”', fx: { fans: 3, board: 2 }, r: '这句话被印在了第二天的小报头条上。' },\n      { t: '“我们会变，只是不会变掉‘一起跑’。”', fx: { morale: 2, unity: 1 }, r: '球迷论坛立刻开了个新帖：#一起跑#。' },\n      { t: '“我更关心下一场。”', fx: { morale: 1 }, r: '记者们有点失望，球员们觉得你很酷。' }] },\n    { id: 'a_dembele', cat: '球员', who: DE, w: 2, t: '{p}在训练里被要求回防，他一边跑一边笑着问你：“教练，我是前锋还是后卫？”', o: [\n      { t: '“你是第一个后卫，也是第一个前锋。”', fx: { def: 1.5, p: { mood: 2, aff: 2 } }, r: '{p}大笑：“好吧，那我两个都当。”球队的压迫更凶了。' },\n      { t: '给他自由，让他留在前面', fx: { atk: 1, p: { form: 1.5, mood: 3, ego: 3 } }, r: '{p}松了一口气，下一次训练多进了两个球。' },\n      { t: '“少废话，跑。”', fx: { p: { mood: -2, ego: -3 }, def: 1 }, r: '{p}翻了个白眼，还是跑了。' }] },\n    { id: 'a_de_ego', cat: '球员', who: DE, force: true, cd: 10, when: function (c) { return c.S.pl[DE].ego > 72; }, t: '{p}最近在社交媒体上的动静越来越多，队友们开始私下抱怨他“只想着自己”。', o: [\n      { t: '单独谈一次，压一压他', fx: { p: { ego: -14, mood: -3, form: .5 }, unity: 2 }, r: '{p}被说得有点不服气，但第二天训练里他多回防了三次。' },\n      { t: '公开表扬他，同时点名要求团队', fx: { p: { ego: -6, mood: 3 }, unity: 1, morale: 1 }, r: '一句话说得所有人都听明白了。' },\n      { t: '装作没看见', fx: { p: { ego: 4 }, unity: -4, key: { mood: -1 } }, r: '更衣室里的空气有点微妙。' }] },\n    { id: 'a_kvara', cat: '球员', who: KV, w: 2, t: '训练结束了，{p}还在场上一个人练内切射门，一次、两次、三十次。你喊他回去，他说：“教练，有个角度我一直不满意。”', o: [\n      { t: '陪他练到天黑', fx: { atk: 1, fatigue: 2, p: { aff: 5, form: 1.2, mood: 3 } }, r: '灯亮起来的时候，{p}终于把那个角度踢了进去，笑得像个孩子。' },\n      { t: '“明天再练，今天够了。”', fx: { fatigue: -2, p: { aff: 1, mood: -1 } }, r: '{p}不太情愿地点点头，但第二天看起来更轻快。' }] },\n    { id: 'a_doue', cat: '球员', who: DO, w: 2, t: '{p}在训练里用一个转身把两个队友甩在身后，场边的人先是愣住，然后爆发出一阵喝彩。助教却在小声嘀咕：“他还没学会什么时候该传球。”', o: [\n      { t: '“漂亮。比赛里也可以这么踢。”', fx: { atk: 1.5, p: { form: 1.5, mood: 3, ego: 3 } }, r: '{p}冲着场边做了个鞠躬的动作。' },\n      { t: '“漂亮。但要看时机。”', fx: { chem: 1, p: { form: .5, aff: 1 } }, r: '{p}点点头：“知道了，不在关键时刻玩。”' },\n      { t: '“先把基本功做好。”', fx: { def: 1, p: { mood: -3, aff: -1 } }, r: '{p}耸耸肩，转身去拿水。' }] },\n    { id: 'a_vitinha', cat: '球员', who: VI, w: 2, t: '训练里，{p}一边用手势指挥几个年轻人的站位，一边微微点头，周围的人听不见他说什么，却都在照做。', o: [\n      { t: '让他当训练里的“第二个教练”', fx: { chem: 2, unity: 1, p: { ego: 3, aff: 3 } }, r: '{p}把战术板拿过去画了一张图。画完后，所有人都说“看懂了”。' },\n      { t: '提醒他别越界', fx: { p: { ego: -3, mood: -2 }, unity: 1 }, r: '{p}笑着举起手：“教练你说了算。”' }] },\n    { id: 'a_marquinhos', cat: '球员', who: MQ, w: 2, t: '训练结束，{p}留下几个年轻后卫，一个一个地教他们怎么用身体卡位。一个多小时后，他自己才坐在场边喘气。', o: [\n      { t: '走过去，递上一瓶水', fx: { unity: 2, p: { aff: 4, mood: 3 } }, r: '“年轻人跑得越来越快了。”{p}说，“但他们站得越来越好。”' },\n      { t: '让他早点休息，别太累', fx: { p: { fit: 8, mood: 2 }, fatigue: -2 }, r: '{p}嘴上说不需要，晚上睡了十个小时。' }] },\n    { id: 'a_nuno', cat: '球员', who: NM, w: 2, t: '{p}在训练里连续三次插上到对方底线，三个传中，三个进球。门将气得把手套扔在了地上。', o: [\n      { t: '“比赛里就这么踢。”', fx: { atk: 1, p: { form: 1.5, mood: 2, ego: 3 }, morale: 1 }, r: '队友们围过来喊他“边路发动机”。' },\n      { t: '让他专心防守', fx: { board: 1, def: 1, p: { mood: -1 } }, r: '{p}耸耸肩：“边后卫也要有点自己的生活。”' }] },\n    { id: 'a_replay', cat: '教练', w: 1, once: true, when: function (c) { return c.S.week >= 14; }, t: '深夜，你在办公室翻看一段旧录像，是那个欧冠夜的庆典。门口传来敲门声，是维蒂尼亚。', o: [\n      { t: '请他进来，一起看完', fx: { unity: 3, morale: 2, p: { aff: 4 } }, r: '你们谁也没说话。结束的时候，他说：“教练，我们还可以再来一次。”' },\n      { t: '合上电脑，说“早点回去睡”', fx: { morale: 1 }, r: '你关了灯，走廊里的光比平时亮。' }] },\n    { id: 'young_star', cat: '球员', who: DO, w: 2, when: function (c) { return c.S.pl[DO].form > .6; }, t: '{p}最近状态火热，欧洲的几家豪门开始公开表达兴趣，经纪人也联系了俱乐部。', o: [\n      { t: '把他叫来，直接说清楚规划', fx: { p: { aff: 5, mood: 3, ego: 2 }, board: 1 }, r: '{p}听完点头：“教练，我愿意留在这里。”' },\n      { t: '什么都不说，让他自己做决定', fx: { p: { mood: -2, aff: -3, ego: 4 }, unity: -1 }, r: '他踢了几场球，状态忽高忽低。' }] },\n    { id: 'captain_speech', cat: '更衣室', who: MQ, w: 1, when: function (c) { return c.S.attrs.morale < 45; }, t: '士气不高。赛后更衣室里，{p}突然站起来，对全队说了几句话。', o: [\n      { t: '让他说完，你什么也不加', fx: { morale: 6, unity: 3, p: { aff: 3 } }, r: '没有人记得他具体说了什么，但所有人都记得那天晚上的灯光。' },\n      { t: '补充一句：“我们还没输。”', fx: { morale: 4, unity: 2 }, r: '这句话在更衣室里回响了一整晚。' }] },\n    { id: 'vitinha_bday', cat: '球员', who: VI, w: 1, t: '今天是{p}的生日。更衣室里有人偷偷订了蛋糕，但他一直装作没发现。', o: [\n      { t: '带头唱生日歌', fx: { morale: 3, unity: 3, p: { aff: 4, mood: 4 } }, r: '你唱得很难听，但没人敢笑。' },\n      { t: '“训练结束后再说。”', fx: { atk: 1, p: { aff: 1 } }, r: '训练一结束，蛋糕就被端了出来，所有人早已站好位置。' }] },\n    { id: 'kvara_dinner', cat: '更衣室', w: 1, when: function (c) { return c.S.pl[KV].mood > 55; }, t: '训练后，{p}把几个队友拉到一起，说要请他们吃家乡菜。他在餐厅后厨忙了一个下午，出来的时候脸都红了。'.replace('{p}', '克瓦拉茨赫利亚'), o: [\n      { t: '加入，当“试吃员”', fx: { unity: 3, morale: 3, chem: 1.5 }, r: '你被塞了第三块饼之后，终于说了一句“好吃”。' },\n      { t: '假装没看见，转身去办公室', fx: { unity: 1, morale: 1, fatigue: -1 }, r: '你关上门，听见走廊里传来一阵大笑。' }] },\n    { id: 'saint_denis', cat: '决赛周', w: 4, when: function (c) { return c.next && c.next.final && c.next.venue === '圣但尼 法兰西体育场' && soon(c, c.next.opp, 6); }, t: '法国杯决赛就在这周末，圣但尼的看台已经开始布置。更衣室里，有人想早点过去适应场地，有人想维持日常节奏，还有人悄悄问：“教练，决赛前一晚我们能不能看一场电影？”', o: [\n      { t: '提前一天去，熟悉球场', fx: { morale: 3, fatigue: 2, atk: 1 }, r: '空荡荡的法兰西体育场比想象中更大。维蒂尼亚绕着中圈走了三圈，说：“好，我记住了。”' },\n      { t: '维持日常节奏，照常训练', fx: { def: 1.5, atk: 1.5, unity: 1 }, r: '你什么也没改。就像之前每一个周三。' },\n      { t: '决赛前一晚，全队看电影', fx: { unity: 4, morale: 4, fatigue: -4 }, r: '放的是一部没人看过的老电影。没有人说话，也没有人睡着。' }] },\n    { id: 'press_trigger', cat: '训练', w: 2, once: true, t: '你在训练里反复强调一件事：丢球之后的五秒。助教拿着秒表数了一整个上午，结果是：今天的平均值是 6.2 秒。', o: [\n      { t: '再练一次，直到五秒以内', fx: { def: 2.5, fatigue: 4, unity: 1 }, r: '第三次的时候，所有人一起冲了出去，球场上像突然涨潮。' },\n      { t: '“六秒也行，别累着。”', fx: { cond: 1, fatigue: -2 }, r: '助教有点失望，但球员们笑了。' },\n      { t: '让维蒂尼亚来带队练', fx: { chem: 2, def: 1.5, p: { aff: 3 } }, r: '维蒂尼亚站在中圈，一个手势就让十个人同时压了上去。' }] },\n    { id: 'no_star', cat: '媒体', w: 2, once: true, t: '一个记者问你：“有人说，这支巴黎没有一个人比球队更大。你是不是有意为之？”', o: [\n      { t: '“是。因为只有这样才能赢。”', fx: { fans: 2, board: 1, unity: 1 }, r: '这句话被印在了更衣室的墙上。' },\n      { t: '“也有例外，但他们也都在跑。”', fx: { fans: 1, morale: 1 }, r: '记者笑着在本子上写：“教练说，所有人都在跑。”' },\n      { t: '什么都不说，只是笑', fx: { board: 1 }, r: '你没回答，但所有人都读懂了。' }] },\n\n    /* ================= 专属线：好感触发的个人剧情 =================\n       高好感线 3 段（好感达标 + 间隔数周才会出现）；低好感线 2 段（好感太低才会出现，有补救机会）。\n       flag 记录发生的周数，下一段靠它排先后。 */\n\n    /* ---- 登贝莱 · 被捧高之后 ---- */\n    { id: 'de_h1', cat: '专属线 · 登贝莱', who: DE, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, DE) >= 62 && !done(c, 'de_l1'); }, t: '训练结束，{p}晃着手机走过来，屏幕上全是夸他的标题。他半开玩笑地问：“教练，大家都说我是球队的灵魂。你同意吗？”', o: [\n      { t: '“灵魂是十一个人加起来的。你只是跑在最前面的那个。”', fx: { unity: 2, p: { aff: 6, mood: 3, ego: -3 }, flag: 'de1' }, r: '{p}大笑：“好吧，我是跑得最快的那一个。”' },\n      { t: '“你是最锋利的一把刀。别让别人把你磨钝了。”', fx: { atk: 1, p: { aff: 7, mood: 5, form: .6, ego: 2 }, flag: 'de1' }, r: '{p}把手机收起来：“这句我爱听。”' },\n      { t: '“那就让他们看看，灵魂怎么跑。”', fx: { def: 1, p: { aff: 5, mood: 3, form: .8 }, flag: 'de1' }, r: '第二天训练里，{p}回追到了底线，被球迷拍成了一条短视频。' }] },\n    { id: 'de_h2', cat: '专属线 · 登贝莱', who: DE, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'de1') >= 5 && aff(c, DE) >= 68 && (!done(c, 'de_l1') || done(c, 'de_fix')); }, t: '连续两场没有进球，一家媒体写了篇长文，标题是《他是不是不再是去年那个人了》。{p}在更衣室里读完，把手机扔进了柜子，对着墙站了一会儿。', o: [\n      { t: '赛后发布会，你把他的回追和压迫数据念了出来', fx: { fans: 2, p: { aff: 6, mood: 6, form: 1 }, flag: 'de2' }, r: '记者们没再追问。{p}在走廊里等你，什么也没说，只是把水递给了你。' },\n      { t: '私下找他：“别人怎么写，不影响你的位置。”', fx: { p: { aff: 7, mood: 6 }, flag: 'de2' }, r: '{p}沉默了很久：“我知道。我只是想听你说。”' },\n      { t: '什么都不说，让他用比赛回答', fx: { p: { form: 1.2, ego: 3, aff: 2, mood: -1 }, flag: 'de2' }, r: '那周{p}多跑了一公里。你在场边看着，没有鼓掌。' }] },\n    { id: 'de_h3', cat: '专属线 · 登贝莱', who: DE, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'de2') >= 6 && aff(c, DE) >= 72 && (!done(c, 'de_l1') || done(c, 'de_fix')); }, t: '欧冠关键战的前一晚，{p}敲开你的门。他难得一点笑容都没有：“教练，明天让我第一个压上去。哪怕被换下，哪怕一个球都不进。我想让他们知道，这支球队是怎么赢的。”', o: [\n      { t: '“那就第一个。我们都跟在你后面。”', fx: { def: 2, atk: 1, p: { aff: 5, mood: 8, form: 1.5, ovr: 1, ego: -3 }, flag: 'de3' }, r: '第二天，{p}第一个冲了上去，球场上像突然涨潮。' },\n      { t: '“你想怎么压，就怎么压。我来补位。”', fx: { chem: 2, p: { aff: 5, mood: 7, form: 1.2, ovr: .5 }, flag: 'de3' }, r: '那天，每个人都记住了他的第一次冲刺。' },\n      { t: '“你想着进球。压迫，交给大家。”', fx: { atk: 2, p: { aff: 3, mood: 5, form: 1.8, ego: 3, ovr: .5 }, flag: 'de3' }, r: '{p}笑了：“好，那我就当一次自私的人。”' }] },\n    { id: 'de_l1', cat: '专属线 · 登贝莱', who: DE, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, DE) <= 30 && !done(c, 'de2'); }, t: '{p}最近训练里不太笑了，来得晚走得早。有人听见他说：“反正怎么踢都是我的错。”助教问你要不要处理。', o: [\n      { t: '约他聊聊，别谈战术', roll: { p: .55, ok: { fx: { p: { aff: 10, mood: 6 }, flag: ['de_l1', 'de_fix'] }, r: '你们聊的是小时候的街头球场。{p}离开时说：“下次再聊。”' }, fail: { fx: { p: { aff: 2, mood: -2 }, flag: 'de_l1' }, r: '{p}礼貌地回答每一个问题，但你知道，他没有说真话。' } } },\n      { t: '在会上公开他的数据，要求他多参与', fx: { p: { aff: -5, mood: -5, ego: -3 }, unity: 2, flag: 'de_l1' }, r: '{p}没有反驳，只是看着那张幻灯片，看了很久。' },\n      { t: '让助教去聊', fx: { p: { aff: 1, mood: 1 }, flag: 'de_l1' }, r: '{p}知道是谁派来的。他礼貌地说了谢谢。' }] },\n    { id: 'de_l2', cat: '专属线 · 登贝莱', who: DE, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'de_l1') >= 4 && aff(c, DE) <= 35 && !done(c, 'de_fix'); }, t: '{p}的经纪人联系了俱乐部：有几家海外豪门表示了兴趣，“球员想知道，自己在这个项目里到底是什么位置”。CEO 把消息转给了你。', o: [\n      { t: '亲自找他谈，把规划摊开', roll: { p: .5, ok: { fx: { p: { aff: 14, mood: 8 }, flag: ['de_fix'] }, r: '你们谈了一个半小时。最后他说：“我留下，不是因为合同，是因为你说的那几个具体的计划。”' }, fail: { fx: { p: { aff: -3, mood: -8, form: -1 }, unity: -2, flag: 'de_cold' }, r: '{p}听完说：“我知道你想让我留下。但我想听的，不是这个。”' } } },\n      { t: '“赛季结束后，由你自己决定。”', fx: { p: { mood: 5, aff: 6, form: .5 }, flag: 'de_promise' }, r: '{p}长出了一口气：“谢谢。”你不确定自己是不是做对了。' },\n      { t: '“合同在，没有人可以随便离开。”', fx: { p: { aff: -8, mood: -8, ego: 3 }, unity: -2, flag: 'de_cold' }, r: '{p}什么都没说。第二天，他的柜子里少了几样东西。' }] },\n\n    /* ---- 克瓦拉茨赫利亚 · 左边的灯 ---- */\n    { id: 'kv_h1', cat: '专属线 · 克瓦拉茨赫利亚', who: KV, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, KV) >= 62 && !done(c, 'kv_l1'); }, t: '训练结束，{p}站在左路禁区角，一遍一遍地内切射门。灯亮起来了，他才抬头：“教练，有个角度我总是踢不好。你能陪我练吗？”', o: [\n      { t: '陪他练到最后一盏灯关掉', fx: { p: { aff: 6, form: 1.2, mood: 3 }, fatigue: 2, flag: 'kv1' }, r: '最后一脚，{p}把球送进了那个死角，笑得像个孩子。' },\n      { t: '让进攻教练去陪他', fx: { p: { aff: 2, form: .6 }, atk: 1, flag: 'kv1' }, r: '{p}点点头，没说什么，但你看到他回头看了你一眼。' },\n      { t: '“别想着角度，先想着传球。”', fx: { chem: 1.5, p: { aff: 4, ego: -3, mood: 1, form: .4 }, flag: 'kv1' }, r: '第二天训练，{p}传球的次数多了一倍。' }] },\n    { id: 'kv_h2', cat: '专属线 · 克瓦拉茨赫利亚', who: KV, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'kv1') >= 5 && aff(c, KV) >= 68 && (!done(c, 'kv_l1') || done(c, 'kv_fix')); }, t: '一场比赛里，{p}在门前错失了一个单刀。之后的二十分钟，他没有再要球。赛后更衣室里，他把自己关在淋浴间里很久。', o: [\n      { t: '敲门，递进去一条毛巾，什么也不说', fx: { p: { aff: 7, mood: 7 }, flag: 'kv2' }, r: '很久之后，{p}走出来：“那个球，我会记住很久。”' },\n      { t: '“那个球换了谁都会难过。但下一次，你会进。”', fx: { p: { aff: 6, mood: 6, form: .8 }, flag: 'kv2' }, r: '{p}点点头，眼眶有点红：“嗯。”' },\n      { t: '“明天训练，我们把单刀练一百遍。”', fx: { atk: 1, p: { aff: 5, form: 1.2, mood: 3 }, flag: 'kv2' }, r: '第二天{p}练到了第一百零一次，才肯走。' }] },\n    { id: 'kv_h3', cat: '专属线 · 克瓦拉茨赫利亚', who: KV, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'kv2') >= 6 && aff(c, KV) >= 72 && (!done(c, 'kv_l1') || done(c, 'kv_fix')); }, t: '赛季快结束了。{p}带来一个保鲜盒：“教练，我妈寄来的家乡菜。我想请全队吃一顿，不是为了庆祝什么，只是……我想让大家知道，我从哪里来。”', o: [\n      { t: '“好，今晚，所有人一起。”', fx: { unity: 5, morale: 4, p: { aff: 5, mood: 9, form: 1.2, ovr: 1 }, flag: 'kv3' }, r: '那天晚上，更衣室里弥漫着一种没人说得出名字的香味。{p}被塞了三次饼，笑得整个人都在抖。' },\n      { t: '“好，周末，带着家人一起来。”', fx: { unity: 4, fans: 2, p: { aff: 6, mood: 8, form: 1, ovr: .5 }, flag: 'kv3' }, r: '他母亲真的来了，带着一大袋香料。那一晚，所有人都吃撑了。' },\n      { t: '“好。但你要告诉我这道菜叫什么。”', fx: { unity: 3, morale: 3, p: { aff: 4, mood: 6, ovr: .5 }, flag: 'kv3' }, r: '{p}认真念了一遍名字。你们谁也没记住，但所有人都点了头。' }] },\n    { id: 'kv_l1', cat: '专属线 · 克瓦拉茨赫利亚', who: KV, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, KV) <= 30 && !done(c, 'kv2'); }, t: '{p}最近不再冒险了，每一次突破都停在边线附近，每一个传球都求稳。助教说：“他在担心自己踢错，更怕你在边线上失望地看他。”', o: [\n      { t: '单独约他，承认自己之前给的压力', roll: { p: .6, ok: { fx: { p: { aff: 11, mood: 6 }, flag: ['kv_l1', 'kv_fix'] }, r: '“我只是想知道，我做对的时候，有人看到吗？”{p}说。你把这句话记在了本子上。' }, fail: { fx: { p: { aff: 2, mood: 1 }, flag: 'kv_l1' }, r: '{p}点点头，但你知道，这件事不是一次谈话能解决的。' } } },\n      { t: '“你是左路的核心，这是你的职责。”', fx: { p: { aff: -5, mood: -6, form: -.5 }, unity: 1, flag: 'kv_l1' }, r: '{p}低着头，没有说话。' },\n      { t: '给他放两天假，什么都不要求', fx: { p: { aff: 3, mood: 5, fit: 8 }, flag: 'kv_l1' }, r: '两天后他回来了，眼神清楚了一些，也没提那件事。' }] },\n    { id: 'kv_l2', cat: '专属线 · 克瓦拉茨赫利亚', who: KV, force: true, story: true, once: true, when: function (c) { return c.S.week >= 16 && calm(c) && since(c, 'kv_l1') >= 4 && aff(c, KV) <= 35 && !done(c, 'kv_fix'); }, t: '{p}的经纪人联系了俱乐部：“他想去一个更自由、更少被拿来比较的环境。”CEO 把这条消息转给了你。', o: [\n      { t: '直接找他谈：“你要的自由，我给你。”', roll: { p: .5, ok: { fx: { p: { aff: 14, mood: 8, ego: 2 }, flag: 'kv_fix' }, r: '你们谈了一个小时。最后他说：“我没想到，你真的会听。”' }, fail: { fx: { p: { aff: -3, mood: -8, form: -1 }, unity: -2, flag: 'kv_cold' }, r: '{p}听完说：“你说得好听，但我已经不太相信了。”' } } },\n      { t: '“合同在，你不会走。”', fx: { p: { aff: -8, mood: -8, ego: 3 }, unity: -2, flag: 'kv_cold' }, r: '{p}什么都没说。第二天，他在训练里没有再看你一眼。' },\n      { t: '答应他：赛季结束后，由他自己选', fx: { p: { mood: 5, aff: 6, form: .5 }, flag: 'kv_promise' }, r: '{p}长出一口气：“谢谢你，教练。”你不确定这是不是对的决定。' }] },\n\n    /* ---- 杜埃 · 二十一岁 ---- */\n    { id: 'do_h1', cat: '专属线 · 杜埃', who: DO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, DO) >= 62 && !done(c, 'do_l1'); }, t: '训练后，{p}抱着头盔站在你面前：“教练，我什么时候才能连续首发十场？”他的语气很认真，也有一点怕。', o: [\n      { t: '“你想要首发，就先让每一次替补都值得。”', fx: { p: { aff: 6, mood: 3, form: .8, ego: -1 }, flag: 'do1' }, r: '{p}点点头：“我懂了。”下一次训练，他的每个触球都像在争那一个名额。' },\n      { t: '“十场我给不了。但每一场，你都有机会。”', fx: { p: { aff: 7, mood: 5 }, flag: 'do1' }, r: '{p}松了一口气：“只要有机会，我就够了。”' },\n      { t: '让他和队长聊聊', fx: { unity: 2, p: { aff: 5, mood: 4 }, flag: 'do1' }, r: '马尔基尼奥斯带他走了一圈球场，回来的时候，{p}笑得比平时安静。' }] },\n    { id: 'do_h2', cat: '专属线 · 杜埃', who: DO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'do1') >= 5 && aff(c, DO) >= 68 && (!done(c, 'do_l1') || done(c, 'do_fix')); }, t: '前几周媒体把{p}捧成了“下一个传奇”，昨天一次失误之后，同一批媒体又写：“被捧得太高了”。他坐在更衣室里，一直没抬头。', o: [\n      { t: '坐到他旁边，一句话也不说', fx: { unity: 1, p: { aff: 8, mood: 8 }, flag: 'do2' }, r: '十分钟后，{p}把头盔放下，说：“谢谢你没有说话。”' },\n      { t: '“他们捧你，是因为你踢得好。他们骂你，是因为你踢得不够好。两个都和我无关。”', fx: { p: { aff: 5, mood: 5, ego: -2, form: .6 }, flag: 'do2' }, r: '{p}愣了一下，然后笑了：“教练，你好冷酷。”' },\n      { t: '让维蒂尼亚去陪他', fx: { unity: 2, p: { aff: 4, mood: 5 }, flag: 'do2' }, r: '维蒂尼亚和他在更衣室待了很久。出来的时候，{p}笑了一下。' }] },\n    { id: 'do_h3', cat: '专属线 · 杜埃', who: DO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'do2') >= 6 && aff(c, DO) >= 72 && (!done(c, 'do_l1') || done(c, 'do_fix')); }, t: '赛季快结束了，{p}在你的办公室门口站了很久，才开口：“教练，我以前总想成为‘大人物’。现在我只想成为一个……被这支球队需要的人。”', o: [\n      { t: '“你已经是了。”', fx: { p: { aff: 5, mood: 8, form: 1.5, ovr: 1 }, flag: 'do3' }, r: '{p}把头盔抱紧了一点：“谢谢，教练。”' },\n      { t: '“明年你来带新人。”', fx: { unity: 2, p: { aff: 5, mood: 7, form: 1, ovr: .5, ego: 2 }, flag: 'do3' }, r: '{p}眼睛一亮：“真的？那我得先学会怎么不骂人。”' },\n      { t: '“那就继续，别停。”', fx: { atk: 1.5, p: { aff: 4, mood: 6, form: 1.5, ovr: .5 }, flag: 'do3' }, r: '{p}点点头。那一周，他的每个球都带着一点“被需要”的味道。' }] },\n    { id: 'do_l1', cat: '专属线 · 杜埃', who: DO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, DO) <= 30 && !done(c, 'do2'); }, t: '{p}的传球越来越保守，每一脚都是安全球。有人在更衣室里听见他说：“我不想再被当着所有人的面吼了。”', o: [\n      { t: '单独找他，先道歉', roll: { p: .65, ok: { fx: { p: { aff: 11, mood: 6 }, flag: ['do_l1', 'do_fix'] }, r: '“我没想到你会道歉。”{p}说，“我以为……我只是个听话的人。”' }, fail: { fx: { p: { aff: 3, mood: 1 }, flag: 'do_l1' }, r: '{p}点点头，但你知道，他需要更久的时间。' } } },\n      { t: '“比赛不是幼儿园。”', fx: { p: { aff: -6, mood: -8, form: -.6, ego: -3 }, unity: 1, flag: 'do_l1' }, r: '{p}没有哭，也没有反驳，只是低着头走开了。' },\n      { t: '给他放两天假，什么都不要求', fx: { p: { aff: 3, mood: 5, fit: 8 }, flag: 'do_l1' }, r: '两天后他回来了，眼神清楚了一些，也没提那件事。' }] },\n    { id: 'do_l2', cat: '专属线 · 杜埃', who: DO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 16 && calm(c) && since(c, 'do_l1') >= 4 && aff(c, DO) <= 35 && !done(c, 'do_fix'); }, t: '本地媒体的头条是{p}的经纪人说的一句话：“他在这里被低估了。”这周的更衣室，没人敢提这个名字。', o: [\n      { t: '约经纪人、{p}和 CEO 一起谈', roll: { p: .5, ok: { fx: { board: 1, p: { aff: 12, mood: 6 }, flag: 'do_fix' }, r: '谈到最后，{p}说：“我只是想知道，我在这里是有未来的。”' }, fail: { fx: { board: -1, p: { aff: -2, mood: -2 }, flag: 'do_cold' }, r: '谈判桌上，经纪人说得最多，{p}一句话都没说。' } } },\n      { t: '对媒体说：“这是球员和俱乐部之间的事。”', fx: { fans: -1, p: { aff: -3, mood: -2 }, flag: 'do_cold' }, r: '新闻第二天就被别的新闻盖过去了，但{p}没有忘。' },\n      { t: '给他更重要的位置和更多的信任', fx: { unity: -1, p: { aff: 8, mood: 8, ego: 6, form: -.3 }, flag: 'do_fix' }, r: '{p}在训练场上喊了几次队友的名字，声音比平时大。' }] },\n\n    /* ---- 维蒂尼亚 · 第二双眼睛 ---- */\n    { id: 'vi_h1', cat: '专属线 · 维蒂尼亚', who: VI, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, VI) >= 62 && !done(c, 'vi_l1'); }, t: '训练后，{p}拿着一张手写的压迫触发图走过来：“教练，如果对方的右后卫接球的时候，我们在这里先拉一个人，会不会更好？”', o: [\n      { t: '“你来给大家讲。”', fx: { chem: 2, def: 1.5, p: { aff: 6, mood: 5, ego: 2 }, flag: 'vi1' }, r: '{p}站在战术板前讲了五分钟。每个人都点了头。' },\n      { t: '“很好。我们一起试一次。”', fx: { def: 1.5, chem: 1.5, p: { aff: 7, mood: 4, form: .5 }, flag: 'vi1' }, r: '你们在训练场上排了三遍。第三遍，所有人同时冲了出去。' },\n      { t: '“放进下一场的计划里。”', fx: { def: 2, p: { aff: 5, mood: 5, form: .7 }, flag: 'vi1' }, r: '那场球，对方的右后卫被压得一脚球都没法出。{p}在场上冲着你抬了抬下巴。' }] },\n    { id: 'vi_h2', cat: '专属线 · 维蒂尼亚', who: VI, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'vi1') >= 5 && aff(c, VI) >= 68 && (!done(c, 'vi_l1') || done(c, 'vi_fix')); }, t: '上半场，{p}没有等你指令，自己调整了中场的站位。球队压着对手打，但赛后记者问：“这是谁的决定？”所有人都看着你。', o: [\n      { t: '“是我们的决定。”', fx: { unity: 3, p: { aff: 7, mood: 7 }, flag: 'vi2' }, r: '{p}在走廊里等你，什么也没说，只是把水递给了你。' },\n      { t: '“是他的决定。他比我先看到。”', fx: { fans: 2, p: { aff: 6, mood: 8, ego: 3 }, flag: 'vi2' }, r: '那天晚上，{p}一个人在训练场多待了一会儿。' },\n      { t: '“下次，请在场边告诉我。”', fx: { p: { aff: 3, mood: -1, ego: -3 }, flag: 'vi2' }, r: '{p}点点头：“好。下次，我会先看你一眼。”' }] },\n    { id: 'vi_h3', cat: '专属线 · 维蒂尼亚', who: VI, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'vi2') >= 6 && aff(c, VI) >= 72 && (!done(c, 'vi_l1') || done(c, 'vi_fix')); }, t: '赛季的最后阶段，{p}忽然问：“教练，如果有一天你不在这里，我们还会这么踢吗？”他看着你，认真地等着。', o: [\n      { t: '“会。因为这套东西，已经长在你们身上了。”', fx: { unity: 3, chem: 2, p: { aff: 5, mood: 8, form: 1.2, ovr: 1 }, flag: 'vi3' }, r: '{p}想了一会儿，点点头：“那我们就继续踢。”' },\n      { t: '“如果我不在，你来当我。”', fx: { chem: 2.5, p: { aff: 5, mood: 7, ego: 3, form: 1, ovr: .5 }, flag: 'vi3' }, r: '{p}笑了：“那你得先教我骂裁判。”' },\n      { t: '“别想这个。明天，我们还要赢一场。”', fx: { morale: 2, p: { aff: 3, mood: 5, form: 1.2, ovr: .5 }, flag: 'vi3' }, r: '{p}点点头：“好。明天。”' }] },\n    { id: 'vi_l1', cat: '专属线 · 维蒂尼亚', who: VI, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, VI) <= 30 && !done(c, 'vi2'); }, t: '{p}不再主动给出建议了。训练里，他只做被要求的事。一个年轻球员悄悄对你说：“他以前会教我们，现在不说话了。”', o: [\n      { t: '单独约他，承认自己没有认真听他的', roll: { p: .6, ok: { fx: { p: { aff: 11, mood: 6 }, flag: ['vi_l1', 'vi_fix'] }, r: '“我只是想知道，我说的话有没有人在听。”{p}说。你把这句话记在了本子上。' }, fail: { fx: { p: { aff: 2, mood: 1 }, flag: 'vi_l1' }, r: '{p}点点头，但你知道，这件事不是一次谈话能解决的。' } } },\n      { t: '“战术是教练组定的，你只管执行。”', fx: { p: { aff: -5, mood: -6, form: -.4 }, unity: 1, flag: 'vi_l1' }, r: '{p}低着头，没有说话。' },\n      { t: '给他放两天假，什么都不要求', fx: { p: { aff: 3, mood: 5, fit: 8 }, flag: 'vi_l1' }, r: '两天后他回来了，眼神清楚了一些，也没提那件事。' }] },\n    { id: 'vi_l2', cat: '专属线 · 维蒂尼亚', who: VI, force: true, story: true, once: true, when: function (c) { return c.S.week >= 16 && calm(c) && since(c, 'vi_l1') >= 4 && aff(c, VI) <= 35 && !done(c, 'vi_fix'); }, t: '更衣室里出现了微妙的分化：喜欢听{p}的年轻球员站在他那边，习惯另一套节奏的老球员站在另一边。训练里，两拨人连传球都刻意绕开对方。', o: [\n      { t: '请{p}当面谈，把话说开', roll: { p: .5, ok: { fx: { unity: 6, p: { aff: 14, mood: 6 }, flag: 'vi_fix' }, r: '你们谈了整整一个下午。出来的时候，他重新站在了中圈。' }, fail: { fx: { unity: -4, p: { aff: -2, mood: -3 }, flag: 'vi_cold' }, r: '“你需要的是一个只会执行的中场。”{p}说，“我不是那种人。”' } } },\n      { t: '把他的位置挪到边上，减轻责任', fx: { p: { aff: -10, mood: -10, ego: 4 }, unity: -4, flag: 'vi_cold' }, r: '{p}沉默地照做了，但训练之后，他一个人坐了很久。' },\n      { t: '“所有人到会议室，一个一个说。”', fx: { unity: 1, p: { aff: -3, mood: -2 }, flag: 'vi_cold' }, r: '会开了两个小时。该说的都说了，但有些东西没有被说开。' }] },\n\n    /* ---- 马尔基尼奥斯 · 队长的位置 ---- */\n    { id: 'mq_h1', cat: '专属线 · 马尔基尼奥斯', who: MQ, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, MQ) >= 62 && !done(c, 'mq_l1'); }, t: '训练结束，{p}在你办公室门口站了很久才敲门。“教练，我三十二了。每一场我都在想，是不是最后一场。你需要我，还是我只是习惯了待在这里？”', o: [\n      { t: '“球队需要的不是你的腿，是你在场上说的每一句话。”', fx: { p: { aff: 6, mood: 5 }, unity: 2, flag: 'mq1' }, r: '{p}沉默了一下，说：“那我就多说几句。”' },\n      { t: '把战术板推给他：“你来告诉我，下一场防线怎么站。”', fx: { def: 2, p: { aff: 8, mood: 4, ego: 3 }, chem: 2, flag: 'mq1' }, r: '{p}看了你很久，然后拿起了笔。' },\n      { t: '“赛季结束再说。现在只想赢下一场。”', fx: { p: { aff: 2, form: .3 }, flag: 'mq1' }, r: '{p}点点头：“好，那就先赢。”' }] },\n    { id: 'mq_h2', cat: '专属线 · 马尔基尼奥斯', who: MQ, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'mq1') >= 5 && aff(c, MQ) >= 68 && (!done(c, 'mq_l1') || done(c, 'mq_fix')); }, t: '最近几天，更衣室里的气氛不太对。{p}没有等你开口，把全队叫进更衣室，关上了门。二十分钟后，大家一个一个走出来，没有人说里面发生了什么。', o: [\n      { t: '什么也不问：“你们的事，你们自己说了算。”', fx: { unity: 5, chem: 2, morale: 3, p: { aff: 5, mood: 3 }, flag: 'mq2' }, r: '{p}路过你身边，轻轻拍了拍你的肩，什么也没说。' },\n      { t: '事后问他，里面说了什么', fx: { unity: 3, p: { aff: 3, mood: 2 }, flag: 'mq2' }, r: '“说了点你不会让我说的话。”{p}说完，自己先笑了。' },\n      { t: '“下次叫我一起进去。”', fx: { unity: 1, p: { aff: 2, mood: -1, ego: 1 }, flag: 'mq2' }, r: '{p}想了想：“那下次，我提前通知你。”' }] },\n    { id: 'mq_h3', cat: '专属线 · 马尔基尼奥斯', who: MQ, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'mq2') >= 6 && aff(c, MQ) >= 72 && (!done(c, 'mq_l1') || done(c, 'mq_fix')); }, t: '欧冠关键战的前夜，{p}把一张手写的小卡片放在你桌上，没有打开。“我有些话，要等赛季结束时告诉你。”他说，“但今天不是说它的日子。今天我只想把剩下的比赛踢完。”', o: [\n      { t: '“那就踢完。我们一起把它踢完。”', fx: { p: { aff: 5, mood: 8, form: 1.5, ovr: .5 }, morale: 4, unity: 3, flag: 'mq3' }, r: '{p}把卡片收了回去，说：“那我们就好好踢。”' },\n      { t: '让他自己决定，下一场要不要首发', roll: { p: .7, ok: { fx: { p: { aff: 6, mood: 6, ego: 4, form: 1.5, ovr: .5 }, unity: 2, flag: 'mq3' }, r: '他选了首发。那场球，他一次都没有停下来喘气。' }, fail: { fx: { p: { aff: 3, mood: 2, form: .5 }, flag: 'mq3' }, r: '他选了坐在板凳上，在场边指挥了整整九十分钟。' } } },\n      { t: '“你不用告诉我，我已经知道了。”', fx: { p: { aff: 4, mood: 5, form: 1 }, morale: 3, flag: 'mq3' }, r: '{p}笑了，眼眶有点红：“这么多年，还是瞒不过你。”' }] },\n    { id: 'mq_l1', cat: '专属线 · 马尔基尼奥斯', who: MQ, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, MQ) <= 30 && !done(c, 'mq2'); }, t: '{p}不再在更衣室里替你说话了。年轻球员们开始自己看你的脸色，赛前动员，也没有人站起来。', o: [\n      { t: '单独约他，问他怎么想', roll: { p: .6, ok: { fx: { p: { aff: 10, mood: 5 }, unity: 2, flag: ['mq_l1', 'mq_fix'] }, r: '“我只是觉得，你已经不太听我们的了。”{p}说。你把这句话记在了本子上。' }, fail: { fx: { p: { aff: 1 }, unity: -1, flag: 'mq_l1' }, r: '{p}说“没事”，说得很快。' } } },\n      { t: '公开让他重新担起队长的责任', fx: { p: { aff: -4, mood: -3 }, unity: 1, flag: 'mq_l1' }, r: '{p}站起来，说了几句标准的话。每个人都听出来，那不是他自己的话。' },\n      { t: '先不管，看看球队能不能自己走出来', fx: { unity: -3, p: { aff: -2 }, flag: 'mq_l1' }, r: '这周的更衣室，安静得有点奇怪。' }] },\n    { id: 'mq_l2', cat: '专属线 · 马尔基尼奥斯', who: MQ, force: true, story: true, once: true, when: function (c) { return c.S.week >= 16 && calm(c) && since(c, 'mq_l1') >= 4 && aff(c, MQ) <= 35 && !done(c, 'mq_fix'); }, t: '更衣室里出现了“两派”：老球员站在{p}这边，年轻球员站在你这边。训练时，两拨人连传球都刻意绕开对方。', o: [\n      { t: '请{p}当面谈，把话说开', roll: { p: .5, ok: { fx: { unity: 6, p: { aff: 14, mood: 6 }, flag: 'mq_fix' }, r: '你们谈了整整一个下午。出来的时候，他把袖标重新戴了回去。' }, fail: { fx: { unity: -4, p: { aff: -2, mood: -3 }, flag: 'mq_cold' }, r: '“你需要的是一个听话的队长。”{p}说，“我不是那种人。”' } } },\n      { t: '把袖标交给别人', fx: { p: { aff: -10, mood: -10, ego: 4 }, unity: -4, flag: 'mq_cold' }, r: '袖标换了人，{p}坐在更衣室最靠里的位置，很久没有动。' },\n      { t: '“所有人到会议室，一个一个说。”', fx: { unity: 1, p: { aff: -3, mood: -2 }, flag: 'mq_cold' }, r: '会开了两个小时。该说的都说了，但有些东西没有被说开。' }] },\n\n    /* ---- 努诺·门德斯 · 边路发动机 ---- */\n    { id: 'nm_h1', cat: '专属线 · 努诺·门德斯', who: NM, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, NM) >= 62 && !done(c, 'nm_l1'); }, t: '训练结束，{p}笑嘻嘻地凑过来：“教练，我想试试上到前面去，当边锋。我的传中比他们踢得好。”', o: [\n      { t: '“可以。但你的身后，我们要想办法补。”', fx: { atk: 1.5, def: -.5, p: { aff: 6, mood: 5, form: .8, ego: 2 }, flag: 'nm1' }, r: '{p}大笑：“你放心，我会跑回来的。”' },\n      { t: '“你先把防守做到最好，再说进攻。”', fx: { def: 1.5, p: { aff: 4, mood: -1, ego: -3, form: .4 }, flag: 'nm1' }, r: '{p}撇了撇嘴：“好吧，我先当个最好的后卫。”' },\n      { t: '“给你一场比赛，让我看看。”', fx: { p: { aff: 6, mood: 6, form: .6 }, flag: 'nm1' }, r: '那场比赛，{p}一个人跑了十二公里。' }] },\n    { id: 'nm_h2', cat: '专属线 · 努诺·门德斯', who: NM, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'nm1') >= 5 && aff(c, NM) >= 68 && (!done(c, 'nm_l1') || done(c, 'nm_fix')); }, t: '一场比赛里，{p}因为一次冲动的铲球吃了红牌，球队少一人打完了下半场。赛后，他一个人坐在更衣室门口，没有进去。', o: [\n      { t: '坐到他旁边，什么也不说', fx: { unity: 1, p: { aff: 8, mood: 8 }, flag: 'nm2' }, r: '十分钟后，{p}站起来，说：“下次，我会先数到三。”' },\n      { t: '“你那一脚是为了球队。下次，换个方式。”', fx: { p: { aff: 6, mood: 5, ego: -3, form: .8 }, flag: 'nm2' }, r: '{p}点点头：“好。”' },\n      { t: '“罚你一周加练，但你还是我的人。”', fx: { fatigue: 2, p: { aff: 5, mood: 3, ego: -4, form: .6 }, flag: 'nm2' }, r: '{p}大笑：“好，好，一周就一周。”' }] },\n    { id: 'nm_h3', cat: '专属线 · 努诺·门德斯', who: NM, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'nm2') >= 6 && aff(c, NM) >= 72 && (!done(c, 'nm_l1') || done(c, 'nm_fix')); }, t: '赛季快结束了，{p}忽然安静下来：“教练，我想当一个稳的人。不是最快的，是最让你放心的。”', o: [\n      { t: '“你已经是了。”', fx: { def: 2, p: { aff: 5, mood: 8, form: 1.5, ovr: 1 }, flag: 'nm3' }, r: '{p}笑了：“那我就把这句话当成合同。”' },\n      { t: '“那就继续，每一场，都像这一场。”', fx: { def: 1.5, atk: 1, p: { aff: 5, mood: 6, form: 1.2, ovr: .5 }, flag: 'nm3' }, r: '{p}大声说：“好！”' },\n      { t: '“你可以继续冲。我来替你守稳。”', fx: { atk: 2, p: { aff: 4, mood: 7, ego: 2, form: 1.3, ovr: .5 }, flag: 'nm3' }, r: '{p}挠了挠头：“那……我还是想冲。”你们同时笑了。' }] },\n    { id: 'nm_l1', cat: '专属线 · 努诺·门德斯', who: NM, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, NM) <= 30 && !done(c, 'nm2'); }, t: '{p}最近训练里总是和人起冲突，每次都是一点小事。助教说：“他在憋着一口气，但不知道对谁。”', o: [\n      { t: '单独约他跑一圈，边跑边聊', roll: { p: .55, ok: { fx: { p: { aff: 10, mood: 6 }, flag: ['nm_l1', 'nm_fix'] }, r: '跑到第五圈的时候，{p}说：“我只是觉得，自己好像一直在被盯着。”' }, fail: { fx: { p: { aff: 2, mood: -2 }, flag: 'nm_l1' }, r: '{p}跑得很快，也不想说话。' } } },\n      { t: '当众点名，给全队立规矩', fx: { p: { aff: -5, mood: -5, ego: -3 }, unity: 2, flag: 'nm_l1' }, r: '更衣室安静了。{p}没有反驳，只是低头系鞋带，系了很久。' },\n      { t: '让助教去聊聊', fx: { p: { aff: 1, mood: 1 }, flag: 'nm_l1' }, r: '{p}知道是谁派来的。他礼貌地说了谢谢。' }] },\n    { id: 'nm_l2', cat: '专属线 · 努诺·门德斯', who: NM, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'nm_l1') >= 4 && aff(c, NM) <= 35 && !done(c, 'nm_fix'); }, t: '训练赛中被换下，{p}把训练背心甩在草地上，头也不回地走进了球员通道。队友们愣在原地，等着你的反应。', o: [\n      { t: '追过去，在通道里一个人跟他谈', roll: { p: .5, ok: { fx: { p: { aff: 14, mood: 6, ego: -8 }, flag: 'nm_fix' }, r: '你们在通道里站了十分钟。他回到场上的时候，把背心重新穿上了。' }, fail: { fx: { p: { aff: -3, mood: -6 }, unity: -2, flag: 'nm_cold' }, r: '{p}靠着墙，一句话也不说。最后你先回了球场。' } } },\n      { t: '罚款，并要求他当众道歉', fx: { p: { aff: -8, mood: -8, ego: -10 }, unity: 3, board: 1, flag: 'nm_cold' }, r: '道歉很标准，也很冷。{p}说完就走了。' },\n      { t: '当作什么都没发生，让他自己冷静', fx: { p: { aff: -3, ego: 4, mood: -3 }, unity: -3, flag: 'nm_cold' }, r: '训练继续了。但所有人都看得出，今天什么都没有被解决。' }] }\n  ],\n\n  /* 梗图鉴（成就）：check(S, H, final) 返回 true 就解锁 */\n  achievements: [\n    { id: 'first', name: '第一周', desc: '完成第一周的排程', check: function (S) { return S.week >= 1; } },\n    { id: 'derby', name: '法国德比', desc: '联赛中赢下一场对马赛的比赛', check: function (S) { return S.hist.some(function (h) { return h.opp === 'OM' && h.cn === '法甲' && h.out === 'W'; }); } },\n    { id: 'bigwin', name: '血洗', desc: '一场比赛净胜三球以上', check: function (S) { return S.stats.bigWins >= 1; } },\n    { id: 'streak8', name: '一场一场来', desc: '各项赛事 8 连胜', check: function (S) { return S.streak >= 8; } },\n    { id: 'unbeaten10', name: '十场不败', desc: '各项赛事 10 场不败', check: function (S) { return S.unbeaten >= 10; } },\n    { id: 'talks20', name: '心灵导师', desc: '累计找球员谈话 20 次', check: function (S) { return S.stats.talks >= 20; } },\n    { id: 'unity85', name: '一起跑', desc: '更衣室团结达到 85', check: function (S) { return S.attrs.unity >= 85; } },\n    { id: 'atk80', name: '短传推进', desc: '进攻体系达到 80', check: function (S) { return S.attrs.atk >= 80; } },\n    { id: 'def80', name: '丢球后的五秒', desc: '防守体系达到 80', check: function (S) { return S.attrs.def >= 80; } },\n    { id: 'ucl_qf', name: '八强之上', desc: '欧冠打进八强', check: function (S) { var u = S.ucl; return u.stage === 'sf' || u.stage === 'f' || u.stage === 'won' || (u.exit && ['qf', 'sf', 'f'].indexOf(u.exit) >= 0); } },\n    { id: 'liga', name: '继续称霸法甲', desc: '拿下法甲冠军', check: function (S, H, final) { return final && S.ending && S.ending.rank === 1; } },\n    { id: 'cdf', name: '圣但尼的夜晚', desc: '拿下法国杯', check: function (S) { return S.trophies.indexOf('法国杯') >= 0; } },\n    { id: 'ucl', name: '大耳朵杯，再一次', desc: '拿下欧冠', check: function (S) { return S.trophies.indexOf('欧冠') >= 0; } },\n    { id: 'treble', name: '三冠王', desc: '同一赛季拿下法甲、法国杯和欧冠', check: function (S) { var t = S.trophies; return t.indexOf('欧冠') >= 0 && t.indexOf('法国杯') >= 0 && t.indexOf('法甲') >= 0; } },\n    { id: 'goal30', name: '一起进球', desc: '登贝莱与克瓦拉茨赫利亚赛季合计进球达到 40', check: function (S) { return S.pl[DE].goals + S.pl[KV].goals >= 40; } },\n    { id: 'fortress', name: '王子公园堡垒', desc: '整个法甲赛季主场不败', check: function (S, H, final) { if (!final) return false; var hs = S.hist.filter(function (h) { return h.cn === '法甲' && h.h; }); return hs.length >= 17 && !hs.some(function (h) { return h.out === 'L'; }); } },\n    { id: 'story_de', name: '第一个压上去的人', desc: '走完登贝莱的专属线', check: function (S) { return !!S.flags.de3; } },\n    { id: 'story_kv', name: '家乡菜', desc: '走完克瓦拉茨赫利亚的专属线', check: function (S) { return !!S.flags.kv3; } },\n    { id: 'story_do', name: '被需要的人', desc: '走完杜埃的专属线', check: function (S) { return !!S.flags.do3; } },\n    { id: 'story_vi', name: '如果你不在', desc: '走完维蒂尼亚的专属线', check: function (S) { return !!S.flags.vi3; } },\n    { id: 'story_mq', name: '没有打开的卡片', desc: '走完马尔基尼奥斯的专属线', check: function (S) { return !!S.flags.mq3; } },\n    { id: 'story_nm', name: '最让你放心的人', desc: '走完努诺·门德斯的专属线', check: function (S) { return !!S.flags.nm3; } },\n    { id: 'story_all', name: '六个故事，一个更衣室', desc: '同一赛季走完六条专属线', check: function (S) { var f = S.flags; return !!(f.de3 && f.kv3 && f.do3 && f.vi3 && f.mq3 && f.nm3); } },\n    { id: 'fix', name: '冰释前嫌', desc: '把一段正在破裂的关系拉了回来', check: function (S) { var f = S.flags; return !!(f.de_fix || f.kv_fix || f.do_fix || f.vi_fix || f.mq_fix || f.nm_fix); } },\n    { id: 'cold', name: '谈崩了', desc: '一名核心球员和你的关系彻底破裂', check: function (S) { var f = S.flags; return !!(f.de_cold || f.kv_cold || f.do_cold || f.vi_cold || f.mq_cold || f.nm_cold); } },\n    { id: 'endall', name: '全结局收藏家', desc: '集齐结局图鉴里的所有结局', check: function () { return false; } }\n  ],\n\n  /* 结局 */\n  endings: function (S, r) {\n    var t = r.tro, has = function (n) { return t.indexOf(n) >= 0; };\n    var liga = has('法甲'), cdf = has('法国杯'), ucl = has('欧冠');\n    var head, body, grade;\n    if (r.fired) { head = '提前离开的人'; grade = 'D'; body = '董事会的耐心比赛季更短。你收拾办公室的时候，更衣室里没有人说话，直到最后一个人走过来，把那件训练服还给你。\\n你在门口回头看了一眼，对自己说：一场一场来。'; }\n    else if (liga && cdf && ucl) { head = '三冠王'; grade = 'S+'; body = '联赛、法国杯、欧冠，三座奖杯整整齐齐。那天晚上的王子公园，没有人愿意回家。\\n你想起那句话：“没有一个人比集体更大。”这一次，所有人都信了。'; }\n    else if (ucl && liga) { head = '欧冠与法甲双冠'; grade = 'S'; body = '大耳朵杯捧起来的那一刻，你抬头看了一眼看台。第一次，你没有躲开镜头。\\n联赛和欧洲，同一个赛季，同一支球队。'; }\n    else if (ucl && cdf) { head = '欧冠与法国杯双冠'; grade = 'S'; body = '欧冠与法国杯，一个赛季两次站上最高的地方。联赛的遗憾，被夜晚的灯光盖住了一点。'; }\n    else if (ucl) { head = '大耳朵杯'; grade = 'S'; body = '欧冠夜的哨声响起时，你站在原地，等所有人都抱在了一起，才慢慢走过去。\\n你想：原来是这么重。'; }\n    else if (liga && cdf) { head = '国内双冠'; grade = 'A+'; body = '联赛冠军和法国杯同时到手。球迷在街头唱了一整夜，对手们的窗户都关得紧紧的。\\n欧洲的故事，留给明年。'; }\n    else if (liga) { head = '法甲冠军'; grade = 'A'; body = '最后一轮结束的哨声响起时，你没有冲到场边。你站在原地，等所有人都抱在了一起，才慢慢走过去。\\n又一座联赛冠军，被带回了王子公园。'; }\n    else if (r.ucl === 'f') { head = '决赛夜的
