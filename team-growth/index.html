否发生过；since 距那段过了几周（没发生过返回 -1）；calm 不和上一个事件挤在同一周 */\nfunction aff(c, id) { return c.S.pl[id].aff; }\nfunction done(c, k) { return !!c.S.flags[k]; }\nfunction since(c, k) { var f = c.S.flags[k]; return f ? c.S.week - (f - 1) : -1; }\nfunction calm(c) { return c.S.week - c.S.lastEvent >= 1; }\nreturn {\n  id: 'che', title: '切尔西养成计划', version: '1.0', saveVersion: 1,\n  saveKey: 'che-yangcheng-v1@20261016a',\n  bonusScale: 5.5, calib: -5, club: 'CHE', short: '切尔西', coach: '阿隆索', stadium: '斯坦福桥', motto: 'Chelsea FC · 2026–27',\n  seasonStart: '2026-08-17', seasonEnd: '2027-06-14',\n  author: '作者：发财喵喵 · 由 Claude 生成',\n  disclaimer: '本游戏为 Claude 生成的球迷自制内容，球员数值与赛程来自公开数据整理，剧情与人物性格皆为虚构，与真实人物、俱乐部无关。',\n  theme: {\n    light: { plate: '#034694', plateInk: '#FFFFFF', accent: '#034694', accentText: '#033B7A', tint: '#E6EDF7', navy: '#0A2A5C' },\n    dark: { plate: '#0A2A5C', plateInk: '#FFFFFF', accent: '#4D86D4', accentText: '#9CC0F2', tint: '#12233F', navy: '#9CC0F2' }\n  },\n  /* 没有 ucl 字段 = 本赛季无欧战 */\n  cups: [\n    { id: 'EFL', name: '联赛杯', rounds: [\n      { st: 'r2', name: '第二轮', date: '2026-08-27', opp: 'LUT', home: true, noET: true },\n      { st: 'r3', name: '第三轮', date: '2026-09-09', opp: 'LEE', home: true, noET: true },\n      { st: 'r4', name: '第四轮', date: '2026-10-28', opp: 'LIV', home: false, noET: true },\n      { st: 'qf', name: '八强战', date: '2026-12-16', noET: true, topWeight: 3, lowerWeight: .7 },\n      { st: 'sf', name: '半决赛', dates: ['2027-01-13', '2027-02-03'], noET: true, topWeight: 5, lowerWeight: .4 },\n      { st: 'f', name: '决赛', date: '2027-03-21', neutral: true, venue: '温布利球场', final: true, topWeight: 8, lowerWeight: .2 }] },\n    { id: 'FA', name: '足总杯', rounds: [\n      { st: 'r3', name: '第三轮', date: '2027-01-09', topWeight: .5, lowerWeight: 2 },\n      { st: 'r4', name: '第四轮', date: '2027-02-13', topWeight: 1, lowerWeight: 1.5 },\n      { st: 'r5', name: '第五轮', date: '2027-03-06', topWeight: 2, lowerWeight: 1 },\n      { st: 'qf', name: '八强战', date: '2027-04-03', topWeight: 4, lowerWeight: .6 },\n      { st: 'sf', name: '半决赛', date: '2027-04-24', neutral: true, venue: '温布利球场', topWeight: 8, lowerWeight: .2 },\n      { st: 'f', name: '决赛', date: '2027-05-22', neutral: true, venue: '温布利球场', final: true, topWeight: 12, lowerWeight: .1 }] }\n  ],\n  rivals: ['ARS', 'TOT', 'LIV'],\n  intro: '你在利物浦、皇马和拜仁都踢过中场，在勒沃库森带出过整整一个赛季不败的联赛冠军。现在，你坐在了斯坦福桥的教练席上：名单上有二十七个名字，周二周三的夜晚没有欧战，只有联赛和两个杯赛。\\n\\n董事会没有给你新的承诺，只给了你一张周历。每个周一，你可以看数值、找球员聊聊，然后把这一周的训练一格一格排满。剩下的，交给周末。',\n\n  /* 关键球员：养成的主要对象。tags 决定谈话效果；aff 好感初值；ego 傲气初值 */\n  keyPlayers: [\n    { id: JA, tags: ['leader', 'pressure'], aff: 55, ego: 40, role: '右后卫 · 队长', blurb: '把袖标戴在左臂上的人，也把整个更衣室背在了肩上。他很少高声说话，但每一次套边插上，都像在替别人说话。',\n      talk: { encourage: { good: ['{p}笑了一下：“教练，你这么说，我就当是你给我加钟了。”'] }, criticize: { bad: ['{p}低头看了看左臂上的袖标：“如果是我没带好队，你直接说。”'] }, consult: { good: ['{p}沉吟了一会儿：“后面三个人，我觉得再靠近半步会更好。”你把它记了下来。'] }, heart: { good: ['{p}说起青训时每天坐同一班车去训练基地，总有人替他占着靠窗的位置：“现在轮到我替别人占座了。”'] } } },\n    { id: CA, tags: ['calm', 'perfectionist'], aff: 50, ego: 35, role: '后腰 · 清道夫', blurb: '球队的地基。抢断数据从来不好看，但对手每次要推进，总会先撞上他。他对自己要求苛刻，被夸反而会不自在。',\n      talk: { encourage: { bad: ['{p}摇了摇头：“教练，不用夸我。球没丢，就是该做的。”'] }, focus: { good: ['{p}只回了一个词：“明白。”接下来的整场训练，他没有一次抢断是犯规的。'] }, heart: { good: ['{p}说起离开家乡那天，母亲往他包里塞了一包糖：“她说，踢球再苦，也别忘了甜。我现在口袋里还常放一颗。”'] } } },\n    { id: PA, tags: ['star', 'sensitive'], aff: 45, ego: 55, role: '前腰 · 冷面杀手', blurb: '点球点上不眨眼，进球后却总爱缩着脖子做那个“好冷”的动作。外面的人叫他冷血，球队里的人知道他其实很怕冷场。',\n      talk: { encourage: { good: ['{p}缩了缩脖子：“教练，你这么一说，我都热起来了。”'] }, criticize: { bad: ['{p}耸耸肩：“我今天很冷，不是因为天气。”'] }, consult: { good: ['{p}认真地想了想：“如果罗杰斯在我左边拉开，我就有一整个禁区的空档。”'] }, heart: { good: ['{p}聊起第一次站在点球点前的感觉：“全世界都安静了，我听见自己的心跳，像在敲一面很小的鼓。”'] } } },\n    { id: JP, tags: ['hot', 'pressure'], aff: 50, ego: 50, role: '中锋 · 九号', blurb: '巴西来的中锋，进球之后的庆祝比进球还热闹。每一次射门都像在说“信我”，每次没进，他自己第一个想不通。',\n      talk: { encourage: { good: ['{p}大笑起来：“教练，那我今天就多踢几脚！”'] }, criticize: { bad: ['{p}摊开手：“我没进球，是因为球没到我脚下，不是我不想。”'] }, consult: { good: ['{p}挠了挠头：“如果帕尔默的传球再早半拍，我就能提前启动。”'] }, focus: { good: ['{p}把耳机摘下来，认真点了一次头。'] } } },\n    { id: ES, tags: ['young', 'sensitive'], aff: 55, ego: 35, role: '右边锋 · 十九岁的天才', blurb: '十九岁，右脚像带着魔法，却总被人拿去和传奇比较。他是全队笑得最多的人，也是最怕让别人失望的人。',\n      talk: { encourage: { good: ['{p}眼睛一下子亮了：“教练，真的吗？那我今天可以多试一次过人吗？”'] }, criticize: { bad: ['{p}低下头：“对不起教练，我下次会……”声音越来越小。'] }, heart: { good: ['{p}给你看了一条语音，是家里人问他吃饱了没有。他笑了笑，又把手机收了起来。'] } } },\n    { id: MA, tags: ['veteran', 'hot'], aff: 55, ego: 60, role: '门将 · 点球杀手', blurb: '嘴上功夫比手上功夫更有名，却总能在最关键的时候把球扑出去。他是场上最吵的人，也是全队最放心的人。',\n      talk: { encourage: { good: ['{p}咧嘴大笑：“放心教练，我会让他们罚完点球就后悔。”'] }, criticize: { bad: ['{p}瞪大眼睛：“你说我？今天那个球，是门柱先动的。”'] }, consult: { good: ['{p}认真地想了想：“后卫线再退两步，我就能提前预判传中。”'] }, heart: { good: ['{p}说起小时候在街边守门，球门是两只鞋子：“那时候只有一条规矩——别让球进去。”'] } } }\n  ],\n\n  /* 事件。week 指定则必在该周出现；force 条件满足必出；其余按权重随机。who: 球员ID 或 'random' */\n  events: [\n    { id: 'goal', week: 0, cat: '董事会', t: '赛季开始前，董事会代表在办公室里问你：“今年的目标是什么？”窗外训练场上，球员们正在热身。周二周三的夜晚，今年没有欧战。', o: [\n      { t: '先回到欧冠区，把欧战夜找回来', tip: '董事会更宽容，奖励较小', fx: { goal: 'safe', board: 3 }, r: '“很务实。”他点点头，在文件上签了字。窗外有人在练长传。' },\n      { t: '冲击英超冠军', tip: '期望更高，成功的回报也更高', fx: { goal: 'push', fans: 3, morale: 2 }, r: '“蓝色的伦敦，等这一天很久了。”他说。球迷论坛里一夜之间多了几千条评论。' },\n      { t: '联赛、联赛杯、足总杯，三条线都要', tip: '压力最大，容错最低', fx: { goal: 'dream', morale: 4, board: -4 }, r: '会议室里安静了五秒，然后所有人都笑了。你没笑——你在想，勒沃库森那年是怎么做到的。' }] },\n    { id: 'winter', win: [17, 21], cat: '圣诞赛程', t: '圣诞前后，英超的比赛像下雨一样往头上砸，球队只有几天能喘口气。助教建议利用这段空档做一次重点调整，你只能选一个。', o: [\n      { t: '把三中卫之间的距离再磨一遍', fx: { def: 6, fatigue: 6 }, r: '三个人闭着眼睛也能站出同样的间距，门将说他终于不用回头数人头了。' },\n      { t: '把十号位的跑动和传递练熟', fx: { atk: 6, fatigue: 6 }, r: '两个前腰和中锋之间的三角，终于对上了节奏。' },\n      { t: '体能储备，赛季下半程靠它', fx: { cond: 6, fatigue: 10 }, r: '最后一周的拉练让所有人都骂了你，但没人掉队。' },\n      { t: '什么都不练，全队休整、吃饭', fx: { unity: 6, morale: 6, fatigue: -18 }, r: '圣诞聚餐上，几个人为谁买单吵了起来，最后是门将抢到了账单，并宣布这是“心理战”。' }] },\n    { id: 'window', win: [22, 26], cat: '转会窗', t: '一月的转会窗口快关了，董事会问你要不要补强。名单上已经有二十七个名字，但他们愿意听。', o: [\n      { t: '“不需要，现有的人就够了。”', fx: { unity: 3, morale: 2, board: 1 }, r: '你说得很平静。更衣室里有人听见了，晚上多了几声笑：“二十七个，还嫌少？”' },\n      { t: '“给我一个最缺位置的替补。”', fx: { funds: -16, atk: 2, def: 2, board: -1 }, r: '新的替补当天晚上到队，名单变成了二十八个。助教松了口气，又开始重新排更衣室柜子。' },\n      { t: '“把钱留着，夏天再说。”', fx: { funds: 16, board: 2 }, r: '董事会代表露出了难得的笑容。' }] },\n    { id: 'derby_eve', cat: '伦敦德比', force: true, once: true, when: function (c) { return (soon(c, 'ARS', 6) || soon(c, 'TOT', 6)) && c.S.week >= 2; }, t: '本周末是伦敦德比。记者们在训练场外挤成一团，等你说点什么。更衣室里，球员们也在等。', o: [\n      { t: '“一场一场来。”', fx: { morale: 2 }, r: '一句最不像鸡血的话，更衣室里每个人都重复了一遍。' },\n      { t: '让伦敦长大的孩子讲讲德比', fx: { unity: 3, chem: 2, p: { mood: 4 } }, r: '詹姆斯站起来讲了五分钟，讲到他小时候在看台上的位置。结束时没有人说话，但也没有人看手机。' },\n      { t: '什么都不说，让他们自己想', fx: { morale: -1, atk: 2, def: 2 }, r: '训练场上，除了脚步声和喘气声，什么也没有。' }] },\n    { id: 'derby_win', cat: '伦敦德比', w: 3, when: function (c) { return c.last && (c.last.opp === 'ARS' || c.last.opp === 'TOT') && c.last.out === 'W' && c.last.cn === '英超'; }, t: '赢下德比之后，几个年轻球员在更衣室里放起了歌，老球员们围着球场边走边唱。', o: [\n      { t: '一起唱', fx: { morale: 4, fans: 3, unity: 3 }, r: '视频被球员发上社交媒体，评论区一半是庆祝，一半是对面球迷的沉默。' },\n      { t: '“明天训练，八点。”', fx: { board: 1, atk: 1, def: 1 }, r: '歌停了，但没人觉得扫兴。' }] },\n    { id: 'derby_loss', cat: '伦敦德比', w: 3, when: function (c) { return c.last && (c.last.opp === 'ARS' || c.last.opp === 'TOT') && c.last.out === 'L'; }, t: '输掉德比之后，记者翻出旧账，问你：这支球队是不是在大场面上缺了点什么？', o: [\n      { t: '“我只记得下一场。”', fx: { morale: 1, fans: 1 }, r: '同一句话，你在很多场合说过。' },\n      { t: '沉默地看了他一眼', fx: { fans: 3, morale: -1 }, r: '那条新闻最后没有发出来。' }] },\n    { id: 'anfield', cat: '老朋友', force: true, once: true, when: function (c) { return soon(c, 'LIV', 6) && c.S.week >= 2; }, t: '下一个对手是利物浦，客场。你在那座球场踢过五个赛季，通道里的气味你闭着眼睛也认得。记者们都在等你说点什么，球员们也在偷偷看你。', o: [\n      { t: '“那是我的过去。这周只关心我的球队。”', fx: { morale: 2, board: 1 }, r: '你把话题拉了回来，记者们没有追问。' },\n      { t: '带球员们看一段当年的录像', fx: { unity: 2, chem: 1.5, key: { mood: 1 } }, r: '录像里你很年轻，满脸胡子。球员们看了半分钟，有人小声问：“教练，你那时候这么凶？”' },\n      { t: '什么也不说，赛前自己去客队更衣室走一圈', fx: { morale: 1, fatigue: -2 }, r: '你站在通道里，听着看台上的歌声由远及近。你想：该进去了。' }] },\n    { id: 'title_rival', cat: '争冠', w: 2, when: function (c) { return c.rank <= 3 && (soon(c, 'ARS', 10) || soon(c, 'LIV', 10)) && c.S.week >= 5; }, t: '积分榜上的数字越来越紧。争冠对手的教练在发布会上说：“我们的目标很清楚，别人怎么想，是别人的事。”记者把这句话转给了你。', o: [\n      { t: '“我们也一样。”', fx: { morale: 2, fans: 1 }, r: '一句话，被剪成了短视频，点赞比他那条还多。' },\n      { t: '“我更想聊聊我的球队。”', fx: { board: 1, unity: 1 }, r: '你把话题拉回了球队。助教在桌子底下悄悄竖了个大拇指。' },\n      { t: '让记者去问球员', fx: { fans: 2, morale: -1 }, r: '凯塞多被问到的时候说：“我们一周踢一场，剩下的时间在训练。”' }] },\n    { id: 'crisis', cat: '危机', force: true, cd: 8, when: function (c) { return c.lossStreak >= 3; }, t: '球队已经连续三场没赢。更衣室里有人开始互相指责，球迷论坛也出现了“阿隆索下课”的帖子。', o: [\n      { t: '开一次全队会，所有人都要说话', fx: { unity: 4, morale: 3, fatigue: 4 }, r: '会开了两个小时。有人拍桌子，有人沉默，最后所有人一起喊了口号。' },\n      { t: '给全队放一天假', fx: { morale: 4, fatigue: -10, board: -1 }, r: '董事会不太满意，但球员们回来的时候像换了一批人。' },\n      { t: '加练，罚站，让他们记住', fx: { def: 3, atk: 2, morale: -4, fatigue: 8, key: { mood: -3 } }, r: '训练场的灯亮到了十点。有人在回家的路上摔了手机。' }] },\n    { id: 'board_talk', cat: '董事会', force: true, once: true, when: function (c) { return c.S.board < 32 && c.S.week >= 8; }, t: '董事会代表把你叫到办公室，桌上放着一份文件。“我们需要谈谈这个赛季了。”', o: [\n      { t: '“给我三个星期。”', fx: { board: 5, morale: -2 }, r: '他看着你很久，点了点头。“三个星期。”' },\n      { t: '“你们挑的人，你们说了算。”', fx: { board: -3, fans: 2 }, r: '这句话传出去之后，球迷论坛转了三天。' },\n      { t: '拿出一份赛季回顾报告', fx: { board: 3, funds: -8 }, r: '报告翻了三页，他的表情缓和了一点。' }] },\n    { id: 'unity_party', cat: '更衣室', w: 2, when: function (c) { return c.S.attrs.unity > 60; }, t: '团结指数很高。今天训练结束后，几个年轻球员自发在更衣室里搞了一场“聚餐大会”，他们问你来不来。', o: [\n      { t: '去，当然去', fx: { unity: 3, morale: 3, key: { mood: 2 } }, r: '你坐在角落吃了半个小时，没人提战术。' },\n      { t: '让他们自己玩，你在办公室看录像', fx: { atk: 1, def: 1 }, r: '你关了门，听着楼下的笑声，反而更专心。' }] },\n    { id: 'a_anthem', cat: '俱乐部', w: 2, once: true, when: function (c) { return c.S.week >= 3; }, t: '赛前，斯坦福桥的看台上响起了那首老歌，一万人同时开口，球员通道里的人谁也没说话。你站在边线外，发现自己也在跟着哼。', o: [\n      { t: '赛后向看台鞠躬', fx: { fans: 3, board: 1 }, r: '这张照片第二天出现在每一家小报的头版上，配的标题是：“他也会唱。”' },\n      { t: '假装咳嗽，转身进通道', fx: { morale: 1 }, r: '助教看了你一眼，什么也没说，眼角带着笑。' },\n      { t: '让球员们赛前在通道里一起听完', fx: { unity: 2, morale: 2 }, r: '那天全队走上草皮时，脚步都出奇地一致。' }] },\n    { id: 'a_james', cat: '球员', who: JA, w: 2, t: '训练里，{p}一边慢跑一边指挥几个年轻人调整站位，用手势比划了三遍，对方才懂。他回头对你无奈地笑了一下。', o: [\n      { t: '让他当训练里的“第二个教练”', fx: { chem: 2, unity: 1, p: { ego: 3, aff: 3 } }, r: '{p}把战术板拿过去画了一张图。画完后，所有人都说“看懂了”。' },\n      { t: '提醒他别太累着自己', fx: { p: { ego: -3, mood: -1, aff: 1 }, unity: 1 }, r: '{p}挠头笑笑：“习惯了。”' }] },\n    { id: 'a_caicedo', cat: '球员', who: CA, w: 2, t: '训练结束了，{p}还留在场上一个人练抢断后的第一脚出球，反复摆放标志桶，没人叫得动他。', o: [\n      { t: '陪他练，顺便聊聊', fx: { p: { aff: 5, mood: 3, form: .5 }, fatigue: 2 }, r: '你们练了半个小时，聊起了怎样才算“抢得干净”。' },\n      { t: '“回去休息。体能是留给比赛的。”', fx: { fatigue: -2, p: { mood: -1, aff: 1 } }, r: '{p}不太情愿地点点头，但第二天看起来更轻快。' }] },\n    { id: 'a_palmer', cat: '球员', who: PA, w: 2, t: '内部对抗赛里，{p}用一个不起眼的假动作骗倒了整条后防线，进球后转头缩着脖子做了那个“好冷”的动作。场边的人愣了一下，然后爆发出一阵喝彩。', o: [\n      { t: '“漂亮。比赛里也可以这么踢。”', fx: { atk: 1.5, p: { form: 1.5, mood: 3, ego: 3 } }, r: '{p}冲着场边做了一个鞠躬的动作，缩得更夸张了。' },\n      { t: '“漂亮。但要看时机。”', fx: { p: { form: .5, aff: 1 }, chem: 1 }, r: '{p}点点头：“知道了，不在关键时刻冷。”' },\n      { t: '“先把基本功做好。”', fx: { def: 1, p: { mood: -3, aff: -1 } }, r: '{p}耸耸肩，转身去拿水。' }] },\n    { id: 'a_pedro', cat: '球员', who: JP, w: 2, t: '{p}射门训练里连续打飞了三个球，捂着脸原地转了一圈，又笑着捡起了第四个。队友们起哄让他请吃饭。', o: [\n      { t: '“罚他请吃饭，每飞一个一顿。”', fx: { unity: 2, morale: 2, p: { aff: 3, mood: 2 } }, r: '最后账单是由全队平摊的，{p}的脸比球门还红。' },\n      { t: '拉他到一边，教他一个小技巧', fx: { atk: 1, p: { form: 1, aff: 4 } }, r: '你只改了他触球的角度，下一脚球就钻进了死角。' },\n      { t: '“没关系，下一脚进。”', fx: { p: { mood: 3, aff: 2 } }, r: '{p}笑着点头：“下一脚进。”结果真进了。' }] },\n    { id: 'a_estevao', cat: '球员', who: ES, w: 2, t: '{p}早上七点就到了训练场，你路过时发现他在更衣室门口对着镜子，一遍一遍背英语战术词汇，背错了就笑。', o: [\n      { t: '请他喝杯咖啡，慢慢聊', fx: { p: { aff: 5, mood: 3 } }, r: '“教练，我怕自己听不懂。”{p}说。“没关系，”你说，“听不懂的时候，看凯塞多。”' },\n      { t: '安排一位翻译全程跟着他', fx: { funds: -4, p: { mood: 2, form: .5 } }, r: '翻译坐在战术板旁，{p}第一次在战术课上点了头。' },\n      { t: '“你需要自己扛一段时间。”', fx: { p: { ego: -2, mood: -2, form: .3 } }, r: '{p}沉默地点了点头，接着去背下一页词汇。' }] },\n    { id: 'a_martinez', cat: '球员', who: MA, w: 2, t: '点球训练里，{p}站在门线上一边扑球一边跟罚球的队友聊天，从对方的鞋带一路聊到上辈子，罚球的人越踢越乱。门将教练在旁边捂着额头。', o: [\n      { t: '让他继续，这是他的“武器”', fx: { def: 1.5, unity: 1, p: { ego: 3, aff: 3 } }, r: '队友们抱怨得很大声，但每个人都在偷偷记他的套路。' },\n      { t: '“训练里别捣乱，让他们好好踢。”', fx: { p: { ego: -3, mood: -2 }, chem: 1 }, r: '{p}举起手：“好好好，我闭嘴。”两分钟后又开始了。' },\n      { t: '“明天比赛，你也这么说话。”', fx: { def: 1, p: { aff: 3, mood: 3, form: .5 } }, r: '{p}咧嘴笑了：“教练，你比我还懂心理战。”' }] },\n    { id: 'a_replay', cat: '教练', w: 1, once: true, when: function (c) { return c.S.week >= 14; }, t: '深夜，你在办公室翻看勒沃库森不败赛季的旧录像，一场接一场，都是你熟悉的绝杀。门口传来敲门声，是詹姆斯。', o: [\n      { t: '请他进来，一起看完', fx: { unity: 3, morale: 2, p: { aff: 4 } }, r: '你们谁也没说话。结束的时候，他说：“教练，我们也可以。”' },\n      { t: '合上电脑，说“早点回去睡”', fx: { morale: 1 }, r: '你关了灯，走廊里的光比平时亮。' }] },\n    { id: 'a_sprint', cat: '教练', w: 2, when: function (c) { return c.last && c.last.out === 'W'; }, t: '终场哨响，你一向克制地鼓掌，这次却被几个球员拽到了场边，在看台前被抛起来三次。第四官员站在一边，表情很复杂。', o: [\n      { t: '“放我下来！”', fx: { fans: 3, morale: 2 }, r: '这段视频成了本周最受欢迎的短视频，配乐是一首你听不懂的歌。' },\n      { t: '向第四官员道歉', fx: { board: 1, fans: 1 }, r: '他接受了道歉，但表情仍然很复杂。' }] },\n    { id: 'press_trap', cat: '媒体', w: 2, t: '一个记者问你：“很多人说，你只是把勒沃库森那一套搬到了伦敦，你怎么看？”会场安静了下来。', o: [\n      { t: '“我在做我自己的版本。”', fx: { fans: 2, board: 1 }, r: '这句话被印在了第二天的小报头条上，旁边配的是你站在场边的照片。' },\n      { t: '笑笑，什么都不说', fx: { board: 1, morale: 1 }, r: '记者追问了三遍，你只是点了点头。' },\n      { t: '“你来训练场看看吧。”', fx: { fans: 1, unity: 1 }, r: '第二天，那个记者真的来了，站在场边被淋了一身水。' }] },\n    { id: 'young_star', cat: '球员', who: ES, w: 2, when: function (c) { return c.S.pl[ES].form > .6; }, t: '{p}最近状态火热，欧洲的几家豪门开始公开表达兴趣，经纪人也联系了俱乐部。', o: [\n      { t: '把他叫来，直接说清楚规划', fx: { p: { aff: 5, mood: 3, ego: 2 }, board: 1 }, r: '{p}听完点头：“教练，我愿意留在这里。”' },\n      { t: '什么都不说，让他自己做决定', fx: { p: { mood: -2, aff: -3, ego: 4 }, unity: -1 }, r: '他踢了几场球，状态忽高忽低。' }] },\n    { id: 'injury_crisis', cat: '医疗', w: 2, when: function (c) { return c.S.fatigue > 65; }, t: '队医敲门，神色严肃：“教练，最近的伤病报告看起来不太对，大家的身体在报警。”', o: [\n      { t: '这周全队轻练，优先恢复', fx: { fatigue: -14, morale: 1, board: -1 }, r: '队医松了一口气，小声说了句“谢谢”。' },\n      { t: '硬撑过去，赛季不等人', fx: { fatigue: 4, def: 1, unity: -1 }, r: '你拍了拍他的肩：“再坚持两周。”' }] },\n    { id: 'captain_speech', cat: '更衣室', who: JA, w: 1, when: function (c) { return c.S.attrs.morale < 45; }, t: '士气不高。赛后更衣室里，{p}突然站起来，对全队说了几句话。', o: [\n      { t: '让他说完，你什么也不加', fx: { morale: 6, unity: 3, p: { aff: 3 } }, r: '没有人记得他具体说了什么，但所有人都记得那天晚上的灯光。' },\n      { t: '补充一句：“我们还没输。”', fx: { morale: 4, unity: 2 }, r: '这句话在更衣室里回响了一整晚。' }] },\n    { id: 'fan_banner', cat: '球迷', w: 2, t: '赛前，看台上升起一面巨大的蓝色旗帜，上面写着：“无论赢输，蓝色永远在这里。”', o: [\n      { t: '赛后走到看台，向他们鞠躬', fx: { fans: 4, morale: 2 }, r: '球场的灯一盏盏熄灭，但看台上没有人愿意离开。' },\n      { t: '低头走进球员通道', fx: { fans: 1 }, r: '你什么也没说，但手心是湿的。' }] },\n    { id: 'assistant_idea', cat: '教练组', w: 2, t: '助教拿着笔记本找你：“教练，我有一个新训练想法，但可能需要多花一点时间。”', o: [\n      { t: '听听他的想法，试一次', fx: { atk: 2, chem: 2, fatigue: 3 }, r: '训练课结束，球员们说“这个很新鲜”。助教脸上写满了得意。' },\n      { t: '让他先和队医对一遍', fx: { chem: 1, unity: 1 }, r: '助教有点失望，但第二天他拿来了更完整的版本。' }] },\n    { id: 'dressing_spat', cat: '更衣室', who: 'random', w: 2, when: function (c) { return c.S.attrs.unity < 52 || c.lossStreak >= 2; }, t: '训练中，{p}和一名队友因为一次抢断起了冲突，两个人被队友拉开。更衣室里的空气像是凝固了。', o: [\n      { t: '把两人叫到办公室，当面说开', fx: { unity: 3, fatigue: 2, p: { aff: 2 } }, r: '十分钟后，两个人一起出来，谁也不看谁，但一起去吃了饭。' },\n      { t: '各打五十大板，罚跑', fx: { unity: -1, def: 1, fatigue: 6 }, r: '队友们安静地看着他们跑。从那天起，没人再提这件事。' },\n      { t: '当作没发生', fx: { unity: -4, morale: -2 }, r: '气氛一直没有真正缓和。' }] },\n    { id: 'rain', cat: '日常', w: 1, t: '伦敦下了一周的雨，训练场积水能没过脚踝。助教问你要不要把课改到室内。', o: [\n      { t: '照常训练，下雨才像英格兰', fx: { def: 2, unity: 2, fatigue: 4, morale: 1 }, r: '所有人都回家感冒了，但没有一个人缺席第二天的训练。' },\n      { t: '改到室内做体能和录像', fx: { cond: 1.5, atk: 1, fatigue: -2 }, r: '这周很安静。' }] },\n    { id: 'intl_break', cat: '国家队', who: 'random', w: 1, when: function (c) { return [3, 6, 7, 12, 32].indexOf(c.S.week) >= 0; }, t: '国际比赛日，{p}代表国家队踢了全场，回来时脸上写着“没睡好”。', o: [\n      { t: '让他休息一天', fx: { p: { fit: 8, mood: 2 } }, r: '{p}睡了一整天，醒来先问有没有吃的。' },\n      { t: '“明天正常训练。”', fx: { p: { form: 1 }, fatigue: 3 }, r: '{p}什么也没说，第二天依旧很拼。' }] },\n    { id: 'benched_player', cat: '球员', who: 'random', w: 2, when: function (c) { return c.S.pl && c.S.key.some(function (id) { return c.S.pl[id].mood < 42; }); }, t: '{p}最近情绪低落，训练也不太积极。队友们私下议论，你看在眼里。', o: [\n      { t: '约他单独聊一聊', fx: { p: { mood: 8, aff: 4 } }, r: '{p}说：“教练，我只是想知道自己在你的计划里。”' },\n      { t: '让他自己消化', fx: { p: { mood: 2, aff: -2 } }, r: '几天后他自己好起来了，但看你的眼神变了。' }] },\n    { id: 'owner_visit', cat: '董事会', w: 1, once: true, when: function (c) { return c.S.board > 50 && c.S.week >= 10; }, t: '俱乐部的老板来看了一次训练，站在场边一言不发。结束后，他走过来拍了拍你的肩。', o: [\n      { t: '请他到办公室谈', fx: { board: 3, funds: 8 }, r: '他在你的办公室里坐了二十分钟，走的时候留下一句“继续”。' },\n      { t: '“谢谢，下周我们还有比赛。”', fx: { board: 1, morale: 1 }, r: '他笑了笑，转身走了。' }] },\n    { id: 'night_walk', cat: '教练', w: 1, when: function (c) { return c.S.week >= 5; }, t: '深夜你在空无一人的斯坦福桥走了一圈。保安认出了你，什么也没说，只是把灯又多开了几盏。', o: [\n      { t: '在草皮上坐一会儿', fx: { morale: 1, fatigue: -3 }, r: '你坐了二十分钟，什么也没想。第二天，你感觉自己年轻了一点。' },\n      { t: '回办公室继续看录像', fx: { atk: 1, def: 1, fatigue: 2 }, r: '凌晨三点你关了电脑，在笔记本上写了一页字。' }] },\n    /* ---- 以下是随机事件：每周按概率抽取，14 周内不重复；带“结果不确定”的选项会掷骰子 ---- */\n    { id: 'squad27', cat: '更衣室', w: 2, t: '更衣室里新贴了一张名单，二十七个名字挤得满满当当。有球员路过时数了三遍，数错了两遍，忍不住问你：“教练，是不是每个人都要上？”', o: [\n      { t: '“每个人都有用，包括你正在数名字的这几秒。”', fx: { unity: 3, morale: 2 }, r: '更衣室里爆发出一阵笑声。从那天起，“二十七”成了全队的暗号。' },\n      { t: '挨个儿找替补谈心，讲清楚各自的角色', fx: { unity: 4, morale: 1, fatigue: 3, key: { mood: 1 } }, r: '你花了整整一个下午。谈话结束后，几个替补主动留下来加练。' },\n      { t: '“名单是董事会的事，不是我的。”', fx: { board: -2, fans: 2, morale: 1 }, r: '这句话被某位记者听见，第二天登上了小报的版面。' }] },\n    { id: 'europe_envy', cat: '欧战夜', w: 2, once: true, when: function (c) { return c.S.week >= 6 && c.S.week <= 20; }, t: '又是一个周二的夜晚，没有比赛。更衣室的电视里放着别人的欧冠，球员们三三两两围在一起看，谁也没说话。', o: [\n      { t: '关掉电视：“好好看看自己的比赛录像。”', fx: { atk: 1, def: 1, morale: -1 }, r: '有人叹了口气，有人把手机倒扣在桌上。' },\n      { t: '一起看，边看边讲谁踢得好', fx: { morale: 2, chem: 1.5, unity: 1 }, r: '你在每一个镜头上都指出了一个细节，球员们听得比平时认真。' },\n      { t: '“这座奖杯，我们明年再来。”', fx: { morale: 3, board: 1, fatigue: 1 }, r: '有人把这句话写在了战术板的角落里，没人擦掉。' }] },\n    { id: 'palmer_rogers', cat: '更衣室', w: 1, when: function (c) { return c.S.pl[PA].mood > 55; }, t: '训练后，帕尔默和罗杰斯在场边为“谁更适合踢十号位”比赛颠球，输的人请吃午饭。围观的人越来越多，最后连门将教练都停下了手里的活。', o: [\n      { t: '加入比赛，当裁判', fx: { unity: 3, morale: 3, chem: 1.5 }, r: '你判定平局，两个人一起请了客。账单是最后才发现的。' },\n      { t: '假装没看见，转身去办公室', fx: { unity: 1, morale: 1, fatigue: -1 }, r: '你关上门，听见走廊里传来一阵大笑。' }] },\n    { id: 'sponsor', cat: '赞助商', w: 2, t: '一家新赞助商想让你亲自出镜拍一条广告，开价不低，时间要占掉半天训练。', o: [\n      { t: '拍，钱是真的', tip: '收入 +，但会累', roll: { p: .7, ok: { fx: { funds: 22, fans: 1, fatigue: 3 }, r: '拍摄很顺利。你全程一个表情，导演说这正好是广告需要的。' }, fail: { fx: { funds: 10, fans: -2, fatigue: 5 }, r: '你把台词说成了“节奏比控制重要”，广告被剪了三遍才勉强能用。' } } },\n      { t: '推掉，训练要紧', fx: { atk: 1, def: 1 }, r: '你让助教回了一封礼貌的邮件。赞助商说下次再约。' }] },\n    { id: 'youth_call', cat: '青训', w: 2, t: '青年队一名 17 岁的中场球员连续几场表现抢眼，青训总监来问：“能不能让他跟一线队训练几天？”', o: [\n      { t: '让他来，看看成色', tip: '有概率给球队带来活力', roll: { p: .6, ok: { fx: { morale: 3, chem: 2, fatigue: -3, board: 1 }, r: '小伙子跑得比谁都欢，老队员们都说“像看到了十年前的自己”。' }, fail: { fx: { morale: -1, unity: -1 }, r: '他在对抗里被几位老队员撞得很惨，当天晚上就回了青年队。' } } },\n      { t: '再等等，别揠苗助长', fx: { board: 1, unity: 1 }, r: '青训总监点点头：“您总是这么稳。”' }] },\n    { id: 'agent_call', cat: '球员', who: 'random', w: 2, t: '{p}的经纪人在媒体上放话，说“有几家俱乐部很感兴趣”。球员本人对此没有表态。', o: [\n      { t: '把球员叫来，问他怎么想', fx: { p: { aff: 4, mood: 2 }, board: -1 }, r: '{p}说：“教练，我只想踢球。”你让他早点回去休息。' },\n      { t: '直接对媒体说“他不卖”', fx: { fans: 3, board: 1, p: { ego: 5 } }, r: '球迷论坛一片叫好，{p}的脸上有点不好意思。' },\n      { t: '装作没看到', fx: { p: { mood: -2, aff: -1 } }, r: '谣言又飘了几天，然后被另一条新闻盖了过去。' }] },\n    { id: 'ref_row', cat: '媒体', w: 2, when: function (c) { return c.last && c.last.out === 'L'; }, t: '输球之后，有记者问你对 VAR 判罚的看法。你的助教在桌子底下悄悄递给你一张纸条：“别说话。”', o: [\n      { t: '照着纸条，什么都不说', fx: { board: 1, morale: 1 }, r: '记者追问两遍，你都只点头。这条新闻没有发酵。' },\n      { t: '“我们没有输给裁判。”', fx: { fans: 2, board: 1, morale: 1 }, r: '这句话在球迷论坛里被转了几千次。' },\n      { t: '“有些判罚，我看不懂。”', fx: { fans: 4, board: -3, morale: 2 }, r: '足总的邮件第二天就到了。球迷却很满意。' }] },\n    { id: 'rival_trash', cat: '对手', w: 1, when: function (c) { return soon(c, 'ARS', 14) || soon(c, 'LIV', 14) || soon(c, 'TOT', 14); }, t: '对手教练在发布会上暗示：“有些球队只会控球，不会进球。”记者把这句话原封不动地转给了你。', o: [\n      { t: '“他说得对，我们确实喜欢球。”', fx: { fans: 3, morale: 2, atk: 1 }, r: '这句话被印在了第二天的小报头条上，更衣室里传阅了好几遍。' },\n      { t: '“我不评论别人的足球。”', fx: { board: 1 }, r: '你平静地结束了采访。晚上，助教说你太克制了。' }] },\n    { id: 'charity', cat: '俱乐部', w: 1, t: '俱乐部邀请球队去儿童医院做一次探访。半天时间，没有训练，也没有摄像机。', o: [\n      { t: '全队一起去', fx: { unity: 3, morale: 3, fans: 3, fatigue: -4 }, r: '回程的大巴里很安静。没人拿手机出来拍，只是都在看窗外。' },\n      { t: '派几个代表，其他人训练', fx: { fans: 1, atk: 1, def: 1 }, r: '代表们回来说孩子们问了很多关于“你们教练为什么总是不笑”的问题。' }] },\n    { id: 'late_arrival', cat: '球员', who: 'random', w: 2, t: '训练开始五分钟了，{p}还没有出现。队友们互相看了看，没有人说话。', o: [\n      { t: '等他，不扣分', fx: { p: { aff: 3, mood: 2, ego: 4 }, unity: -1 }, r: '{p}满头大汗地跑进来，道歉的话说了三遍。' },\n      { t: '罚他加练，规矩就是规矩', fx: { p: { ego: -6, mood: -3, aff: -2 }, unity: 2 }, r: '{p}被罚了两圈，那天没人再迟到。' },\n      { t: '把他叫到办公室，问出了什么事', roll: { p: .55, ok: { fx: { p: { aff: 6, mood: 4 }, unity: 1 }, r: '{p}家里有点事。你让他先回去处理，他走时的眼神变了。' }, fail: { fx: { p: { aff: -2, mood: -3 }, unity: -1 }, r: '{p}什么也没说。你们沉默了很久。' } } }] },\n    { id: 'legend_visit', cat: '俱乐部', w: 1, once: true, when: function (c) { return c.S.week >= 6; }, t: '一位球队传奇来训练场看望大家，他在场边看了整整一场对抗赛，什么都没说，最后只是笑了笑。', o: [\n      { t: '请他给大家讲几句', fx: { morale: 4, unity: 3, key: { mood: 2 } }, r: '他讲了半个小时，讲到最后一句话时，全队都站了起来。' },\n      { t: '请他单独指点一名球员', fx: { p: { form: 1, aff: 3 } }, r: '你们在场边聊了很久。' }] },\n    { id: 'tactics_leak', cat: '媒体', w: 1, when: function (c) { return c.S.attrs.def > 55; }, t: '训练场外有人拍到了你们的战术演练，视频在网上流传。助教紧张地跑来问：“教练，要不要追查？”', o: [\n      { t: '追查，修个围墙', tip: '花钱，但防止泄露', fx: { funds: -10, board: 1 }, r: '一周后训练场周围多了三米高的围板。有球员说：“像是在拍电影。”' },\n      { t: '不管，他们看得懂吗？', fx: { fans: 1, def: 1 }, r: '你对着镜头的方向挥了挥手。视频后来被删了。' }] },\n    { id: 'diet', cat: '医疗', w: 1, t: '营养师提交报告：球员们最近的饮食越来越随意，建议统一管理，但需要球员们配合。', o: [\n      { t: '全队统一食谱', fx: { cond: 2, unity: -1, morale: -1, fatigue: -4 }, r: '食堂里多了一堆蒸菜，几个球员偷偷点了外卖。' },\n      { t: '让营养师给每人单独方案', fx: { funds: -8, cond: 1.5, morale: 1, fatigue: -3 }, r: '花了一些钱，但没有人抱怨。' },\n      { t: '不管，成年人自己负责', fx: { morale: 1, fatigue: 3 }, r: '周三的更衣室里飘出了烧烤味。' }] },\n    { id: 'bus_break', cat: '日常', w: 1, t: '客场比赛归程中，球队大巴在高速上抛锚。全队站在路边等了两个小时。', o: [\n      { t: '带着大家在路边玩球', fx: { unity: 4, morale: 2, fatigue: 2 }, r: '没人知道谁先开始的，总之一群职业球员在高速路边踢起了五人制。' },\n      { t: '让所有人在车里休息', fx: { fatigue: -3 }, r: '你把外套披在最年轻的球员身上，自己站在车外。' }] },\n    { id: 'prank', cat: '更衣室', who: 'random', w: 2, t: '{p}把一只橡皮鸭放进了助教的战术包里。助教打开包的时候，更衣室里安静了三秒，然后爆发出一阵大笑。', o: [\n      { t: '假装没看见，笑着走出去', fx: { unity: 3, morale: 2, p: { aff: 2 } }, r: '你在走廊里笑了一会儿才回到办公室。' },\n      { t: '“明天训练，每人加一圈。”', fx: { unity: 1, def: 1, fatigue: 3 }, r: '没人抱怨。第二天，那只鸭子被摆在了更衣室的架子上。' }] },\n    { id: 'language', cat: '更衣室', w: 1, t: '一位新来的小将还不太会说英语，在训练里几次因为沟通不畅造成失误，有点沮丧。', o: [\n      { t: '安排老队员带他', fx: { unity: 3, chem: 2, p: { mood: 0 } }, r: '凯塞多每天带他吃午饭，两周后他已经会用英语骂裁判了。' },\n      { t: '请语言老师，每天课后上课', fx: { funds: -6, chem: 2, morale: 1 }, r: '语言老师在训练场边的小黑板上写满了单词。' }] },\n    { id: 'doc_warn', cat: '医疗', w: 2, when: function (c) { return c.S.fatigue > 50; }, t: '队医拿着一份报告来找你：“教练，有三个人的肌肉负荷已经到临界值。”', o: [\n      { t: '听队医的，立刻减量', fx: { fatigue: -10, atk: -.5 }, r: '你把周三的重练改成了泳池恢复。' },\n      { t: '再坚持一场，之后补', tip: '有风险', roll: { p: .5, ok: { fx: { fatigue: 2, def: 1 }, r: '你赌对了。队医看着你，脸上没有表情。' }, fail: { fx: { fatigue: 5, p: { inj: 3 } }, r: '有人在训练里拉伤了，队医什么都没说，只是把报告又递了一次。' } } }] },\n    { id: 'caicedo_bday', cat: '球员', who: CA, w: 1, t: '今天是{p}的生日。更衣室里有人偷偷订了蛋糕，但他一直装作没发现。', o: [\n      { t: '带头唱生日歌', fx: { morale: 3, unity: 3, p: { aff: 4, mood: 4 } }, r: '你唱得很难听，但没人敢笑。' },\n      { t: '“训练结束后再说。”', fx: { atk: 1, p: { aff: 1 } }, r: '训练一结束，蛋糕就被端了出来，所有人早已站好位置。' }] },\n    { id: 'gk_coach', cat: '教练组', w: 1, t: '门将教练来找你：“教练，我想试试给他们加一套新的出击训练。”', o: [\n      { t: '同意，试一个月', fx: { def: 2, fatigue: 2 }, r: '门前的出击更果断了。一个月后，对手的传中少了。' },\n      { t: '“现在这套就够了。”', fx: { board: 1 }, r: '门将教练点点头，带着笔记本回去了。' }] },\n    { id: 'fan_letter', cat: '球迷', w: 1, t: '一位十岁的球迷写来一封信，说他想当球员，但他个子太小。信封里夹着一张他自己画的你。', o: [\n      { t: '回信，并寄去一件训练服', fx: { fans: 2, morale: 1 }, r: '一个月后，他寄回了一张照片：训练服被他穿得过长，袖子卷了三圈。' },\n      { t: '贴在办公室墙上', fx: { morale: 1 }, r: '你每天进门都会看到那幅画。' }] },\n    { id: 'cold_snap', cat: '日常', w: 1, t: '伦敦突然降温，训练场的草皮结了薄霜，球员们裹着外套在场边活动。帕尔默缩着脖子，对着镜头比了个“好冷”。', o: [\n      { t: '改成室内力量训练', fx: { cond: 2, fatigue: 2 }, r: '体能教练笑得很开心：“终于可以练核心了。”' },\n      { t: '照常训练，穿厚点', fx: { unity: 2, morale: 1, fatigue: 3 }, r: '你看着自己呼出的白气，想起了第一次站在这里的那个早晨。' }] },\n    { id: 'old_boot', cat: '教练', w: 1, once: true, when: function (c) { return c.S.week >= 12; }, t: '你在办公室的抽屉里找到了一双旧球鞋，是你自己踢球时穿的。鞋底已经磨得很薄。', o: [\n      { t: '带到更衣室，放在显眼的地方', fx: { morale: 3, unity: 2 }, r: '鞋被摆在了更衣室的入口。球员们进门都会多看它一眼。' },\n      { t: '放回抽屉', fx: { morale: 1 }, r: '你关上抽屉，笑了笑。' }] },\n    { id: 'surprise_test', cat: '教练组', w: 1, t: '体能教练提出一个想法：搞一次突击体测，让球员们“知道自己真实的状态”。', o: [\n      { t: '搞，当场公布成绩', roll: { p: .6, ok: { fx: { cond: 3, morale: 1, unity: 1 }, r: '全队咬着牙跑完。有人第一次发现自己比队友强，有人第一次发现不是。' }, fail: { fx: { cond: 1, morale: -3, unity: -2 }, r: '结果公布后，更衣室里传出了几声叹息。' } } },\n      { t: '不公布，只给个人反馈', fx: { cond: 1.5, morale: 1 }, r: '体能教练一个一个把球员叫到办公室。' }] },\n    { id: 'wembley_week', cat: '决赛周', w: 4, when: function (c) { return c.next && c.next.final && c.next.venue === '温布利球场' && soon(c, c.next.opp, 6); }, t: '温布利决赛就在这周末。更衣室里，有人想早点过去适应场地，有人想维持日常节奏，还有人悄悄问你：“教练，决赛前一晚我们能不能看一场电影？”', o: [\n      { t: '提前一天去，熟悉球场', fx: { morale: 3, fatigue: 2, atk: 1 }, r: '空荡荡的温布利比想象中更大。詹姆斯绕着中圈走了三圈，说：“好，我记住了。”' },\n      { t: '维持日常节奏，照常训练', fx: { def: 1.5, atk: 1.5, unity: 1 }, r: '你什么也没改。就像去年，也像更久以前的每一个周三。' },\n      { t: '决赛前一晚，全队看电影', fx: { unity: 4, morale: 4, fatigue: -4 }, r: '放的是一部没人看过的老电影。没有人说话，也没有人睡着。' }] },\n    { id: 'old_mentor', cat: '教练', w: 1, once: true, when: function (c) { return c.S.week >= 9 && c.rank <= 4; }, t: '你的手机亮了一下，是一条没有署名的短信，大概来自一位教过你的老教练：“别急着赢。先让他们喜欢上踢球。”', o: [\n      { t: '回复一个“谢谢”', fx: { morale: 2, board: 1 }, r: '你把手机放回口袋，感觉肩膀轻了一点。' },\n      { t: '拿给助教们看', fx: { unity: 2, morale: 2 }, r: '助教们看完，没有一个人笑，但所有人都点了头。' }] },\n\n    /* ================= 专属线：好感触发的个人剧情 =================\n       高好感线 3 段（好感达标 + 间隔数周才会出现）；低好感线 2 段（好感太低才会出现，有补救机会）。\n       flag 记录发生的周数，下一段靠它排先后。 */\n\n    /* ---- 詹姆斯 · 袖标的重量 ---- */\n    { id: 'ja_h1', cat: '专属线 · 詹姆斯', who: JA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, JA) >= 62 && !done(c, 'ja_l1'); }, t: '训练结束，{p}拿着那条袖标走到你面前：“教练，队长是不是应该多说话？我话不多，怕大家觉得我不像队长。”', o: [\n      { t: '“队长不是用嗓子当的。你跑到哪里，他们就跟到哪里。”', fx: { unity: 2, p: { aff: 6, mood: 3, form: .6 }, flag: 'ja1' }, r: '{p}把袖标捋平：“那我继续跑。”' },\n      { t: '“选一个你最放心的人，让他替你喊。”', fx: { chem: 1.5, unity: 2, p: { aff: 5, ego: -2, mood: 2 }, flag: 'ja1' }, r: '{p}想了想：“凯塞多。他喊起来像个老师。”' },\n      { t: '“每周一次，你在更衣室里讲一分钟。就一分钟。”', fx: { unity: 3, p: { aff: 7, mood: 3, ego: 3 }, flag: 'ja1' }, r: '第一次他讲了二十秒就坐下了；第二周，一分钟刚好。' }] },\n    { id: 'ja_h2', cat: '专属线 · 詹姆斯', who: JA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'ja1') >= 5 && aff(c, JA) >= 68 && (!done(c, 'ja_l1') || done(c, 'ja_fix')); }, t: '一场球踢得很难看之后，{p}一个人留在更衣室里，把袖标摘下来握在手里。你推门进去，他没有抬头：“教练，我在想，是不是我戴着它的这几场，球队反而踢得更紧？”', o: [\n      { t: '“袖标不会让球变重，是你自己把它举着。”', fx: { p: { aff: 7, mood: 6 }, flag: 'ja2' }, r: '{p}把袖标重新戴好，用力拉了一下：“收到。”' },\n      { t: '“下一场开始，让全队每个人轮流在赛前说一句话。”', fx: { unity: 4, chem: 1, p: { aff: 4, mood: 2, ego: -3 }, morale: 1, flag: 'ja2' }, r: '更衣室里一阵笑声。第二天训练，四个人为谁先说吵了一顿午饭。' },\n      { t: '“今晚什么也别想。回家，睡觉。”', fx: { p: { aff: 5, mood: 5, form: .5, fit: 6 }, flag: 'ja2' }, r: '{p}真的回家睡了。第二天他在训练场上，比谁都早。' }] },\n    { id: 'ja_h3', cat: '专属线 · 詹姆斯', who: JA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'ja2') >= 6 && aff(c, JA) >= 72 && (!done(c, 'ja_l1') || done(c, 'ja_fix')); }, t: '赛季的最后阶段，{p}带着一个青训营的孩子走进你的办公室：“这孩子每天都替我拎包。我想让他来看一次真正的赛前更衣室。”', o: [\n      { t: '“当然。让他坐在你的位置旁边。”', fx: { morale: 3, unity: 2, chem: 1, p: { aff: 5, mood: 7, form: 1.2, ovr: 1 }, flag: 'ja3' }, r: '那个孩子一整个赛前没有说话，只是把袜子穿了三遍。{p}替他系好了鞋带。' },\n      { t: '“让他跟你上场热身。”', fx: { morale: 4, fans: 3, p: { aff: 5, mood: 6, form: 1, ovr: .5 }, flag: 'ja3' }, r: '热身的时候，看台上有人认出了那个孩子，喊出了他的名字。' },\n      { t: '“他想看的不是更衣室，是你。你去看他的比赛。”', fx: { unity: 3, p: { aff: 4, mood: 6, form: 1, ovr: .5 }, flag: 'ja3' }, r: '周六早上，{p}提前两个小时去了青训营的比赛，站在场边，一句话都没喊。' }] },\n    { id: 'ja_l1', cat: '专属线 · 詹姆斯', who: JA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, JA) <= 30 && !done(c, 'ja2'); }, t: '{p}最近赛前讲话越来越短，训练里也只是默默完成。有人悄悄说：“他觉得队长这个位置，没人在乎他怎么想。”', o: [\n      { t: '单独约他，不谈战术，只问他累不累', roll: { p: 0.55, ok: { fx: { p: { aff: 10, mood: 6 }, flag: ['ja_l1', 'ja_fix'] }, r: '“其实一直有点累，”{p}说，“但没人问过。”你们站在球场边上，聊到了天黑。' }, fail: { fx: { p: { aff: 2, mood: -2 }, flag: 'ja_l1' }, r: '{p}说“还好”。你知道，这不是真话。' } } },\n      { t: '“队长的位置，需要你站出来。”', fx: { p: { aff: -5, mood: -5, ego: 3 }, unity: 1, flag: 'ja_l1' }, r: '{p}什么也没说，只是把袖标又往上拉了拉。' },\n      { t: '让助教去聊', fx: { p: { aff: 1, mood: 1 }, flag: 'ja_l1' }, r: '{p}知道是谁让他来的，礼貌地回答了每个问题。' }] },\n    { id: 'ja_l2', cat: '专属线 · 詹姆斯', who: JA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'ja_l1') >= 4 && aff(c, JA) <= 35 && !done(c, 'ja_fix'); }, t: '关于{p}的传闻出现在小报上：“队长想离开。”他本人没有回应，更衣室里有人开始怀疑他还在不在乎这件袖标。', o: [\n      { t: '亲自找他谈，把赛季规划摊开', roll: { p: 0.5, ok: { fx: { p: { aff: 14, mood: 8 }, flag: ['ja_fix'] }, r: '你们谈了一个半小时。最后他说：“我留下，不是因为袖标，是因为你说的那几个具体的计划。”' }, fail: { fx: { p: { aff: -3, mood: -8, form: -1 }, unity: -2, flag: 'ja_cold' }, r: '{p}听完说：“我知道你想让我留下。可我想听的，不是这个。”' } } },\n      { t: '“赛季结束后，由你自己决定。”', fx: { p: { mood: 5, aff: 6, form: .5 }, flag: 'ja_promise' }, r: '{p}长出了一口气：“谢谢。”你不确定自己是不是做对了。' },\n      { t: '“合同在，没有人可以随便离开。”', fx: { p: { aff: -8, mood: -8, ego: 3 }, unity: -2, flag: 'ja_cold' }, r: '{p}什么都没说。第二天，袖标放在了他的柜子上，没人碰它。' }] },\n\n    /* ---- 凯塞多 · 没有人看见的那一半场地 ---- */\n    { id: 'ca_h1', cat: '专属线 · 凯塞多', who: CA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, CA) >= 62 && !done(c, 'ca_l1'); }, t: '{p}拿着一张热图找到你：“教练，我今天在左路补了四次位，转播里一次都没拍到。我是不是应该去更显眼的地方？”', o: [\n      { t: '“你该在的地方，就是球要去的地方。”', fx: { def: 1, p: { aff: 6, mood: 3, form: .6 }, flag: 'ca1' }, r: '{p}点点头，把热图折起来塞进球袜：“那我继续去看不见的地方。”' },\n      { t: '“我把这张热图放进明天的战术会。”', fx: { chem: 1.5, def: 1, p: { aff: 6, mood: 4 }, flag: 'ca1' }, r: '全队看着屏幕上那片被他一个人盖住的区域，没人说话。' },\n      { t: '“下一场你往前站一点，试试。”', fx: { atk: 1, fatigue: 2, p: { aff: 4, mood: 1, form: .3, ego: 2 }, flag: 'ca1' }, r: '{p}认真点头。那场他多了两次拦截和一次助攻，赛后累得说不出话。' }] },\n    { id: 'ca_h2', cat: '专属线 · 凯塞多', who: CA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'ca1') >= 5 && aff(c, CA) >= 68 && (!done(c, 'ca_l1') || done(c, 'ca_fix')); }, t: '赛程最密的那几周，{p}一次也没喊过累。队医悄悄告诉你，他的负荷数据已经在警戒线上。你问他还行不行，他说：“我可以。”', o: [\n      { t: '“这场你休息。”', fx: { fatigue: -3, p: { aff: 7, mood: -1, fit: 6 }, flag: 'ca2' }, r: '{p}在替补席上坐了九十分钟，赛后说：“原来从这个角度看，球是这样来的。”' },\n      { t: '“你上，但七十分钟换你。”', fx: { fatigue: 3, p: { aff: 5, mood: 3, form: .8 }, flag: 'ca2' }, r: '七十分钟被换下场时，{p}对着场边鞠了一躬。' },\n      { t: '“我不替你决定，你自己说。”', fx: { p: { aff: 6, mood: 4, ego: 2 }, flag: 'ca2' }, r: '{p}沉默了一会儿：“我想上。但我听你的。”下半场，他的第一次拦截多了一点余地。' }] },\n    { id: 'ca_h3', cat: '专属线 · 凯塞多', who: CA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'ca2') >= 6 && aff(c, CA) >= 72 && (!done(c, 'ca_l1') || done(c, 'ca_fix')); }, t: '赛季快结束的时候，一个来自家乡的邮包送到了更衣室：里面是一群孩子画给{p}的卡片，每一张上都画着一个把球抢下来的人。', o: [\n      { t: '“把它们贴在更衣室的墙上。”', fx: { morale: 3, unity: 2, p: { aff: 5, mood: 7, form: 1.2, ovr: 1 }, flag: 'ca3' }, r: '{p}盯着那面墙很久，最后只说：“他们画得比我好看。”' },\n      { t: '“给每个孩子回一封信，全队一起签名。”', fx: { unity: 3, chem: 1.5, fans: 2, p: { aff: 5, mood: 6, form: 1, ovr: .5 }, flag: 'ca3' }, r: '签名签了三个小时。{p}负责写最后一句：“继续抢球。”' },\n      { t: '“回信，你自己写。”', fx: { p: { aff: 4, mood: 6, form: 1.2, ovr: .5, ego: 2 }, flag: 'ca3' }, r: '那封信{p}写了一个晚上，第二天交给你时，信封上沾了一点咖啡渍。' }] },\n    { id: 'ca_l1', cat: '专属线 · 凯塞多', who: CA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, CA) <= 30 && !done(c, 'ca2'); }, t: '{p}在训练里越来越保守，传球全是横传和回传。有人听见他自言自语：“多做一次，多错一次。”', o: [\n      { t: '“我想知道你为什么不敢往前传。”', roll: { p: 0.55, ok: { fx: { p: { aff: 10, mood: 6 }, flag: ['ca_l1', 'ca_fix'] }, r: '“我怕丢球之后，是我一个人在补。”{p}说，“可你提醒了我，我不是一个人。”' }, fail: { fx: { p: { aff: 2, mood: -1 }, flag: 'ca_l1' }, r: '{p}说：“我会努力的。”这句话你听了太多遍。' } } },\n      { t: '“球必须往前，否则中场就是死的。”', fx: { atk: 1, p: { aff: -5, mood: -5, form: -.5 }, flag: 'ca_l1' }, r: '{p}照做了，但每一次向前传球之后，他都会往回看一眼。' },\n      { t: '“今天训练别带脑子，随便踢。”', fx: { p: { aff: 3, mood: 5, form: .3 }, flag: 'ca_l1' }, r: '{p}一愣，笑了。那是他一周里第一次笑。' }] },\n    { id: 'ca_l2', cat: '专属线 · 凯塞多', who: CA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'ca_l1') >= 4 && aff(c, CA) <= 35 && !done(c, 'ca_fix'); }, t: '有传闻说另一家俱乐部想要{p}，而他本人最近把更衣室的储物柜清理得很干净。', o: [\n      { t: '请他吃一顿饭，不谈合同', roll: { p: 0.5, ok: { fx: { p: { aff: 14, mood: 8 }, flag: ['ca_fix'] }, r: '你们吃了一顿很安静的晚饭。最后他说：“我留下。因为这里有人看得见我做的那些事。”' }, fail: { fx: { p: { aff: -3, mood: -8, form: -1 }, unity: -2, flag: 'ca_cold' }, r: '{p}说了谢谢，没有再说别的。' } } },\n      { t: '“赛季结束后，你想走我不拦。”', fx: { p: { mood: 5, aff: 6, form: .5 }, flag: 'ca_promise' }, r: '{p}认真地看了你很久：“我记住了。”' },\n      { t: '“别听外面的，专心踢球。”', fx: { p: { aff: -6, mood: -6, ego: 3 }, unity: -2, flag: 'ca_cold' }, r: '{p}没有反驳，只是把耳机戴上了。' }] },\n\n    /* ---- 帕尔默 · 冷到发烫 ---- */\n    { id: 'pa_h1', cat: '专属线 · 帕尔默', who: PA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, PA) >= 62 && !done(c, 'pa_l1'); }, t: '训练结束，{p}拦住你：“教练，我进球之后做的那个动作，会不会让对手觉得我在挑衅？有记者问了，我不知道怎么答。”', o: [\n      { t: '“那是你的庆祝。你想怎么冷，就怎么冷。”', fx: { fans: 1, p: { aff: 6, mood: 4, ego: 3, form: .6 }, flag: 'pa1' }, r: '{p}笑了，缩起脖子做了一个夸张的发抖：“收到。”' },\n      { t: '“对手怎么想不归你管，你管下一脚。”', fx: { p: { aff: 5, mood: 3, form: .8, ego: -1 }, flag: 'pa1' }, r: '{p}点头：“好。我只管下一脚。”' },\n      { t: '“让记者去问球迷，球迷比你们更会玩。”', fx: { fans: 3, p: { aff: 4, mood: 2 }, flag: 'pa1' }, r: '第二天，社交媒体上多了一堆缩脖子的照片，其中一张是你的助教。' }] },\n    { id: 'pa_h2', cat: '专属线 · 帕尔默', who: PA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'pa1') >= 5 && aff(c, PA) >= 68 && (!done(c, 'pa_l1') || done(c, 'pa_fix')); }, t: '连续几场没进球后，外面开始有人说“冷过头了”。训练结束很久，{p}还一个人留在场上加练射门，一直练到灯被关掉。', o: [\n      { t: '“别练射门了，练传球。”', fx: { chem: 1.5, p: { aff: 6, mood: 4, form: 1 }, flag: 'pa2' }, r: '{p}叹了口气，然后把球摆在十米外的小标记上，一个一个地传。' },\n      { t: '“灯都关了，回家，明天再冷。”', fx: { p: { aff: 5, mood: 5, fit: 6 }, flag: 'pa2' }, r: '{p}被你拎着走出球场。路上他说：“教练，你比我妈还啰嗦。”' },\n      { t: '“陪你练，我来当门将。”', fx: { fatigue: 2, p: { aff: 8, mood: 6, form: .8, ego: -2 }, flag: 'pa2' }, r: '你被他打进了七个球，当场承认自己不适合当门将。' }] },\n    { id: 'pa_h3', cat: '专属线 · 帕尔默', who: PA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'pa2') >= 6 && aff(c, PA) >= 72 && (!done(c, 'pa_l1') || done(c, 'pa_fix')); }, t: '赛季快到尾声，{p}主动找到你：“教练，如果再有点球，我想让年轻人也上去罚。他们看我罚的时候，眼睛里全是害怕。我想让他们也试一试。”', o: [\n      { t: '“好。从明天开始，每天十个，轮流罚。”', fx: { unity: 3, chem: 2, morale: 3, p: { aff: 5, mood: 7, form: 1.2, ovr: 1 }, flag: 'pa3' }, r: '一周后，年轻球员们站上点球点的时候，终于不再盯着地面了。' },\n      { t: '“你来教，我来计时。”', fx: { chem: 2.5, unity: 2, p: { aff: 5, mood: 8, ego: 3, ovr: .5 }, flag: 'pa3' }, r: '{p}站在点球点上，一边示范一边讲：“呼吸，看球，别看门将。”队友们听得比战术会还认真。' },\n      { t: '“好主意，但别给自己太大压力。”', fx: { unity: 2, morale: 2, p: { aff: 4, mood: 5, form: 1, ovr: .5 }, flag: 'pa3' }, r: '训练结束时，{p}对着自己的影子缩了缩脖子。' }] },\n    { id: 'pa_l1', cat: '专属线 · 帕尔默', who: PA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, PA) <= 30 && !done(c, 'pa2'); }, t: '{p}最近训练时总是一个人戴着耳机，传球越来越少。助教说：“他私下讲，没人在乎他开不开心，只在乎他进不进球。”', o: [\n      { t: '“约他喝杯咖啡，聊点跟足球无关的。”', roll: { p: 0.55, ok: { fx: { p: { aff: 10, mood: 6 }, flag: ['pa_l1', 'pa_fix'] }, r: '你们聊了半个小时的游戏、音乐，还有他最爱的那家薯条店。{p}离开前说：“下次还聊。”' }, fail: { fx: { p: { aff: 2, mood: -2 }, flag: 'pa_l1' }, r: '{p}礼貌地聊了半小时。你知道他没有说真话。' } } },\n      { t: '“球队需要你进球，别的以后再说。”', fx: { p: { aff: -6, mood: -6, form: -.5, ego: 3 }, flag: 'pa_l1' }, r: '{p}没有反驳，戴上耳机继续练射门。' },\n      { t: '让助教去聊', fx: { p: { aff: 1, mood: 1 }, flag: 'pa_l1' }, r: '{p}知道是谁派来的。他礼貌地说了谢谢。' }] },\n    { id: 'pa_l2', cat: '专属线 · 帕尔默', who: PA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'pa_l1') >= 4 && aff(c, PA) <= 35 && !done(c, 'pa_fix'); }, t: '{p}的经纪人联系了俱乐部：几家球队表示了兴趣，“球员想知道自己在这个项目里到底是什么位置”。', o: [\n      { t: '亲自找他谈，把规划摊开', roll: { p: 0.5, ok: { fx: { p: { aff: 14, mood: 8 }, flag: ['pa_fix'] }, r: '“我留下，不是为了合同，”{p}说，“是因为你问了我，累不累。”' }, fail: { fx: { p: { aff: -3, mood: -8, form: -1 }, unity: -2, flag: 'pa_cold' }, r: '{p}听完说：“我知道你想让我留下。但我想听的，不是这个。”' } } },\n      { t: '“赛季结束后，由你自己决定。”', fx: { p: { mood: 5, aff: 6, form: .5 }, flag: 'pa_promise' }, r: '{p}点了点头：“谢谢。”你不确定自己是不是做对了。' },\n      { t: '“合同在，没有人可以随便离开。”', fx: { p: { aff: -8, mood: -8, ego: 3 }, unity: -2, flag: 'pa_cold' }, r: '{p}什么都没说。第二天，他的耳机再也没摘下来。' }] },\n\n    /* ---- 若昂·佩德罗 · 九号球衣 ---- */\n    { id: 'jp_h1', cat: '专属线 · 若昂·佩德罗', who: JP, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, JP) >= 62 && !done(c, 'jp_l1'); }, t: '连续几场没进球后，{p}赛后一个人留在场边捡球。他问你：“教练，九号是不是一定要进球才算数？”', o: [\n      { t: '“九号要的是，让对手的后卫晚上睡不着。”', fx: { p: { aff: 6, mood: 4, form: .8 }, flag: 'jp1' }, r: '{p}笑了：“那我今晚也睡不着——我在想下一次怎么跑。”' },\n      { t: '“进球是结果，你的跑动才是过程。”', fx: { def: 1, p: { aff: 5, mood: 3, form: .6 }, flag: 'jp1' }, r: '{p}把球放回球筐：“好。我看看这个过程能不能让他们慌。”' },\n      { t: '“不进也要射，我不怪你。”', fx: { atk: 1, p: { aff: 7, mood: 5, ego: 2 }, flag: 'jp1' }, r: '下一次训练里，{p}在门前连射了二十脚，其中十七个在门框内。' }] },\n    { id: 'jp_h2', cat: '专属线 · 若昂·佩德罗', who: JP, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'jp1') >= 5 && aff(c, JP) >= 68 && (!done(c, 'jp_l1') || done(c, 'jp_fix')); }, t: '{p}在训练后拿着笔记本找到你：“教练，你为什么总让我们在对手传第三脚的时候压上去？我想学。”', o: [\n      { t: '“我给你讲。今晚来办公室。”', fx: { def: 1.5, chem: 1.5, p: { aff: 7, mood: 4, form: .6 }, flag: 'jp2' }, r: '{p}抱着本子来了，走的时候本子上画满了箭头。第二天，他的压迫比谁都早半步。' },\n      { t: '“看录像，自己找答案。”', fx: { p: { aff: 5, mood: 2, form: 1, ego: -1 }, flag: 'jp2' }, r: '{p}看了一晚上录像。第二天他走进更衣室，眼睛里全是血丝和答案。' },\n      { t: '“去问凯塞多，他是最懂的。”', fx: { unity: 2, chem: 2, p: { aff: 5, mood: 3, form: .5 }, flag: 'jp2' }, r: '{p}和凯塞多在场边站了二十分钟，一个说，一个点头。晚上，两个人一起去吃了饭。' }] },\n    { id: 'jp_h3', cat: '专属线 · 若昂·佩德罗', who: JP, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'jp2') >= 6 && aff(c, JP) >= 72 && (!done(c, 'jp_l1') || done(c, 'jp_fix')); }, t: '赛季临近尾声，{p}主动联系了青训营：“我想去给孩子们踢一场表演赛，教他们怎么在禁区里转身。”', o: [\n      { t: '“好。把那一整天都空出来。”', fx: { morale: 3, unity: 2, fans: 2, p: { aff: 5, mood: 7, form: 1.2, ovr: 1 }, flag: 'jp3' }, r: '孩子们围着他转了一下午。他回到更衣室时，球袜里还夹着一张孩子送的贴纸。' },\n      { t: '“带上两个队友一起去。”', fx: { chem: 2, unity: 3, p: { aff: 5, mood: 6, form: 1, ovr: .5 }, flag: 'jp3' }, r: '三个人在青训场上被一群孩子追着跑，场边有人拍下了视频。' },\n      { t: '“去吧，但周六还有比赛。”', fx: { def: 1, atk: 1, p: { aff: 4, mood: 5, form: 1, ovr: .5 }, flag: 'jp3' }, r: '他匆匆赶回来参加训练，球鞋上还沾着青训场的草屑。' }] },\n    { id: 'jp_l1', cat: '专属线 · 若昂·佩德罗', who: JP, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, JP) <= 30 && !done(c, 'jp2'); }, t: '{p}最近射门时越来越犹豫，丢了几次好机会之后更是低头不语。有人听见他说：“如果每一次没进都会被放大，我宁可什么都不射。”', o: [\n      { t: '“约他过来，一起看他的进球集锦。”', roll: { p: 0.6, ok: { fx: { p: { aff: 11, mood: 6 }, flag: ['jp_l1', 'jp_fix'] }, r: '“我忘了自己进过这么多球。”{p}盯着屏幕说，“谢谢你提醒我。”' }, fail: { fx: { p: { aff: 2, mood: 1 }, flag: 'jp_l1' }, r: '{p}看完点点头，但你知道，这不是一次谈话能解决的。' } } },\n      { t: '“九号就是要进球，别想太多。”', fx: { p: { aff: -5, mood: -6, form: -.5 }, flag: 'jp_l1' }, r: '{p}低着头，没有说话。' },\n      { t: '“给他放两天假。”', fx: { p: { aff: 3, mood: 5, fit: 8 }, flag: 'jp_l1' }, r: '两天后他回来了，眼神清楚了一些，也没提那件事。' }] },\n    { id: 'jp_l2', cat: '专属线 · 若昂·佩德罗', who: JP, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'jp_l1') >= 4 && aff(c, JP) <= 35 && !done(c, 'jp_fix'); }, t: '更衣室里出现了微妙的分化：有人觉得{p}占了太多球，有人觉得球队没有给他足够的支持。训练里，几个人传球刻意绕开他。', o: [\n      { t: '请{p}当面谈，把话说开', roll: { p: 0.5, ok: { fx: { unity: 6, p: { aff: 14, mood: 6 }, flag: ['jp_fix'] }, r: '你们谈了整整一个下午。出来时，他把球放在点球点上，认真地踢了一脚。' }, fail: { fx: { unity: -4, p: { aff: -2, mood: -3 }, flag: 'jp_cold' }, r: '“你需要的是一个只会执行的九号，”{p}说，“我不是那种人。”' } } },\n      { t: '把他的位置挪到边路，减轻责任', fx: { unity: -4, p: { aff: -10, mood: -10, ego: 4 }, flag: 'jp_cold' }, r: '{p}沉默地照做了，但训练之后，他一个人坐了很久。' },\n      { t: '“所有人到会议室，一个一个说。”', fx: { unity: 1, p: { aff: -3, mood: -2 }, flag: 'jp_cold' }, r: '会开了两个小时。该说的都说了，但有些东西没有被说开。' }] },\n\n    /* ---- 埃斯特旺 · 十九岁的右脚 ---- */\n    { id: 'es_h1', cat: '专属线 · 埃斯特旺', who: ES, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, ES) >= 62 && !done(c, 'es_l1'); }, t: '{p}拿着手机找到你：“教练，今天又有人把我和一位传奇放在一起比较，评论区好吓人。我该怎么办？”', o: [\n      { t: '“别看评论区。你的任务在草皮上。”', fx: { p: { aff: 6, mood: 4, form: .6 }, flag: 'es1' }, r: '{p}认真点头，当场把手机交给了凯塞多保管。' },\n      { t: '“你只需要成为你自己。”', fx: { p: { aff: 6, mood: 5, form: .5, ego: -1 }, flag: 'es1' }, r: '{p}想了一会儿：“那……我就踢我自己的足球。”' },\n      { t: '“我给你找个人，聊聊怎么处理这些事。”', fx: { unity: 2, chem: 1, p: { aff: 6, mood: 4 }, flag: 'es1' }, r: '{p}和詹姆斯聊了很久。回来时他轻松多了，没人知道他们聊了什么。' }] },\n    { id: 'es_h2', cat: '专属线 · 埃斯特旺', who: ES, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'es1') >= 5 && aff(c, ES) >= 68 && (!done(c, 'es_l1') || done(c, 'es_fix')); }, t: '一场重要比赛前的早晨六点，{p}已经出现在训练场上，一个人在草皮上做小碎步。你路过时，他吓了一跳。', o: [\n      { t: '陪他跑两圈，聊聊天', fx: { fatigue: 1, p: { aff: 7, mood: 5, form: .6 }, flag: 'es2' }, r: '你们跑了两圈，聊到了他小时候踢球的街头。他笑得很大声。' },\n      { t: '让他回去再睡一觉', fx: { p: { aff: 5, mood: 3, fit: 8 }, flag: 'es2' }, r: '{p}不好意思地挠头：“教练，我是不是很没出息？”“没有，”你说，“我也失眠过。”' },\n      { t: '“紧张是好事，说明你在乎。”', fx: { p: { aff: 6, mood: 4, form: 1 }, flag: 'es2' }, r: '{p}深呼吸了三次，那天他踢了职业生涯里最稳的九十分钟。' }] },\n    { id: 'es_h3', cat: '专属线 · 埃斯特旺', who: ES, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'es2') >= 6 && aff(c, ES) >= 72 && (!done(c, 'es_l1') || done(c, 'es_fix')); }, t: '赛季后半程，{p}主动提出要去帮青训营的孩子们练过人：“我小时候没有人教我，我想教他们。”', o: [\n      { t: '“好。每周一次，由你主导。”', fx: { morale: 3, unity: 2, chem: 1.5, p: { aff: 5, mood: 7, form: 1.2, ovr: 1 }, flag: 'es3' }, r: '第一周，孩子们追着他要签名；第二周，他们开始问他“怎么过人才不被铲倒”。' },\n      { t: '“带上詹姆斯，你们一起。”', fx: { unity: 3, chem: 2, p: { aff: 5, mood: 6, form: 1, ovr: .5 }, flag: 'es3' }, r: '队长和小将站在一群孩子中间，场面意外地和谐。' },\n      { t: '“等你再长大一点。”', fx: { p: { aff: 3, mood: 3, form: .5, ovr: .5, ego: -2 }, flag: 'es3' }, r: '{p}笑了笑：“好，那我先把自己练好。”' }] },\n    { id: 'es_l1', cat: '专属线 · 埃斯特旺', who: ES, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, ES) <= 30 && !done(c, 'es2'); }, t: '{p}最近训练时一句话也不说，吃饭时总是一个人坐在角落，手机屏幕亮了又灭。有人说：“他可能有点想家了。”', o: [\n      { t: '约他吃饭，什么都不聊，只吃', roll: { p: 0.6, ok: { fx: { p: { aff: 11, mood: 6 }, flag: ['es_l1', 'es_fix'] }, r: '你们吃了很多，聊得很少。结账时他小声说：“谢谢教练，我好像好多了。”' }, fail: { fx: { p: { aff: 2, mood: 1 }, flag: 'es_l1' }, r: '{p}吃完饭点点头，但你知道，他想要的不只是一顿饭。' } } },\n      { t: '“职业球员不能带着情绪训练。”', fx: { p: { aff: -5, mood: -6, form: -.5 }, flag: 'es_l1' }, r: '{p}低着头说“知道了”，却再也没有看你一眼。' },\n      { t: '给他放三天假，回家看看', fx: { p: { aff: 4, mood: 6, fit: 8 }, flag: 'es_l1' }, r: '三天后他回来了，脸上多了点笑，还带回来一盒家里人做的点心。' }] },\n    { id: 'es_l2', cat: '专属线 · 埃斯特旺', who: ES, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'es_l1') >= 4 && aff(c, ES) <= 35 && !done(c, 'es_fix'); }, t: '{p}的经纪人打来电话，说有几家俱乐部表示了兴趣，球员“想要更多出场时间”。', o: [\n      { t: '亲自找他，把他在球队规划里的位置说清楚', roll: { p: 0.5, ok: { fx: { p: { aff: 14, mood: 8 }, flag: ['es_fix'] }, r: '“我想踢球，”{p}说，“但我也想被需要。你让我觉得，两个都有。”' }, fail: { fx: { p: { aff: -3, mood: -8, form: -1 }, unity: -2, flag: 'es_cold' }, r: '{p}听完说：“教练，我知道你是好人。可我只有十九岁，我等不起。”' } } },\n      { t: '“赛季结束后，由你自己决定。”', fx: { p: { mood: 5, aff: 6, form: .5 }, flag: 'es_promise' }, r: '{p}点了点头：“谢谢教练。”你不确定自己是不是做对了。' },\n      { t: '“合同在，没有人可以随便离开。”', fx: { p: { aff: -8, mood: -8, ego: 3 }, unity: -2, flag: 'es_cold' }, r: '{p}什么都没说。第二天，他的柜子里少了几样东西。' }] },\n\n    /* ---- 大马丁 · 十二码前的话 ---- */\n    { id: 'ma_h1', cat: '专属线 · 大马丁', who: MA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, MA) >= 62 && !done(c, 'ma_l1'); }, t: '{p}来找你，难得没有开玩笑：“教练，彭德斯每天跟着我训练，但他有时候不敢出击。我想教他，可又怕他觉得我在抢他的机会。”', o: [\n      { t: '“教吧。你教得越多，他越不会怕你。”', fx: { unity: 2, chem: 1.5, p: { aff: 6, mood: 4 }, flag: 'ma1' }, r: '{p}笑着点头，当天下午就带着彭德斯练了三十分钟出击。' },\n      { t: '“先从最简单的开始：站位。”', fx: { def: 1, chem: 1, p: { aff: 5, mood: 3, form: .5 }, flag: 'ma1' }, r: '两个人在门前画了一晚上的线。第二天，彭德斯的站位精确了半步。' },\n      { t: '“你用你的方式教，我不管。”', fx: { p: { aff: 7, mood: 5, ego: 3 }, flag: 'ma1' }, r: '{p}眨眨眼：“好，那我就用我的方式。”你有预感，这会有点吵。' }] },\n    { id: 'ma_h2', cat: '专属线 · 大马丁', who: MA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'ma1') >= 5 && aff(c, MA) >= 68 && (!done(c, 'ma_l1') || done(c, 'ma_fix')); }, t: '一次失误之后，{p}在更衣室里开玩笑说“那球是门柱的错”，但你看到，没人的时候他一个人坐了很久。', o: [\n      { t: '在他身边坐一会儿，什么都不说', fx: { p: { aff: 7, mood: 5, form: .6 }, flag: 'ma2' }, r: '你们并排坐了十分钟，最后他说：“你是第一个不劝我的人。”' },\n      { t: '告诉他：“你扑过的球，比丢的多得多。”', fx: { p: { aff: 6, mood: 4, form: 1 }, flag: 'ma2' }, r: '{p}翻了个白眼：“教练，你这样就像在哄小孩。”但他的嘴角在上扬。' },\n      { t: '“明天加练，一对一扑救。”', fx: { def: 1.5, fatigue: 3, p: { aff: 5, mood: 2, form: 1.2 }, flag: 'ma2' }, r: '那天训练，{p}扑了八十多个球，结束时手套已经磨破了。' }] },\n    { id: 'ma_h3', cat: '专属线 · 大马丁', who: MA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'ma2') >= 6 && aff(c, MA) >= 72 && (!done(c, 'ma_l1') || done(c, 'ma_fix')); }, t: '赛季快结束的时候，{p}把一副磨得发白的手套放在你的桌上：“教练，这个送给彭德斯。他练得比我当年还狠。”', o: [\n      { t: '“你自己交给他。”', fx: { morale: 3, unity: 3, chem: 1.5, p: { aff: 5, mood: 7, form: 1.2, ovr: 1 }, flag: 'ma3' }, r: '交手套的时候，{p}什么玩笑都没开。彭德斯接过去，双手握得很紧。' },\n      { t: '“我们一起交给他，在全队面前。”', fx: { unity: 4, morale: 3, p: { aff: 5, mood: 8, ego: 3, ovr: .5 }, flag: 'ma3' }, r: '更衣室里响起了很长一阵掌声。{p}挥手：“好了好了，我还没退休呢！”' },\n      { t: '“先收着，赛季结束再说。”', fx: { p: { aff: 3, mood: 5, form: 1, ovr: .5 }, flag: 'ma3' }, r: '{p}把手套放回抽屉：“好。我们先把点球大战踢完。”' }] },\n    { id: 'ma_l1', cat: '专属线 · 大马丁', who: MA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, MA) <= 30 && !done(c, 'ma2'); }, t: '{p}最近赛后几乎不说话，训练里也不再开玩笑。有人听见他在更衣室里嘟囔：“既然我已经不被需要了，我还有必要装得很吵吗？”', o: [\n      { t: '私下约他，直接问：“你需要什么？”', roll: { p: 0.55, ok: { fx: { p: { aff: 10, mood: 6 }, flag: ['ma_l1', 'ma_fix'] }, r: '“我需要有人跟我说，我没有过时。”{p}说完又立刻补了一句，“这句话你别记。”你还是记了。' }, fail: { fx: { p: { aff: 2, mood: -2 }, flag: 'ma_l1' }, r: '{p}笑着说“我没事”，但笑得太用力。' } } },\n      { t: '“门将是最后一道防线，别想多了。”', fx: { p: { aff: -5, mood: -5, form: -.5 }, flag: 'ma_l1' }, r: '{p}一言不发，戴上手套继续练习。' },\n      { t: '让门将教练去聊', fx: { p: { aff: 1, mood: 1 }, flag: 'ma_l1' }, r: '{p}知道是谁派来的。他礼貌地说了谢谢。' }] },\n    { id: 'ma_l2', cat: '专属线 · 大马丁', who: MA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'ma_l1') >= 4 && aff(c, MA) <= 35 && !done(c, 'ma_fix'); }, t: '更衣室里有人觉得{p}太吵，也有人觉得他是球队的灵魂。训练里，他的玩笑越来越少，周围的气氛也跟着僵了下来。', o: [\n      { t: '请{p}当面谈，把话说开', roll: { p: 0.5, ok: { fx: { unity: 6, p: { aff: 14, mood: 6 }, flag: ['ma_fix'] }, r: '你们谈了整整一个下午。出来时，更衣室里响起了熟悉的笑声。' }, fail: { fx: { unity: -4, p: { aff: -2, mood: -3 }, flag: 'ma_cold' }, r: '“你不要一个吵的门将，”{p}说，“那我就安静地待着。”' } } },\n      { t: '“你想怎么对待更衣室，由你自己决定。”', fx: { p: { aff: 6, mood: 5 }, flag: 'ma_promise' }, r: '{p}愣了一下，然后点了点头：“这话我记着。”' },\n      { t: '“所有人到会议室，一个一个说。”', fx: { unity: 1, p: { aff: -3, mood: -2 }, flag: 'ma_cold' }, r: '会开了两个小时。该说的都说了，但有些东西没有被说开。' }] }\n  ],\n\n  /* 梗图鉴（成就）：check(S, H, final) 返回 true 就解锁 */\n  achievements: [\n    { id: 'first', name: '第一周', desc: '完成第一周的排程', check: function (S) { return S.week >= 1; } },\n    { id: 'derby', name: '伦敦是蓝色的', desc: '联赛中赢下一场伦敦德比（阿森纳或热刺）', check: function (S) { return S.hist.some(function (h) { return (h.opp === 'ARS' || h.opp === 'TOT') && h.cn === '英超' && h.out === 'W'; }); } },\n    { id: 'anfield', name: '老朋友的主场', desc: '客场击败利物浦', check: function (S) { return S.hist.some(function (h) { return h.opp === 'LIV' && !h.h && h.out === 'W'; }); } },\n    { id: 'bigwin', name: '血洗', desc: '一场比赛净胜三球以上', check: function (S) { return S.stats.bigWins >= 1; } },\n    { id: 'streak8', name: '一场一场来', desc: '各项赛事 8 连胜', check: function (S) { return S.streak >= 8; } },\n    { id: 'unbeaten10', name: '十场不败', desc: '各项赛事 10 场不败', check: function (S) { return S.unbeaten >= 10; } },\n    { id: 'talks20', name: '心灵导师', desc: '累计找球员谈话 20 次', check: function (S) { return S.stats.talks >= 20; } },\n    { id: 'unity85', name: '一家人', desc: '更衣室团结达到 85', check: function (S) { return S.attrs.unity >= 85; } },\n    { id: 'atk80', name: '十号位的魔术', desc: '进攻体系达到 80', check: function (S) { return S.attrs.atk >= 80; } },\n    { id: 'def80', name: '三中卫', desc: '防守体系达到 80', check: function (S) { return S.attrs.def >= 80; } },\n    { id: 'squad27', name: '二十七个名字', desc: '看见那张贴满更衣室的名单，并数了一遍', check: function (S) { return S.seen.squad27 != null; } },\n    { id: 'liga', name: '蓝色的伦敦', desc: '拿下英超冠军', check: function (S, H, final) { return final && S.ending && S.ending.rank === 1; } },\n    { id: 'efl', name: '联赛杯的第一座', desc: '拿下联赛杯', check: function (S) { return S.trophies.indexOf('联赛杯') >= 0; } },\n    { id: 'fa', name: '温布利的蓝色', desc: '拿下足总杯', check: function (S) { return S.trophies.indexOf('足总杯') >= 0; } },\n    { id: 'dtreble', name: '国内三冠', desc: '同一赛季拿下英超、足总杯和联赛杯', check: function (S) { var t = S.trophies; return t.indexOf('足总杯') >= 0 && t.indexOf('联赛杯') >= 0 && t.indexOf('英超') >= 0; } },\n    { id: 'invincible', name: '不败的 DNA', desc: '拿下英超冠军，且整个赛季各项赛事一场不输', check: function (S, H, final) { return !!final && S.stats.l === 0 && !!S.ending && S.ending.rank === 1; } },\n    { id: 'pa30', name: '好冷', desc: '帕尔默赛季总进球达到 30', check: function (S) { return S.pl[PA].goals >= 30; } },\n    { id: 'jp40', name: '禁区里的人', desc: '若昂·佩德罗赛季总进球达到 40', check: function (S) { return S.pl[JP].goals >= 40; } },\n    { id: 'fortress', name: '斯坦福桥堡垒', desc: '整个英超赛季主场不败', check: function (S, H, final) { if (!final) return false; var hs = S.hist.filter(function (h) { return h.cn === '英超' && h.h; }); return hs.length >= 19 && !hs.some(function (h) { return h.out === 'L'; }); } },\n    { id: 'story_ja', name: '袖标的重量', desc: '走完詹姆斯的专属线', check: function (S) { return !!S.flags.ja3; } },\n    { id: 'story_ca', name: '另一半场地', desc: '走完凯塞多的专属线', check: function (S) { return !!S.flags.ca3; } },\n    { id: 'story_pa', name: '冷到发烫', desc: '走完帕尔默的专属线', check: function (S) { return !!S.flags.pa3; } },\n    { id: 'story_jp', name: '九号球衣', desc: '走完若昂·佩德罗的专属线', check: function (S) { return !!S.flags.jp3; } },\n    { id: 'story_es', name: '十九岁的右脚', desc: '走完埃斯特旺的专属线', check: function (S) { return !!S.flags.es3; } },\n    { id: 'story_ma', name: '十二码前的话', desc: '走完大马丁的专属线', check: function (S) { return !!S.flags.ma3; } },\n    { id: 'story_all', name: '六个故事，一支球队', desc: '同一赛季走完六条专属线', check: function (S) { var f = S.flags; return !!(f.ja3 && f.ca3 && f.pa3 && f.jp3 && f.es3 && f.ma3); } },\n    { id: 'fix', name: '冰释前嫌', desc: '把一段正在破裂的关系拉了回来', check: function (S) { var f = S.flags; return !!(f.ja_fix || f.ca_fix || f.pa_fix || f.jp_fix || f.es_fix || f.ma_fix); } },\n    { id: 'cold', name: '谈崩了', desc: '一名核心球员和你的关系彻底破裂', check: function (S) { var f = S.flags; return !!(f.ja_cold || f.ca_cold || f.pa_cold || f.jp_cold || f.es_cold || f.ma_cold); } },\n    { id: 'endall', name: '全结局收藏家', desc: '集齐结局图鉴里的所有结局', check: function () { return false; } }\n  ],\n\n  /* 结局（本赛季无欧战，r.ucl 恒为 'none'） */\n  endings: function (S, r) {\n    var t = r.tro, has = function (n) { return t.indexOf(n) >= 0; };\n    var liga = has('英超'), fa = has('足总杯'), efl = has('联赛杯');\n    var cup = fa || efl;\n    var head, body, grade;\n    if (r.fired) { head = '提前离开的人'; grade = 'D'; body = '董事会的耐心比赛季更短。你收拾办公室的时候，更衣室里没有人说话，直到最后一个人走过来，把那件训练服还给你。\\n你在门口回头看了一眼，对自己说：一场一场来。'; }\n    else if (liga && S.stats.l === 0) { head = '再一次，不败'; grade = 'S+'; body = '最后一轮的哨声响起时，积分榜上的“负”那一栏，还是零。\\n你在勒沃库森做过的那件事，这一次，发生在了伦敦。'; }\n    else if (liga && fa && efl) { head = '国内三冠'; grade = 'S+'; body = '英超、足总杯、联赛杯，三座奖杯整整齐齐地摆在了展示柜里。\\n那天晚上的斯坦福桥，没有人愿意回家。欧洲的故事，留给明年。'; }\n    else if (liga && cup) { head = '国内双冠'; grade = 'S'; body = '联赛冠军和一座杯赛冠军同时到手。球迷在街头唱了一整夜，邻居们的窗户关得紧紧的。\\n欧洲的故事，留给明年。'; }\n    else if (liga) { head = '英超冠军'; grade = 'A+'; body = '最后一轮结束的哨声响起时，你没有冲到场边。你站在原地，等所有人都抱在了一起，才慢慢走过去。\\n你终于，把这座奖杯带回了斯坦福桥。'; }\n    else if (fa && efl) { head = '双杯在手'; grade = 'A'; body = '联赛杯和足总杯，两座杯赛冠军，一年之内在温布利走了两趟。\\n赛季结束那天，你在训练场上多待了一会儿。'; }\n    else if (cup) { head = '杯赛冠军'; grade = 'B+'; body = '一座杯赛冠军，不是最大的，但足以让这个赛季不被遗忘。\\n赛季结束的那天，你在训练场上多待了一会儿。'; }\n    else if (r.rank <= 2) { head = '差了一点点的亚军'; grade = 'B+'; body = '赛季结束的时候，积分榜上你的名字紧挨着榜首。球迷们给你鼓掌，你却想起了那几场本可以赢的比赛。\\n“一点点，永远是最远的距离。”'; }\n    else if (r.rank === 3) { head = '离领奖台只差一步'; grade = 'B'; body = '联赛第三。欧冠资格稳稳到手，周二周三的夜晚，下个赛季终于有比赛可看了。\\n你用笔在日历上划掉了最后一周。'; }\n    else if (r.rank === 4) { head = '重返欧冠区'; grade = 'B'; body = '联赛第四，赛季目标达成。看台上没有欢呼，也没有嘘声。\\n对一支把二十七个名字挤在更衣室里的球队来说，这是一个能继续往前走的赛季。'; }\n    else if (r.rank <= 7) { head = '欧战资格擦边'; grade = 'C+'; body = '联赛第' + r.rank + '，欧战资格勉强保住。董事会没有说话，球迷们互相安慰：“明年会更好。”\\n你没有反驳。'; }\n    else if (r.rank <= 14) { head = '平淡的中游'; grade = 'C'; body = '联赛第' + r.rank + '。没有降级压力，也没有什么惊喜。赛季结束，球员们各自回家，你在更衣室里待了很久，把每个人的储物柜都看了一遍。'; }\n    else { head = '惊险过关'; grade = 'D+'; body = '联赛第' + r.rank + '，离降级区只差几个积分。赛季结束的那一晚，你在车里坐了很久，才发动引擎。'; }\n    /* 风格尾注 */\n    var sty = { iron: '你的训练场上永远有最后一圈。球员们抱怨过，也都跑完了。', kind: '你的办公室永远是打开的。更衣室里，没有人觉得自己是一个人。', tactic: '你的笔记本写满了字。每一节课、每一段录像，球员们都记得。', media: '你把发布会当成了第二个训练场。无论赢输，球迷们都愿意听你说话。', mix: '你什么都做了一点，也许这就是“一场一场来”。' };\n    var nm = { iron: '铁腕型', kind: '亲和型', tactic: '战术大师型', media: '公关型', mix: '均衡型' };\n    var extra = '';\n    if (!r.fired && r.goal === 'dream' && liga && fa && efl) extra = '当初你在办公室里说的话，成真了。';\n    else if (!r.fired && r.goal === 'dream' && !liga) extra = '三线作战的豪言壮语，终究只是一句话。';\n    else if (!r.fired && r.goal === 'push' && r.rank > 3) extra = '“争冠”两个字，还是太重了。';\n    else if (!r.fired && r.goal === 'safe' && r.rank <= 2) extra = '一个“稳健”的目标，被你打成了争冠。';\n    else if (!r.fired && r.goal === 'safe' && r.rank > 4) extra = '连欧冠区都没能回去，周二的夜晚，电视里放的还是别人的比赛。';\n    var IDS = { '提前离开的人': 'fired', '再一次，不败': 'invincible', '国内三冠': 'dtreble', '国内双冠': 'double', '英超冠军': 'liga', '双杯在手': 'cupdouble', '杯赛冠军': 'cup', '差了一点点的亚军': 'runner', '离领奖台只差一步': 'top3', '重返欧冠区': 'top4', '欧战资格擦边': 'europa', '平淡的中游': 'mid', '惊险过关': 'scare' };\n    return { id: IDS[head], title: head, grade: grade, body 队<\/th><th>赛<\/th><th>胜<\/th><th>平<\/th><th>负<\/th><th>净<\/th><th>分<\/th><\/tr>';\n  tab.forEach(function (x, i) {\n    var z = i < 4 ? 'z-cl' : i < 6 ? 'z-el' : i >= n - 3 ? 'z-rel' : '';\n    out += '<tr class=\"' + (x.id === CFG.club ? 'me ' : '') + z + '\"><td>' + (i + 1) + '<\/td><td>' + esc(CG.tname(x.id)) + '<\/td><td>' + x.t.p + '<\/td><td>' + x.t.w + '<\/td><td>' + x.t.d + '<\/td><td>' + x.t.l + '<\/td><td>' + (x.gd > 0 ? '+' : '') + x.gd + '<\/td><td><b>' + x.t.pts + '<\/b><\/td><\/tr>';\n  });\n  out += '<\/table><\/div><p class=\"hint\">绿：欧冠区　黄：欧战区　红：降级区<\/p><\/section>';\n  var u = S.ucl;\n  if (CFG.ucl) out += '<section class=\"panel\"><h2>欧冠<\/h2>';\n  if (!CFG.ucl) { /* 本赛季没有欧战 */ }\n  else if (u.stage === 'league') {\n    var ut = CG.sortTable(u.table);\n    var my = 0; ut.forEach(function (x, i) { if (x.id === CFG.club) my = i; });\n    var from = Math.max(0, Math.min(my - 3, ut.length - 8)), show = ut.slice(from, from + 8);\n    out += '<p class=\"hint\">联赛阶段：前 8 直接进入十六强，9–24 名打附加赛。<\/p><div class=\"scroll-x\"><table class=\"tb\"><tr><th>#<\/th><th>球队<\/th><th>赛<\/th><th>净<\/th><th>分<\/th><\/tr>';\n    show.forEach(function (x, k) { var i = from + k; out += '<tr class=\"' + (x.id === CFG.club ? 'me ' : '') + (i < 8 ? 'z-cl' : i < 24 ? 'z-el' : 'z-rel') + '\"><td>' + (i + 1) + '<\/td><td>' + esc(CG.tname(x.id)) + '<\/td><td>' + x.t.p + '<\/td><td>' + (x.gd > 0 ? '+' : '') + x.gd + '<\/td><td><b>' + x.t.pts + '<\/b><\/td><\/tr>'; });\n    out += '<\/table><\/div>';\n  } else {\n    var NM = { po: '附加赛', r16: '十六强', qf: '八强', sf: '四强', f: '决赛' };\n    out += '<p>' + (u.stage === 'won' ? '<b class=\"up\">欧冠冠军<\/b>' : u.stage === 'out' ? '<b class=\"down\">已出局<\/b>（' + (u.exit ? NM[u.exit] || '联赛阶段' : '联赛阶段') + '）' : '联赛阶段第 ' + u.rank + ' 名，当前：<b>' + (NM[u.stage] || u.stage) + '<\/b>') + '<\/p>';\n  }\n  if (CFG.ucl) out += '<\/section>';\n  out += '<section class=\"panel\"><h2>杯赛与奖杯<\/h2>';\n  CFG.cups.forEach(function (c) { var cs = S.cups[c.id]; out += '<div class=\"fixt\" style=\"grid-template-columns:1fr auto\"><b>' + esc(c.name) + '<\/b><span>' + (cs.won ? '<b class=\"up\">冠军<\/b>' : cs.alive ? '进行中：' + esc(c.rounds[cs.r].name) : '<span class=\"down\">止步 ' + esc(cs.exit || '') + '<\/span>') + '<\/span><\/div>'; });\n  out += '<p class=\"hint\">本季奖杯：' + (S.trophies.length ? S.trophies.join('、') : '暂无') + '　战绩 ' + S.stats.w + '胜 ' + S.stats.d + '平 ' + S.stats.l + '负，进 ' + S.stats.gf + ' 失 ' + S.stats.ga + '<\/p><\/section>';\n  var up = S.fx.filter(function (f) { return !f.played; }).slice(0, 6), hs = S.hist.slice(-6).reverse();\n  out += '<section class=\"panel\"><h2>接下来的比赛<\/h2>' + up.map(function (f) { var t = CG.oppTier(S, f.opp); return '<div class=\"fixt\"><div class=\"d\">' + CG.dTxt(f.date).replace('月', '/').replace('日', '') + '<\/div><div class=\"o\"><b>' + (f.neutral ? '' : f.h ? '主 ' : '客 ') + esc(CG.tname(f.opp)) + '<\/b><small>' + esc(f.cn + ' · ' + f.rd) + '<\/small><\/div><div>' + tag(t[0], t[1]) + '<\/div><\/div>'; }).join('') + '<\/section>';\n  if (hs.length) out += '<section class=\"panel\"><h2>最近战绩<\/h2>' + hs.map(function (h) { return '<div class=\"fixt\" style=\"grid-template-columns:44px 1fr auto\"><div class=\"d\">' + CG.dTxt(h.date).replace('月', '/').replace('日', '') + '<\/div><div class=\"o\"><b>' + esc(CG.tname(h.opp)) + '<\/b><small>' + esc(h.cn + ' · ' + h.rd) + '<\/small><\/div><div class=\"num\"><b class=\"' + (h.out === 'W' ? 'up' : h.out === 'L' ? 'down' : 'flat') + '\">' + h.gf + '–' + h.ga + '<\/b><\/div><\/div>'; }).join('') + '<\/section>';\n  out += endCodex() + achPanel();\n  return out;\n}\nfunction achPanel() {\n  var g = getAch(), all = CFG.achievements || [];\n  return '<section class=\"panel\"><h2>梗图鉴 <small class=\"hint\" style=\"font-weight:400;text-transform:none;letter-spacing:0\">' + Object.keys(g).length + ' / ' + all.length + '<\/small><\/h2><div class=\"ach\">' + all.map(function (a) { var on = g[a.id] || (S && S.ach && S.ach[a.id]); return '<div class=\"' + (on ? '' : 'off') + '\"><b>' + (on ? esc(a.name) : '？？？') + '<\/b>' + esc(on ? a.desc : '尚未解锁') + '<\/div>'; }).join('') + '<\/div><\/section>';\n}\n\n/* ---------------- 主界面 ---------------- */\nfunction main() {\n  var tabs = [['home', '总览'], ['players', '球员'], ['sched', '排程'], ['season', '赛季']];\n  var out = '<div class=\"app\">' + topbar() + '<nav class=\"tabs\" role=\"tablist\">' + tabs.map(function (t) { return '<button role=\"tab\" data-act=\"tab\" data-t=\"' + t[0] + '\" aria-selected=\"' + (U.tab === t[0]) + '\">' + t[1] + '<\/button>'; }).join('') + '<\/nav>';\n  out += U.tab === 'home' ? tabHome() : U.tab === 'players' ? tabPlayers() : U.tab === 'sched' ? tabSched() : tabSeason();\n  out += '<\/div><div class=\"bar-fixed\"><div class=\"in\"><button class=\"btn\" data-act=\"ff\" title=\"用助教安排自动推进，遇到事件或重要比赛停下\">快进<\/button><button class=\"btn pri\" data-act=\"go\">开始本周 ▶<\/button><\/div><\/div>';\n  if (U.ffNote) out += '';\n  return out;\n}\n\n/* ---------------- 周报 ---------------- */\nfunction matchCard(m) {\n  var f = m.f, r = m.res, me = esc(CFG.short), op = esc(CG.tname(f.opp));\n  var home = f.neutral ? null : f.h;\n  var left = home === false ? op : me, right = home === false ? me : op;\n  var sl = home === false ? r.ga : r.gf, sr = home === false ? r.gf : r.ga;\n  var sc = r.sc.map(function (x) { return esc(CG.pname(x.id)) + ' ' + CG.fmtMin(x.m) + '\\''; }).join('，');\n  var out = '<div class=\"mcard ' + r.out + '\"><div class=\"hd\"><span>' + CG.DAYN[m.d] + ' · ' + esc(f.cn + ' ' + f.rd) + '<\/span><span>' + (f.neutral ? '中立场' : f.h ? '主场' : '客场') + '<\/span><\/div>' +\n    '<div class=\"sc\"><div class=\"t me\">' + left + '<\/div><div class=\"s\">' + sl + ' – ' + sr + '<\/div><div class=\"t op\">' + right + '<\/div><\/div><div class=\"body\">';\n  if (sc) out += '<div>进球：' + sc + '<\/div>';\n  if (r.agg) out += '<div class=\"g\">两回合总比分 ' + r.agg[0] + '–' + r.agg[1] + (r.tieOut === 'W' ? '，晋级' : r.tieOut === 'L' ? '，出局' : '') + '<\/div>';\n  r.text.forEach(function (t) { out += '<div class=\"g\">' + esc(t) + '<\/div>'; });\n  return out + '<\/div><\/div>';\n}\nfunction reportView() {\n  var rep = U.report, out = '<div class=\"app\">' + topbar('第 ' + (rep.week + 1) + ' 周回顾', CG.dTxt(rep.date) + ' – ' + CG.dTxt(CG.addDays(rep.date, 6)));\n  if (U.ffNote) out += '<div class=\"tip\">' + esc(U.ffNote) + '<\/div>';\n  if (rep.matches.length) out += rep.matches.map(matchCard).join(''); else out += '<section class=\"panel\"><p class=\"hint\">本周没有比赛。<\/p><\/section>';\n  /* 数值变化 */\n  var d = [], pv = rep.before;\n  CG.ATTRS.forEach(function (a) { var dv = S.attrs[a.k] - pv.attrs[a.k]; if (Math.abs(dv) >= .1) d.push('<span class=\"pv ' + clsd(dv) + '\">' + a.n + ' ' + sg(dv) + '<\/span>'); });\n  var db = S.board - pv.board, df = S.fans - pv.fans;\n  if (Math.abs(db) >= .1) d.push('<span class=\"pv ' + clsd(db) + '\">董事会信任 ' + sg(db) + '<\/span>');\n  if (Math.abs(df) >= .1) d.push('<span class=\"pv ' + clsd(df) + '\">球迷热度 ' + sg(df) + '<\/span>');\n  d.push('<span class=\"pv ' + clsd(S.fatigue - pv.fat, true) + '\">疲劳 ' + sg(S.fatigue - pv.fat) + '<\/span>');\n  out += '<section class=\"panel\"><h2>本周变化<\/h2><div class=\"delta\">' + d.join('') + '<\/div><\/section>';\n  if (rep.news && rep.news.length) out += '<section class=\"panel\"><h2>消息<\/h2>' + rep.news.map(function (n) { return '<p class=\"hint\">' + esc(n) + '<\/p>'; }).join('') + '<\/section>';\n  out += '<details class=\"panel\"><summary>训练日志<\/summary>' + rep.days.map(function (d) {\n    if (!d.slots.length) return '<div class=\"daylog\"><b>' + d.name + '<\/b><span class=\"lg\">休息日<\/span><\/div>';\n    return '<div class=\"daylog\"><b>' + d.name + '<\/b><div>' + d.slots.map(function (s) { return '<div>' + esc(s.half + ' ' + s.txt) + (s.log && s.log.length ? ' <span class=\"lg\">· ' + esc(s.log.join('，')) + '<\/span>' : '') + '<\/div>'; }).join('') + '<\/div><\/div>';\n  }).join('') + '<\/details>';\n  out += '<\/div><div class=\"bar-fixed\"><div class=\"in\"><span><\/span><button class=\"btn pri\" data-act=\"next\">' + (S.ended ? '查看赛季结局' : S.pending ? '继续' : '进入下一周') + '<\/button><\/div><\/div>';\n  return out;\n}\n\n/* ---------------- 事件 / 结局 / 标题 ---------------- */\nfunction eventSheet() {\n  var pe = S.pending, out = '';\n  if (U.evResult != null) return '<h3>' + esc(U.evCat || '事件') + '<\/h3><p>' + esc(U.evResult) + '<\/p><button class=\"btn pri\" data-act=\"evok\">继续<\/button>';\n  out += '<span class=\"tag comp\" style=\"justify-self:start\">' + esc(pe.cat) + '<\/span><p>' + esc(pe.text) + '<\/p>';\n  pe.opts.forEach(function (o) { out += '<button class=\"opt\" data-act=\"evopt\" data-i=\"' + o.i + '\"><b>' + esc(o.t) + '<\/b>' + (o.tip ? '<small>' + esc(o.tip) + '<\/small>' : '') + '<\/button>'; });\n  return out;\n}\nfunction endView() {\n  var e = S.ending, tro = S.trophies;\n  var out = '<div class=\"app plain end\"><div class=\"hero\"><span class=\"sub\">' + esc(CFG.motto) + ' · 赛季结束<\/span><div class=\"grade\">' + esc(e.grade) + '<\/div>' + (U.endNew && U.endNew.isNew ? '<span class=\"tag comp\" style=\"justify-self:start\">新结局 · 已收入图鉴<\/span>' : '') + '<h2>' + esc(e.title) + '<\/h2><p>' + esc(e.body) + '<\/p><p>' + esc(e.styleText) + '<\/p>' + (e.extra ? '<p><b>' + esc(e.extra) + '<\/b><\/p>' : '') + '<\/div>';\n  out += '<section class=\"panel\"><h2>赛季总结<\/h2><div class=\"delta\"><span class=\"pv\">执教风格：' + esc(e.styleName) + '<\/span><span class=\"pv\">联赛第 ' + e.rank + '<\/span><span class=\"pv\">' + S.stats.w + '胜 ' + S.stats.d + '平 ' + S.stats.l + '负<\/span><span class=\"pv\">奖杯：' + (tro.length ? esc(tro.join('、')) : '无') + '<\/span><\/div><\/section>';\n  if (e.tails && e.tails.length) out += '<section class=\"panel\"><h2>这个赛季里的人<\/h2>' + e.tails.map(function (t) { return '<p class=\"hint\">' + esc(t) + '<\/p>'; }).join('') + '<\/section>';\n  if (U.newAch.length) out += '<section class=\"panel\"><h2>新解锁的梗<\/h2>' + U.newAch.map(function (id) { var a = CFG.achievements.filter(function (x) { ret et = { kind: 'event' }; U.evResult = null; U.evCat = S.pending.cat; } }\nfunction beginWeek(auto) {\n  var before = { attrs: JSON.parse(JSON.stringify(S.attrs)), board: S.board, fans: S.fans, fat: S.fatigue };\n  var plan = auto ? CG.autoPlan(S) : S.plan;\n  var rep = CG.playWeek(S, plan);\n  rep.before = before;\n  return rep;\n}\nfunction afterWeek(rep) {\n  U.report = rep;\n  if (S.ended) { U.endNew = recordEnding(); U.newAch = mergeAch(); }\n  save();\n  U.screen = 'report'; U.sheet = null; U.tab = 'home'; render(); window.scrollTo(0, 0);\n}\nfunction fastForward() {\n  var rep = null, merged = [], n = 0, startAttrs = null;\n  var before = { attrs: JSON.parse(JSON.stringify(S.attrs)), board: S.board, fans: S.fans, fat: S.fatigue };\n  while (n < 6) {\n    S.plan = CG.autoPlan(S);\n    rep = CG.playWeek(S, S.plan); n++;\n    rep.matches.forEach(function (m) { merged.push(m); });\n    if (S.ended || S.pending) break;\n    /* 下周有欧冠淘汰赛、德比或杯赛决赛就停下 */\n    var nx = CG.weekFixtures(S).filter(function (x) { return x.f.ko || CFG.rivals.indexOf(x.f.opp) >= 0; });\n    if (nx.length) break;\n    if (S.key.some(function (id) { return S.pl[id].mood < 38; })) break;\n  }\n  rep.matches = merged.slice(-6); rep.before = before;\n  U.ffNote = '快进了 ' + n + ' 周（助教安排），共 ' + merged.length + ' 场比赛' + (merged.length > 6 ? '，下面是最近 6 场。' : '。');\n  afterWeek(rep);\n}\n\nAPP.addEventListener('click', function (ev) {\n  var el = ev.target.closest('[data-act]'); if (!el) return;\n  var a = el.getAttribute('data-act');\n  if (a === 'mask') { if (ev.target === el && U.sheet && U.sheet.kind !== 'event') { U.sheet = null; U.talkMsg = null; render(); } return; }\n  if (el.hasAttribute('disabled')) return;\n  switch (a) {\n    case 'newgame': startNew(); break;\n    case 'continue': S = load(); if (!S) return startNew(); U.screen = S.ended ? 'end' : 'main'; U.tab = 'home'; U.ffNote = null; openEventIfAny(); render(); break;\n    case 'tab': U.tab = el.getAttribute('data-t'); render(); window.scr
