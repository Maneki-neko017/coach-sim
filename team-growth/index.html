ags: ['young', 'sensitive'], aff: 50, ego: 30, role: '中场 · 不会累的人', blurb: '跑动像不知疲倦，心里却总在问自己“够不够好”。一句不经意的话，他能想一晚上。',\n      talk: { criticize: { bad: ['{p}低下头：“教练，是我今天跑得不对吗？”声音很轻。'] }, heart: { good: ['{p}说起刚搬来曼彻斯特时，一个人在公寓里对着炉子发呆的晚上，笑了笑：“现在好多了。”'] } } },\n    { id: CH, tags: ['star', 'sensitive'], aff: 45, ego: 50, role: '前腰 · 魔术师', blurb: '脚下全是主意，天生不爱被框住。被信任时他无所不能，被拴住时，球也变得沉了。',\n      talk: { encourage: { good: ['{p}眼睛一亮：“教练你放心，今天我给你变个新的。”'] }, criticize: { bad: ['{p}耸耸肩：“如果我只会照着图纸踢，你也不会买我。”'] } } },\n    { id: BO, tags: ['young', 'pressure'], aff: 55, ego: 30, role: '后腰 · 十八岁新人', blurb: '才十八岁，被拿来和许多名字比较。他比谁都怕搞砸，也比谁都早到训练场。',\n      talk: { heart: { good: ['{p}说起刚到球队时，在走廊里迷了路，是恩佐领他回的更衣室：“我当时觉得，这里的人比想象中好。”'] }, focus: { good: ['{p}点头：“我会把脑子里多余的声音关掉。”'] } } },\n    { id: FO, tags: ['calm', 'pressure'], aff: 55, ego: 30, role: '前腰 · 曼彻斯特长大的孩子', blurb: '从青训一路走上来的本地孩子。话不多，什么都放在心里，总觉得自己还应该再多做一点。',\n      talk: { heart: { good: ['{p}聊起小时候在青训营的更衣室，墙上贴满了前辈们的照片。“那时候我只想有一天贴上去。”'] }, encourage: { good: ['{p}低头笑了一下：“教练，我会继续努力。”'] } } }\n  ],\n\n  /* 事件。week 指定则必在该周出现；force 条件满足必出；其余按权重随机。who: 球员ID 或 'random' */\n  events: [\n    { id: 'goal', week: 0, cat: '董事会', t: '赛季开始前，CEO 在办公室里问你：“今年的目标是什么？”窗外训练场上，球员们正在热身。', o: [\n      { t: '稳稳地进欧冠，这是底线', tip: '董事会更宽容，奖励较小', fx: { goal: 'safe', board: 3 }, r: '“很务实。”CEO 点点头，在文件上签了字。' },\n      { t: '夺回英超冠军', tip: '期望更高，成功的回报也更高', fx: { goal: 'push', fans: 3, morale: 2 }, r: '“我们等这一天很久了。”CEO 说。球迷论坛里一夜之间多了几千条评论。' },\n      { t: '三线都要拿，大耳朵杯也不放过', tip: '压力最大，容错最低', fx: { goal: 'dream', morale: 4, board: -4 }, r: '会议室里安静了五秒，然后所有人都笑了。你没笑——你在想上一次是怎么做到的。' }] },\n    { id: 'winter', win: [17, 21], cat: '圣诞赛程', t: '圣诞前后，英超的比赛像下雨一样往头上砸，球队只有几天能喘口气。助教建议利用这段空档做一次重点调整，你只能选一个。', o: [\n      { t: '把防守体系再磨一遍', fx: { def: 6, fatigue: 6 }, r: '高位防守的距离，现在每个人都能闭着眼站出来。' },\n      { t: '把进攻套路练熟', fx: { atk: 6, fatigue: 6 }, r: '肋部的三角传递和最后一传，终于对上了节奏。' },\n      { t: '体能储备，赛季下半程靠它', fx: { cond: 6, fatigue: 10 }, r: '最后一周的拉练让所有人都骂了你，但没人掉队。' },\n      { t: '什么都不练，全队休整、吃饭', fx: { unity: 6, morale: 6, fatigue: -18 }, r: '圣诞聚餐上，几个人为谁买单吵了起来，最后是门将抢到了账单。' }] },\n    { id: 'window', win: [22, 26], cat: '转会窗', t: '一月的转会窗口快关了，董事会问你要不要补强。预算有限，但他们愿意听。', o: [\n      { t: '“不需要，现有的人就够了。”', fx: { unity: 3, morale: 2, board: 1 }, r: '你说得很平静。更衣室里有人听见了，晚上多了几声笑。' },\n      { t: '“给我一个最缺位置的替补。”', fx: { funds: -16, atk: 2, def: 2, board: -1 }, r: '新的替补当天晚上到队，虽然只能站在板凳上，但教练组松了口气。' },\n      { t: '“把钱留着，夏天再说。”', fx: { funds: 16, board: 2 }, r: 'CEO 露出了难得的笑容。' }] },\n    { id: 'derby_eve', cat: '曼市德比', force: true, once: true, when: function (c) { return soon(c, 'MUN', 6) && c.S.week >= 2; }, t: '本周末是曼彻斯特德比。记者们在训练场外挤成一团，等你说点什么。更衣室里，球员们也在等。', o: [\n      { t: '“一场一场来。”', fx: { morale: 2 }, r: '一句最不像鸡血的话，更衣室里每个人都重复了一遍。' },\n      { t: '让本地长大的孩子讲讲德比', fx: { unity: 3, chem: 2, p: { mood: 4 } }, r: '福登站起来讲了五分钟，讲到他小时候在看台上的位置。结束时没有人说话，但也没有人看手机。' },\n      { t: '什么都不说，让他们自己想', fx: { morale: -1, atk: 2, def: 2 }, r: '训练场上，除了脚步声和喘气声，什么也没有。' }] },\n    { id: 'derby_win', cat: '曼市德比', w: 3, when: function (c) { return c.last && c.last.opp === 'MUN' && c.last.out === 'W' && c.last.cn === '英超'; }, t: '赢下德比之后，几个年轻球员在更衣室里放起了歌，老球员们围着球场边走边唱。', o: [\n      { t: '一起唱', fx: { morale: 4, fans: 3, unity: 3 }, r: '视频被球员发上社交媒体，评论区一半是庆祝，一半是对面球迷的沉默。' },\n      { t: '“明天训练，八点。”', fx: { board: 1, atk: 1, def: 1 }, r: '歌停了，但没人觉得扫兴。' }] },\n    { id: 'derby_loss', cat: '曼市德比', w: 3, when: function (c) { return c.last && c.last.opp === 'MUN' && c.last.out === 'L'; }, t: '输给红魔之后，记者翻出旧账，问你：这支球队是不是在大场面上缺了点什么？', o: [\n      { t: '“我只记得下一场。”', fx: { morale: 1, fans: 1 }, r: '同一句话，你在很多场合说过。' },\n      { t: '沉默地看了他一眼', fx: { fans: 3, morale: -1 }, r: '那条新闻最后没有发出来。' }] },\n    { id: 'title_rival', cat: '争冠', w: 2, when: function (c) { return c.rank <= 3 && (soon(c, 'ARS', 10) || soon(c, 'LIV', 10)) && c.S.week >= 5; }, t: '积分榜上的数字越来越紧。争冠对手的教练在发布会上说：“我们的目标很清楚，别人怎么想，是别人的事。”记者把这句话转给了你。', o: [\n      { t: '“我们也一样。”', fx: { morale: 2, fans: 1 }, r: '一句话，被剪成了短视频，点赞比他那条还多。' },\n      { t: '“我更想聊聊我的球队。”', fx: { board: 1, unity: 1 }, r: '你把话题拉回了球队。助教在桌子底下悄悄竖了个大拇指。' },\n      { t: '让记者去问球员', fx: { fans: 2, morale: -1 }, r: '恩佐被问到的时候说：“我们一周踢一场，剩下的时间在训练。”' }] },\n    { id: 'crisis', cat: '危机', force: true, cd: 8, when: function (c) { return c.lossStreak >= 3; }, t: '球队已经连续三场没赢。更衣室里有人开始互相指责，球迷论坛也出现了“马雷斯卡下课”的帖子。', o: [\n      { t: '开一次全队会，所有人都要说话', fx: { unity: 4, morale: 3, fatigue: 4 }, r: '会开了两个小时。有人拍桌子，有人沉默，最后所有人一起喊了口号。' },\n      { t: '给全队放一天假', fx: { morale: 4, fatigue: -10, board: -1 }, r: '董事会不太满意，但球员们回来的时候像换了一批人。' },\n      { t: '加练，罚站，让他们记住', fx: { def: 3, atk: 2, morale: -4, fatigue: 8, key: { mood: -3 } }, r: '训练场的灯亮到了十点。有人在回家的路上摔了手机。' }] },\n    { id: 'board_talk', cat: '董事会', force: true, once: true, when: function (c) { return c.S.board < 32 && c.S.week >= 8; }, t: 'CEO 把你叫到办公室，桌上放着一份文件。“我们需要谈谈这个赛季了。”', o: [\n      { t: '“给我三个星期。”', fx: { board: 5, morale: -2 }, r: 'CEO 看着你很久，点了点头。“三个星期。”' },\n      { t: '“你们挑的人，你们说了算。”', fx: { board: -3, fans: 2 }, r: '这句话传出去之后，球迷论坛转了三天。' },\n      { t: '拿出一份赛季回顾报告', fx: { board: 3, funds: -8 }, r: '报告翻了三页，CEO 的表情缓和了一点。' }] },\n    { id: 'unity_party', cat: '更衣室', w: 2, when: function (c) { return c.S.attrs.unity > 60; }, t: '团结指数很高。今天训练结束后，几个年轻球员自发在更衣室里搞了一场“聚餐大会”，他们问你来不来。', o: [\n      { t: '去，当然去', fx: { unity: 3, morale: 3, key: { mood: 2 } }, r: '你坐在角落吃了半个小时，没人提战术。' },\n      { t: '让他们自己玩，你在办公室看录像', fx: { atk: 1, def: 1 }, r: '你关了门，听着楼下的笑声，反而更专心。' }] },\n    { id: 'a_stand', cat: '俱乐部', w: 2, once: true, when: function (c) { return c.S.week >= 3; }, t: '新北看台正式以瓜迪奥拉的名字命名。揭幕仪式前，记者问你：站在他的看台下面执教，压力大不大？', o: [\n      { t: '“他留下的是标准，不是阴影。”', fx: { fans: 3, board: 2 }, r: '这句话第二天登上了曼彻斯特晚报头版。' },\n      { t: '“我更关心下一场比赛。”', fx: { morale: 1 }, r: '记者们有点失望，球员们觉得你很酷。' },\n      { t: '邀请他来看一次训练', fx: { morale: 2, board: -1 }, r: '他没来，但发了一条语音：“少画点箭头。”' }] },\n    { id: 'a_haaland', cat: '球员', who: HA, w: 2, t: '{p}在训练结束后找到你：“我需要更多传中。中路的球我等了半场都没等到。”', o: [\n      { t: '答应他，多打边路', fx: { atk: 1.5, p: { form: 1.5, mood: 2 } }, r: '第二天训练，边路传中练了四十分钟。{p}心满意足。' },\n      { t: '“你可以多回撤，帮我们出球。”', fx: { chem: 1.5, p: { ego: -3, mood: -1, aff: 1 } }, r: '{p}想了想，点头：“我试试。”' },\n      { t: '“传中是我们的事。你负责在门前等。”', fx: { p: { form: .5, aff: 1 } }, r: '{p}什么也没说，但下一次训练站位更早了半步。' }] },\n    { id: 'a_haa_ego', cat: '球员', who: HA, force: true, cd: 10, when: function (c) { return c.S.pl[HA].ego > 72; }, t: '{p}在赛后采访里被问到球队，只说了一句：“我做好我的部分。”队友们开始私下抱怨他“只想着自己进球”。', o: [\n      { t: '单独谈一次，压一压他', fx: { p: { ego: -14, mood: -3, form: .5 }, unity: 2 }, r: '{p}被说得有点不服气，但第二天训练里他多回防了三次。' },\n      { t: '公开表扬他，同时点名要求团队', fx: { p: { ego: -6, mood: 3 }, unity: 1, morale: 1 }, r: '一句话说得所有人都听明白了。' },\n      { t: '装作没看见', fx: { p: { ego: 4 }, unity: -4, key: { mood: -1 } }, r: '更衣室里的空气有点微妙。' }] },\n    { id: 'a_enzo', cat: '球员', who: EN, w: 2, t: '训练里，{p}一边指挥几个年轻人的站位，一边用西语、英语和手势来回切换，周围的人听得一头雾水，又都在照做。', o: [\n      { t: '让他当训练里的“第二个教练”', fx: { chem: 2, unity: 1, p: { ego: 3, aff: 3 } }, r: '{p}把战术板拿过去画了一张图。画完后，所有人都说“看懂了”。' },\n      { t: '提醒他别越界', fx: { p: { ego: -3, mood: -2 }, unity: 1 }, r: '{p}笑着举起手：“教练你说了算。”' }] },\n    { id: 'a_anderson', cat: '球员', who: AN, w: 2, t: '训练结束了，{p}还在场上一个人跑冲刺。你喊他回来，他说：“教练，我再跑两组就好。”', o: [\n      { t: '陪他跑，顺便聊聊', fx: { p: { aff: 5, mood: 3, form: .5 }, fatigue: 2 }, r: '你们跑了一圈又一圈，聊起了他想成为什么样的中场。' },\n      { t: '“回去休息。体能是留给比赛的。”', fx: { fatigue: -2, p: { mood: -1, aff: 1 } }, r: '{p}不太情愿地点点头，但第二天看起来更轻快。' }] },\n    { id: 'a_cherki', cat: '球员', who: CH, w: 2, t: '内部对抗赛里，{p}用一个脚后跟传球打穿了整条防线，场边的人先是愣住，然后爆发出一阵喝彩。助教的脸色有点复杂。', o: [\n      { t: '“漂亮。比赛里也可以这么踢。”', fx: { atk: 1.5, p: { form: 1.5, mood: 3, ego: 3 } }, r: '{p}冲着场边做了个鞠躬的动作。' },\n      { t: '“漂亮。但要看时机。”', fx: { p: { form: .5, aff: 1 }, chem: 1 }, r: '{p}点点头：“知道了，不在关键时刻玩。”' },\n      { t: '“先把基本功做好。”', fx: { def: 1, p: { mood: -3, aff: -1 } }, r: '{p}耸耸肩，转身去拿水。' }] },\n    { id: 'a_bouaddi', cat: '球员', who: BO, w: 2, t: '{p}早上七点就到了训练场，你路过时发现他在更衣室门口对着镜子，一遍一遍背英语战术词汇。', o: [\n      { t: '请他喝杯咖啡，慢慢聊', fx: { p: { aff: 5, mood: 3 } }, r: '“教练，我怕自己听不懂。”{p}说。“没关系，”你说，“听不懂的时候，看恩佐。”' },\n      { t: '安排一位翻译全程跟着他', fx: { funds: -4, p: { mood: 2, form: .5 } }, r: '翻译坐在战术板旁，{p}第一次在战术课上点了头。' },\n      { t: '“你需要自己扛一段时间。”', fx: { p: { ego: -2, mood: -2, form: .3 } }, r: '{p}沉默地点了点头，接着去背下一页词汇。' }] },\n    { id: 'a_foden', cat: '球员', who: FO, w: 2, t: '{p}在训练里踢得很安静，没有一次多余的触球，但每一个传球都恰到好处。训练结束后，几个助教私下说：“他这周是球队最好的人。”', o: [\n      { t: '当着全队的面表扬他', fx: { unity: 1, p: { mood: 4, aff: 3, ego: 3 } }, r: '{p}不好意思地挠了挠头：“教练，别这样。”' },\n      { t: '私下告诉他', fx: { p: { mood: 3, aff: 4, form: .5 } }, r: '{p}听完点点头，说了句“谢谢”，眼睛有点亮。' }] },\n    { id: 'a_replay', cat: '教练', w: 1, once: true, when: function (c) { return c.S.week >= 14; }, t: '深夜，你在办公室翻看几年前的旧录像，看到了那个三冠王夜晚的庆典。你当时还坐在助教席上。门口传来敲门声，是恩佐。', o: [\n      { t: '请他进来，一起看完', fx: { unity: 3, morale: 2, p: { aff: 4 } }, r: '你们谁也没说话。结束的时候，他说：“教练，我们还可以再来一次。”' },\n      { t: '合上电脑，说“早点回去睡”', fx: { morale: 1 }, r: '你关了灯，走廊里的光比平时亮。' }] },\n    { id: 'a_sprint', cat: '教练', w: 2, when: function (c) { return c.last && c.last.out === 'W'; }, t: '终场哨响，你冲出技术区，沿着边线一路跑到了看台下面，第四官员追着你跑了二十米。', o: [\n      { t: '“我只是想和球迷待在一起。”', fx: { fans: 3, morale: 2 }, r: '这段视频成了本周最受欢迎的短视频。' },\n      { t: '向第四官员道歉', fx: { board: 1, fans: 1 }, r: '他接受了道歉，但表情仍然很复杂。' }] },\n    { id: 'press_trap', cat: '媒体', w: 2, t: '一个记者问你：“很多人说，你只是在延续上一任的足球，你怎么看？”会场安静了下来。', o: [\n      { t: '“我在做我自己的版本。”', fx: { fans: 2, board: 1 }, r: '这句话被印在了第二天的小报头条上，旁边配的是你站在场边的照片。' },\n      { t: '笑笑，什么都不说', fx: { board: 1, morale: 1 }, r: '记者追问了三遍，你只是点了点头。' },\n      { t: '“你来训练场看看吧。”', fx: { fans: 1, unity: 1 }, r: '第二天，那个记者真的来了，站在场边被淋了一身水。' }] },\n    { id: 'young_star', cat: '球员', who: BO, w: 2, when: function (c) { return c.S.pl[BO].form > .6; }, t: '{p}最近状态火热，欧洲的几家豪门开始公开表达兴趣，经纪人也联系了俱乐部。', o: [\n      { t: '把他叫来，直接说清楚规划', fx: { p: { aff: 5, mood: 3, ego: 2 }, board: 1 }, r: '{p}听完点头：“教练，我愿意留在这里。”' },\n      { t: '什么都不说，让他自己做决定', fx: { p: { mood: -2, aff: -3, ego: 4 }, unity: -1 }, r: '他踢了几场球，状态忽高忽低。' }] },\n    { id: 'injury_crisis', cat: '医疗', w: 2, when: function (c) { return c.S.fatigue > 65; }, t: '队医敲门，神色严肃：“教练，最近的伤病报告看起来不太对，大家的身体在报警。”', o: [\n      { t: '这周全队轻练，优先恢复', fx: { fatigue: -14, morale: 1, board: -1 }, r: '队医松了一口气，小声说了句“谢谢”。' },\n      { t: '硬撑过去，赛季不等人', fx: { fatigue: 4, def: 1, unity: -1 }, r: '你拍了拍他的肩：“再坚持两周。”' }] },\n    { id: 'captain_speech', cat: '更衣室', who: EN, w: 1, when: function (c) { return c.S.attrs.morale < 45; }, t: '士气不高。赛后更衣室里，{p}突然站起来，对全队说了几句话。', o: [\n      { t: '让他说完，你什么也不加', fx: { morale: 6, unity: 3, p: { aff: 3 } }, r: '没有人记得他具体说了什么，但所有人都记得那天晚上的灯光。' },\n      { t: '补充一句：“我们还没输。”', fx: { morale: 4, unity: 2 }, r: '这句话在更衣室里回响了一整晚。' }] },\n    { id: 'fan_banner', cat: '球迷', w: 2, t: '赛前，南看台升起一条巨大的横幅，上面画着一支小小的蓝色帆船，写着：“无论顺风还是逆风，我们都在这里。”', o: [\n      { t: '赛后走到看台，向他们鞠躬', fx: { fans: 4, morale: 2 }, r: '球场的灯一盏盏熄灭，但看台上没有人愿意离开。' },\n      { t: '低头走进球员通道', fx: { fans: 1 }, r: '你什么也没说，但手心是湿的。' }] },\n    { id: 'assistant_idea', cat: '教练组', w: 2, t: '助教拿着笔记本找你：“教练，我有一个新训练想法，但可能需要多花一点时间。”', o: [\n      { t: '听听他的想法，试一次', fx: { atk: 2, chem: 2, fatigue: 3 }, r: '训练课结束，球员们说“这个很新鲜”。助教脸上写满了得意。' },\n      { t: '让他先和队医对一遍', fx: { chem: 1, unity: 1 }, r: '助教有点失望，但第二天他拿来了更完整的版本。' }] },\n    { id: 'dressing_spat', cat: '更衣室', who: 'random', w: 2, when: function (c) { return c.S.attrs.unity < 52 || c.lossStreak >= 2; }, t: '训练中，{p}和一名队友因为一次抢断起了冲突，两个人被队友拉开。更衣室里的空气像是凝固了。', o: [\n      { t: '把两人叫到办公室，当面说开', fx: { unity: 3, fatigue: 2, p: { aff: 2 } }, r: '十分钟后，两个人一起出来，谁也不看谁，但一起去吃了饭。' },\n      { t: '各打五十大板，罚跑', fx: { unity: -1, def: 1, fatigue: 6 }, r: '队友们安静地看着他们跑。从那天起，没人再提这件事。' },\n      { t: '当作没发生', fx: { unity: -4, morale: -2 }, r: '气氛一直没有真正缓和。' }] },\n    { id: 'rain', cat: '日常', w: 1, t: '曼彻斯特下了一周的雨，训练场积水能没过脚踝。助教问你要不要把课改到室内。', o: [\n      { t: '照常训练，下雨才像曼彻斯特', fx: { def: 2, unity: 2, fatigue: 4, morale: 1 }, r: '所有人都回家感冒了，但没有一个人缺席第二天的训练。' },\n      { t: '改到室内做体能和录像', fx: { cond: 1.5, atk: 1, fatigue: -2 }, r: '这周很安静。' }] },\n    { id: 'intl_break', cat: '国家队', who: 'random', w: 1, when: function (c) { return [3, 6, 7, 12, 32].indexOf(c.S.week) >= 0; }, t: '国际比赛日，{p}代表国家队踢了全场，回来时脸上写着“没睡好”。', o: [\n      { t: '让他休息一天', fx: { p: { fit: 8, mood: 2 } }, r: '{p}睡了一整天，醒来先问有没有吃的。' },\n      { t: '“明天正常训练。”', fx: { p: { form: 1 }, fatigue: 3 }, r: '{p}什么也没说，第二天依旧很拼。' }] },\n    { id: 'benched_player', cat: '球员', who: 'random', w: 2, when: function (c) { return c.S.pl && c.S.key.some(function (id) { return c.S.pl[id].mood < 42; }); }, t: '{p}最近情绪低落，训练也不太积极。队友们私下议论，你看在眼里。', o: [\n      { t: '约他单独聊一聊', fx: { p: { mood: 8, aff: 4 } }, r: '{p}说：“教练，我只是想知道自己在你的计划里。”' },\n      { t: '让他自己消化', fx: { p: { mood: 2, aff: -2 } }, r: '几天后他自己好起来了，但看你的眼神变了。' }] },\n    { id: 'owner_visit', cat: '董事会', w: 1, once: true, when: function (c) { return c.S.board > 50 && c.S.week >= 10; }, t: '俱乐部主席来看了一次训练，站在场边一言不发。结束后，他走过来拍了拍你的肩。', o: [\n      { t: '请他到办公室谈', fx: { board: 3, funds: 8 }, r: '他在你的办公室里坐了二十分钟，走的时候留下一句“继续”。' },\n      { t: '“谢谢，下周我们还有比赛。”', fx: { board: 1, morale: 1 }, r: '他笑了笑，转身走了。' }] },\n    { id: 'night_walk', cat: '教练', w: 1, when: function (c) { return c.S.week >= 5; }, t: '深夜你在空无一人的伊蒂哈德球场走了一圈。保安认出了你，什么也没说，只是把灯又多开了几盏。', o: [\n      { t: '在草皮上坐一会儿', fx: { morale: 1, fatigue: -3 }, r: '你坐了二十分钟，什么也没想。第二天，你感觉自己年轻了一点。' },\n      { t: '回办公室继续看录像', fx: { atk: 1, def: 1, fatigue: 2 }, r: '凌晨三点你关了电脑，在笔记本上写了一页字。' }] },\n    /* ---- 以下是随机事件：每周按概率抽取，14 周内不重复；带“结果不确定”的选项会掷骰子 ---- */\n    { id: 'sponsor', cat: '赞助商', w: 2, t: '一家新赞助商想让你亲自出镜拍一条广告，开价不低，时间要占掉半天训练。', o: [\n      { t: '拍，钱是真的', tip: '收入 +，但会累', roll: { p: .7, ok: { fx: { funds: 22, fans: 1, fatigue: 3 }, r: '拍摄很顺利。你全程一个表情，导演说这正好是广告需要的。' }, fail: { fx: { funds: 10, fans: -2, fatigue: 5 }, r: '你把台词说成了“控球不是目的”，广告被剪了三遍才勉强能用。' } } },\n      { t: '推掉，训练要紧', fx: { atk: 1, def: 1 }, r: '你让助教回了一封礼貌的邮件。赞助商说下次再约。' }] },\n    { id: 'youth_call', cat: '青训', w: 2, t: '青年队一名 17 岁的中场球员连续几场表现抢眼，青训总监来问：“能不能让他跟一线队训练几天？”', o: [\n      { t: '让他来，看看成色', tip: '有概率给球队带来活力', roll: { p: .6, ok: { fx: { morale: 3, chem: 2, fatigue: -3, board: 1 }, r: '小伙子跑得比谁都欢，老队员们都说“像看到了十年前的自己”。' }, fail: { fx: { morale: -1, unity: -1 }, r: '他在对抗里被几位老队员撞得很惨，当天晚上就回了青年队。' } } },\n      { t: '再等等，别揠苗助长', fx: { board: 1, unity: 1 }, r: '青训总监点点头：“您总是这么稳。”' }] },\n    { id: 'agent_call', cat: '球员', who: 'random', w: 2, t: '{p}的经纪人在媒体上放话，说“有几家俱乐部很感兴趣”。球员本人对此没有表态。', o: [\n      { t: '把球员叫来，问他怎么想', fx: { p: { aff: 4, mood: 2 }, board: -1 }, r: '{p}说：“教练，我只想踢球。”你让他早点回去休息。' },\n      { t: '直接对媒体说“他不卖”', fx: { fans: 3, board: 1, p: { ego: 5 } }, r: '球迷论坛一片叫好，{p}的脸上有点不好意思。' },\n      { t: '装作没看到', fx: { p: { mood: -2, aff: -1 } }, r: '谣言又飘了几天，然后被另一条新闻盖了过去。' }] },\n    { id: 'ref_row', cat: '媒体', w: 2, when: function (c) { return c.last && c.last.out === 'L'; }, t: '输球之后，有记者问你对 VAR 判罚的看法。你的助教在桌子底下悄悄递给你一张纸条：“别说话。”', o: [\n      { t: '照着纸条，什么都不说', fx: { board: 1, morale: 1 }, r: '记者追问两遍，你都只点头。这条新闻没有发酵。' },\n      { t: '“我们没有输给裁判。”', fx: { fans: 2, board: 1, morale: 1 }, r: '这句话在球迷论坛里被转了几千次。' },\n      { t: '“有些判罚，我看不懂。”', fx: { fans: 4, board: -3, morale: 2 }, r: '足总的邮件第二天就到了。球迷却很满意。' }] },\n    { id: 'rival_trash', cat: '对手', w: 1, when: function (c) { return soon(c, 'ARS', 14) || soon(c, 'LIV', 14) || soon(c, 'MUN', 14); }, t: '对手教练在发布会上暗示：“有些球队只会控球，不会进球。”记者把这句话原封不动地转给了你。', o: [\n      { t: '“他说得对，我们确实喜欢球。”', fx: { fans: 3, morale: 2, atk: 1 }, r: '这句话被印在了第二天的小报头条上，更衣室里传阅了好几遍。' },\n      { t: '“我不评论别人的足球。”', fx: { board: 1 }, r: '你平静地结束了采访。晚上，助教说你太克制了。' }] },\n    { id: 'charity', cat: '俱乐部', w: 1, t: '俱乐部邀请球队去儿童医院做一次探访。半天时间，没有训练，也没有摄像机。', o: [\n      { t: '全队一起去', fx: { unity: 3, morale: 3, fans: 3, fatigue: -4 }, r: '回程的大巴里很安静。没人拿手机出来拍，只是都在看窗外。' },\n      { t: '派几个代表，其他人训练', fx: { fans: 1, atk: 1, def: 1 }, r: '代表们回来说孩子们问了很多关于“你们教练为什么总是不笑”的问题。' }] },\n    { id: 'late_arrival', cat: '球员', who: 'random', w: 2, t: '训练开始五分钟了，{p}还没有出现。队友们互相看了看，没有人说话。', o: [\n      { t: '等他，不扣分', fx: { p: { aff: 3, mood: 2, ego: 4 }, unity: -1 }, r: '{p}满头大汗地跑进来，道歉的话说了三遍。' },\n      { t: '罚他加练，规矩就是规矩', fx: { p: { ego: -6, mood: -3, aff: -2 }, unity: 2 }, r: '{p}被罚了两圈，那天没人再迟到。' },\n      { t: '把他叫到办公室，问出了什么事', roll: { p: .55, ok: { fx: { p: { aff: 6, mood: 4 }, unity: 1 }, r: '{p}家里有点事。你让他先回去处理，他走时的眼神变了。' }, fail: { fx: { p: { aff: -2, mood: -3 }, unity: -1 }, r: '{p}什么也没说。你们沉默了很久。' } } }] },\n    { id: 'legend_visit', cat: '俱乐部', w: 1, once: true, when: function (c) { return c.S.week >= 6; }, t: '一位球队传奇来训练场看望大家，他在场边看了整整一场对抗赛，什么都没说，最后只是笑了笑。', o: [\n      { t: '请他给大家讲几句', fx: { morale: 4, unity: 3, key: { mood: 2 } }, r: '他讲了半个小时，讲到最后一句话时，全队都站了起来。' },\n      { t: '请他单独指点一名球员', fx: { p: { form: 1, aff: 3 } }, r: '你们在场边聊了很久。' }] },\n    { id: 'tactics_leak', cat: '媒体', w: 1, when: function (c) { return c.S.attrs.def > 55; }, t: '训练场外有人拍到了你们的战术演练，视频在网上流传。助教紧张地跑来问：“教练，要不要追查？”', o: [\n      { t: '追查，修个围墙', tip: '花钱，但防止泄露', fx: { funds: -10, board: 1 }, r: '一周后训练场周围多了三米高的围板。有球员说：“像是在拍电影。”' },\n      { t: '不管，他们看得懂吗？', fx: { fans: 1, def: 1 }, r: '你对着镜头的方向挥了挥手。视频后来被删了。' }] },\n    { id: 'diet', cat: '医疗', w: 1, t: '营养师提交报告：球员们最近的饮食越来越随意，建议统一管理，但需要球员们配合。', o: [\n      { t: '全队统一食谱', fx: { cond: 2, unity: -1, morale: -1, fatigue: -4 }, r: '食堂里多了一堆蒸菜，几个球员偷偷点了外卖。' },\n      { t: '让营养师给每人单独方案', fx: { funds: -8, cond: 1.5, morale: 1, fatigue: -3 }, r: '花了一些钱，但没有人抱怨。' },\n      { t: '不管，成年人自己负责', fx: { morale: 1, fatigue: 3 }, r: '周三的更衣室里飘出了烧烤味。' }] },\n    { id: 'bus_break', cat: '日常', w: 1, t: '客场比赛归程中，球队大巴在高速上抛锚。全队站在路边等了两个小时。', o: [\n      { t: '带着大家在路边玩球', fx: { unity: 4, morale: 2, fatigue: 2 }, r: '没人知道谁先开始的，总之一群职业球员在高速路边踢起了五人制。' },\n      { t: '让所有人在车里休息', fx: { fatigue: -3 }, r: '你把外套披在最年轻的球员身上，自己站在车外。' }] },\n    { id: 'prank', cat: '更衣室', who: 'random', w: 2, t: '{p}把一只橡皮鸭放进了助教的战术包里。助教打开包的时候，更衣室里安静了三秒，然后爆发出一阵大笑。', o: [\n      { t: '假装没看见，笑着走出去', fx: { unity: 3, morale: 2, p: { aff: 2 } }, r: '你在走廊里笑了一会儿才回到办公室。' },\n      { t: '“明天训练，每人加一圈。”', fx: { unity: 1, def: 1, fatigue: 3 }, r: '没人抱怨。第二天，那只鸭子被摆在了更衣室的架子上。' }] },\n    { id: 'language', cat: '更衣室', w: 1, t: '一位新来的小将还不太会说英语，在训练里几次因为沟通不畅造成失误，有点沮丧。', o: [\n      { t: '安排老队员带他', fx: { unity: 3, chem: 2, p: { mood: 0 } }, r: '恩佐每天带他吃午饭，两周后他已经会用英语骂裁判了。' },\n      { t: '请语言老师，每天课后上课', fx: { funds: -6, chem: 2, morale: 1 }, r: '语言老师在训练场边的小黑板上写满了单词。' }] },\n    { id: 'doc_warn', cat: '医疗', w: 2, when: function (c) { return c.S.fatigue > 50; }, t: '队医拿着一份报告来找你：“教练，有三个人的肌肉负荷已经到临界值。”', o: [\n      { t: '听队医的，立刻减量', fx: { fatigue: -10, atk: -.5 }, r: '你把周三的重练改成了泳池恢复。' },\n      { t: '再坚持一场，之后补', tip: '有风险', roll: { p: .5, ok: { fx: { fatigue: 2, def: 1 }, r: '你赌对了。队医看着你，脸上没有表情。' }, fail: { fx: { fatigue: 5, p: { inj: 3 } }, r: '有人在训练里拉伤了，队医什么都没说，只是把报告又递了一次。' } } }] },\n    { id: 'enzo_bday', cat: '球员', who: EN, w: 1, t: '今天是{p}的生日。更衣室里有人偷偷订了蛋糕，但他一直装作没发现。', o: [\n      { t: '带头唱生日歌', fx: { morale: 3, unity: 3, p: { aff: 4, mood: 4 } }, r: '你唱得很难听，但没人敢笑。' },\n      { t: '“训练结束后再说。”', fx: { atk: 1, p: { aff: 1 } }, r: '训练一结束，蛋糕就被端了出来，所有人早已站好位置。' }] },\n    { id: 'gk_coach', cat: '教练组', w: 1, t: '门将教练来找你：“教练，我想试试给他们加一套新的出击训练。”', o: [\n      { t: '同意，试一个月', fx: { def: 2, fatigue: 2 }, r: '门前的出击更果断了。一个月后，对手的传中少了。' },\n      { t: '“现在这套就够了。”', fx: { board: 1 }, r: '门将教练点点头，带着笔记本回去了。' }] },\n    { id: 'fan_letter', cat: '球迷', w: 1, t: '一位十岁的球迷写来一封信，说他想当球员，但他个子太小。信封里夹着一张他自己画的你。', o: [\n      { t: '回信，并寄去一件训练服', fx: { fans: 2, morale: 1 }, r: '一个月后，他寄回了一张照片：训练服被他穿得过长，袖子卷了三圈。' },\n      { t: '贴在办公室墙上', fx: { morale: 1 }, r: '你每天进门都会看到那幅画。' }] },\n    { id: 'cold_snap', cat: '日常', w: 1, t: '曼彻斯特突然降温，训练场的草皮结了薄霜，球员们裹着外套在场边活动。', o: [\n      { t: '改成室内力量训练', fx: { cond: 2, fatigue: 2 }, r: '体能教练笑得很开心：“终于可以练核心了。”' },\n      { t: '照常训练，穿厚点', fx: { unity: 2, morale: 1, fatigue: 3 }, r: '你看着自己呼出的白气，想起了第一次站在这里的那个早晨。' }] },\n    { id: 'old_boot', cat: '教练', w: 1, once: true, when: function (c) { return c.S.week >= 12; }, t: '你在办公室的抽屉里找到了一双旧球鞋，是你自己踢球时穿的。鞋底已经磨得很薄。', o: [\n      { t: '带到更衣室，放在显眼的地方', fx: { morale: 3, unity: 2 }, r: '鞋被摆在了更衣室的入口。球员们进门都会多看它一眼。' },\n      { t: '放回抽屉', fx: { morale: 1 }, r: '你关上抽屉，笑了笑。' }] },\n    { id: 'surprise_test', cat: '教练组', w: 1, t: '体能教练提出一个想法：搞一次突击体测，让球员们“知道自己真实的状态”。', o: [\n      { t: '搞，当场公布成绩', roll: { p: .6, ok: { fx: { cond: 3, morale: 1, unity: 1 }, r: '全队咬着牙跑完。有人第一次发现自己比队友强，有人第一次发现不是。' }, fail: { fx: { cond: 1, morale: -3, unity: -2 }, r: '结果公布后，更衣室里传出了几声叹息。' } } },\n      { t: '不公布，只给个人反馈', fx: { cond: 1.5, morale: 1 }, r: '体能教练一个一个把球员叫到办公室。' }] },\n    { id: 'wembley_week', cat: '决赛周', w: 4, when: function (c) { return c.next && c.next.final && c.next.venue === '温布利球场' && soon(c, c.next.opp, 6); }, t: '温布利决赛就在这周末。更衣室里，有人想早点过去适应场地，有人想维持日常节奏，还有人悄悄问你：“教练，决赛前一晚我们能不能看一场电影？”', o: [\n      { t: '提前一天去，熟悉球场', fx: { morale: 3, fatigue: 2, atk: 1 }, r: '空荡荡的温布利比想象中更大。恩佐绕着中圈走了三圈，说：“好，我记住了。”' },\n      { t: '维持日常节奏，照常训练', fx: { def: 1.5, atk: 1.5, unity: 1 }, r: '你什么也没改。就像去年，也像更久以前的每一个周三。' },\n      { t: '决赛前一晚，全队看电影', fx: { unity: 4, morale: 4, fatigue: -4 }, r: '放的是一部没人看过的老电影。没有人说话，也没有人睡着。' }] },\n    { id: 'pep_voice', cat: '教练', w: 1, once: true, when: function (c) { return c.S.week >= 9 && c.rank <= 4; }, t: '你的手机亮了一下，是一条没有署名的语音。你点开，只有一句话：“别告诉别人，其实我也不总是知道怎么踢。”', o: [\n      { t: '回复一个“谢谢”', fx: { morale: 2, board: 1 }, r: '你把手机放回口袋，感觉肩膀轻了一点。' },\n      { t: '拿给助教们听', fx: { unity: 2, morale: 2 }, r: '助教们听完，没有一个人笑，但所有人都点了头。' }] },\n    { id: 'ucl_draw', cat: '欧冠', w: 1, once: true, when: function (c) { return c.S.week >= 3 && c.S.week <= 8; }, t: '欧冠联赛阶段的抽签结果出来了。球员们挤在休息室里看直播，谁抽到谁、谁远谁近，每一个名字都有人发出一声惊叹。', o: [\n      { t: '“每一场，都一样。”', fx: { morale: 1, unity: 1 }, r: '你关掉了电视。所有人安静了一秒，然后继续吃饭。' },\n      { t: '把对阵表贴在更衣室墙上', fx: { morale: 3, atk: 1, fatigue: 1 }, r: '第二天，有人在每个对手名字旁边画了一个小小的笑脸，有人画了一个哭脸。' }] },\n    { id: 'cherki_haaland', cat: '更衣室', w: 1, when: function (c) { return c.S.pl[CH].mood > 55; }, t: '训练后，谢尔基和哈兰德在场边互相比赛颠球，输的人请吃午饭。围观的人越来越多，最后连门将教练都停下了手里的活。', o: [\n      { t: '加入比赛，当裁判', fx: { unity: 3, morale: 3, chem: 1.5 }, r: '你判定平局，两个人一起请了客。账单是最后才发现的。' },\n      { t: '假装没看见，转身去办公室', fx: { unity: 1, morale: 1, fatigue: -1 }, r: '你关上门，听见走廊里传来一阵大笑。' }] },\n\n    /* ================= 专属线：好感触发的个人剧情 =================\n       高好感线 3 段（好感达标 + 间隔数周才会出现）；低好感线 2 段（好感太低才会出现，有补救机会）。\n       flag 记录发生的周数，下一段靠它排先后。 */\n\n    /* ---- 哈兰德 · 两个球之间 ---- */\n    { id: 'ha_h1', cat: '专属线 · 哈兰德', who: HA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, HA) >= 62 && !done(c, 'ha_l1'); }, t: '训练结束，{p}拿着一张打印出来的数据单走到你面前：“这场比赛我只摸了二十四次球。教练，你觉得我应该多参与，还是继续等？”', o: [\n      { t: '“你的任务在门前，其余的事交给我们。”', fx: { p: { aff: 6, mood: 3, form: .6 }, flag: 'ha1' }, r: '{p}点点头，把数据单折好塞进了口袋：“那我就等着。”' },\n      { t: '“多回撤一点，你的传球比你想的好。”', fx: { atk: 1, chem: 1.5, p: { aff: 5, ego: -3, mood: 1 }, flag: 'ha1' }, r: '{p}想了想：“好，我试试。但别指望我适应得太快。”' },\n      { t: '把他的跑位剪成录像，一起看', fx: { p: { aff: 7, mood: 4, form: .5 }, flag: 'ha1' }, r: '你们看了四十分钟。{p}看完说：“下一次，我会再往前提前半步。”' }] },\n    { id: 'ha_h2', cat: '专属线 · 哈兰德', who: HA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'ha1') >= 5 && aff(c, HA) >= 68 && (!done(c, 'ha_l1') || done(c, 'ha_fix')); }, t: '连续三场没进球之后，{p}一个人留在更衣室里，对着空了的柜子坐了很久。你推门进去，他没有抬头：“教练，他们是不是开始说我‘不行了’？”', o: [\n      { t: '“他们说的是你的进球数，不是你。”', fx: { p: { aff: 7, mood: 6 }, flag: 'ha2' }, r: '{p}抬起头，嘴角动了动：“这句话我记住了。”' },\n      { t: '“先别想进球，把今天练的东西做对。”', fx: { p: { aff: 5, mood: 3, form: 1.2, ego: -2 }, flag: 'ha2' }, r: '第二天训练，{p}练了两个小时的无球跑位，一个球都没射。' },\n      { t: '递给他一瓶水，什么也没说', fx: { p: { aff: 6, mood: 5 }, flag: 'ha2' }, r: '{p}拧开瓶盖喝了一口：“谢谢。有些话，不说比说更对。”' }] },\n    { id: 'ha_h3', cat: '专属线 · 哈兰德', who: HA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'ha2') >= 6 && aff(c, HA) >= 72 && (!done(c, 'ha_l1') || done(c, 'ha_fix')); }, t: '赛季的最后阶段，{p}在你办公室门口放下一个手写的小本子，里面全是他对每一个对手门将的观察：习惯、弱点、站位。“我想让整个球队都能用上这个，”他说，“不只是我自己。”', o: [\n      { t: '“明天的会，你来讲。”', fx: { atk: 3, chem: 2, p: { aff: 5, mood: 7, form: 1.2, ovr: 1, ego: -3 }, flag: 'ha3' }, r: '{p}站在战术板前讲了十分钟。他讲完时，全队用力鼓了掌。' },\n      { t: '请他和中场球员一起整理成训练内容', fx: { chem: 2.5, unity: 2, p: { aff: 5, mood: 5, form: 1, ovr: .5 }, flag: 'ha3' }, r: '一周之后，边路传中的落点和他的跑位，几乎完全对上了。' },\n      { t: '把本子还给他：“留着，你自己最有用。”', fx: { p: { aff: 3, mood: 4, form: 1.5, ovr: .5, ego: 2 }, flag: 'ha3' }, r: '{p}合上本子，收进背包里：“好。那我就自己用。”' }] },\n    { id: 'ha_l1', cat: '专属线 · 哈兰德', who: HA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, HA) <= 30 && !done(c, 'ha2'); }, t: '{p}最近训练里几乎不开口，传球也越来越少。他只做自己的跑位，做完就走。助教说：“他私下说，在这里他像是一个只会射门的工具。”', o: [\n      { t: '约他聊聊，别谈战术', roll: { p: .55, ok: { fx: { p: { aff: 10, mood: 6 }, flag: ['ha_l1', 'ha_fix'] }, r: '你们聊的是挪威的冬天和家乡的球场。{p}离开时说：“下次再聊。”' }, fail: { fx: { p: { aff: 2, mood: -2 }, flag: 'ha_l1' }, r: '{p}礼貌地回答每一个问题，但你知道，他没有说真话。' } } },\n      { t: '在会上公开给他的数据，要求他多参与', fx: { p: { aff: -5, mood: -5, ego: -3 }, unity: 2, flag: 'ha_l1' }, r: '{p}没有反驳，只是看着那张幻灯片，看了很久。' },\n      { t: '让助教去聊', fx: { p: { aff: 1, mood: 1 }, flag: 'ha_l1' }, r: '{p}知道是谁派来的。他礼貌地说了谢谢。' }] },\n    { id: 'ha_l2', cat: '专属线 · 哈兰德', who: HA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'ha_l1') >= 4 && aff(c, HA) <= 35 && !done(c, 'ha_fix'); }, t: '{p}的经纪人联系了俱乐部：有几家海外豪门表示了兴趣，“球员想知道自己在这个项目里到底是什么位置”。CEO 把消息转给了你。', o: [\n      { t: '亲自找他谈，把规划摊开', roll: { p: .5, ok: { fx: { p: { aff: 14, mood: 8 }, flag: ['ha_fix'] }, r: '你们谈了一个半小时。最后他说：“我留下，不是因为合同，是因为你说的那几个具体的计划。”' }, fail: { fx: { p: { aff: -3, mood: -8, form: -1 }, unity: -2, flag: 'ha_cold' }, r: '{p}听完说：“我知道你想让我留下。但我想听的，不是这个。”' } } },\n      { t: '“赛季结束后，由你自己决定。”', fx: { p: { mood: 5, aff: 6, form: .5 }, flag: 'ha_promise' }, r: '{p}长出了一口气：“谢谢。”你不确定自己是不是做对了。' },\n      { t: '“合同在，没有人可以随便离开。”', fx: { p: { aff: -8, mood: -8, ego: 3 }, unity: -2, flag: 'ha_cold' }, r: '{p}什么都没说。第二天，他的柜子里少了几样东西。' }] },\n\n    /* ---- 恩佐 · 节拍器 ---- */\n    { id: 'en_h1', cat: '专属线 · 恩佐', who: EN, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, EN) >= 62 && !done(c, 'en_l1'); }, t: '训练后，{p}把你拦在走廊里：“教练，我想在场上多说话。但我怕有些前辈觉得我越线了。”', o: [\n      { t: '“球队需要你的声音。想说就说。”', fx: { unity: 2, p: { aff: 6, mood: 5, ego: 3 }, flag: 'en1' }, r: '{p}点点头：“那我从明天开始。”你看到他握了握拳。' },\n      { t: '“先从站位开始。别人看到你，就知道怎么跑。”', fx: { chem: 2, p: { aff: 5, mood: 3, form: .6 }, flag: 'en1' }, r: '第二天训练，{p}站在中圈，一个手势就让三个人换了位置。' },\n      { t: '“找个机会，跟队里的老人单独聊聊。”', fx: { unity: 3, p: { aff: 7, mood: 3 }, flag: 'en1' }, r: '{p}真的找了。晚上他告诉你：“他们说，早就盼着有人先开口。”' }] },\n    { id: 'en_h2', cat: '专属线 · 恩佐', who: EN, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'en1') >= 5 && aff(c, EN) >= 68 && (!done(c, 'en_l1') || done(c, 'en_fix')); }, t: '球队近期状态起伏，更衣室里有些沉。{p}自己掏钱订了一张长桌，请全队去城里吃饭，只对你说了一句：“教练，你也来。”', o: [\n      { t: '去，坐在最靠边的位置', fx: { unity: 5, morale: 3, p: { aff: 5, mood: 4 }, flag: 'en2' }, r: '你吃得很安静。散场时，几个年轻人在门口抱成了一团。' },\n      { t: '去，并带上助教们', fx: { unity: 4, chem: 1.5, morale: 2, p: { aff: 4, mood: 3 }, flag: 'en2' }, r: '那天晚上，教练组和球员之间第一次没有了“桌子”。' },\n      { t: '不去：“那是你们的晚上。”', fx: { unity: 3, morale: 2, p: { aff: 3, mood: 5, ego: 2 }, flag: 'en2' }, r: '{p}笑了：“好，那我帮你讲给他们听。”' }] },\n    { id: 'en_h3', cat: '专属线 · 恩佐', who: EN, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'en2') >= 6 && aff(c, EN) >= 72 && (!done(c, 'en_l1') || done(c, 'en_fix')); }, t: '赛季快结束了。{p}把一张手写的“场上口令表”放在你桌上，西语、英语、手势并排写着。“我想把这个留给他们，”他说，“明年我可能不在每一场，但这套话可以一直在。”', o: [\n      { t: '“教给安德森和布阿迪。”', fx: { chem: 3, unity: 2, p: { aff: 5, mood: 7, form: 1.2, ovr: 1 }, flag: 'en3' }, r: '{p}把口令表复印了三份，分别交给了几个年轻人。' },\n      { t: '“明天训练，你来当教练。”', fx: { chem: 2.5, atk: 1.5, p: { aff: 5, mood: 8, ego: 3, ovr: .5 }, flag: 'en3' }, r: '那天训练后，所有人都说，他们从未这么清楚自己该跑去哪里。' },\n      { t: '“写得不错。留着，赛季末再说。”', fx: { p: { aff: 3, mood: 5, form: 1, ovr: .5 }, flag: 'en3' }, r: '{p}把口令表折好：“好，我们踢完再说。”' }] },\n    { id: 'en_l1', cat: '专属线 · 恩佐', who: EN, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, EN) <= 30 && !done(c, 'en2'); }, t: '{p}在场上很少再喊话了。传球越来越保守，每一脚都求稳。有人听到他在更衣室里说：“如果每一次出错都要被放大，我宁可什么都不做。”', o: [\n      { t: '单独约他，承认自己之前给的压力', roll: { p: .6, ok: { fx: { p: { aff: 11, mood: 6 }, flag: ['en_l1', 'en_fix'] }, r: '“我只是想知道，我做对的时候，有人看到吗？”{p}说。你把这句话记在了本子上。' }, fail: { fx: { p: { aff: 2, mood: 1 }, flag: 'en_l1' }, r: '{p}点点头，但你知道，这件事不是一次谈话能解决的。' } } },\n      { t: '“你是中场核心，这是你的职责。”', fx: { p: { aff: -5, mood: -6, form: -.5 }, unity: 1, flag: 'en_l1' }, r: '{p}低着头，没有说话。' },\n      { t: '给他放两天假，什么都不要求', fx: { p: { aff: 3, mood: 5, fit: 8 }, flag: 'en_l1' }, r: '两天后他回来了，眼神清楚了一些，也没提那件事。' }] },\n    { id: 'en_l2', cat: '专属线 · 恩佐', who: EN, force: true, story: true, once: true, when: function (c) { return c.S.week >= 16 && calm(c) && since(c, 'en_l1') >= 4 && aff(c, EN) <= 35 && !done(c, 'en_fix'); }, t: '更衣室里出现了微妙的分化：喜欢听{p}的年轻球员站在他那边，习惯另一套节奏的老球员站在另一边。训练里，两拨人连传球都刻意绕开对方。', o: [\n      { t: '请{p}当面谈，把话说开', roll: { p: .5, ok: { fx: { unity: 6, p: { aff: 14, mood: 6 }, flag: 'en_fix' }, r: '你们谈了整整一个下午。出来的时候，他重新站在了中圈。' }, fail: { fx: { unity: -4, p: { aff: -2, mood: -3 }, flag: 'en_cold' }, r: '“你需要的是一个只会执行的中场。”{p}说，“我不是那种人。”' } } },\n      { t: '把他的位置挪到边上，减轻责任', fx: { p: { aff: -10, mood: -10, ego: 4 }, unity: -4, flag: 'en_cold' }, r: '{p}沉默地照做了，但训练之后，他一个人坐了很久。' },\n      { t: '“所有人到会议室，一个一个说。”', fx: { unity: 1, p: { aff: -3, mood: -2 }, flag: 'en_cold' }, r: '会开了两个小时。该说的都说了，但有些东西没有被说开。' }] },\n\n    /* ---- 安德森 · 不会累的人 ---- */\n    { id: 'an_h1', cat: '专属线 · 安德森', who: AN, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, AN) >= 62 && !done(c, 'an_l1'); }, t: '训练结束后很久，{p}还一个人在场上。你喊他回去，他擦着汗说：“教练，我老觉得自己跑得不够。你觉得，我差在哪里？”', o: [\n      { t: '“你跑得不少，缺的是知道什么时候该停。”', fx: { cond: 1, p: { aff: 6, mood: 3, form: .6, ego: -1 }, flag: 'an1' }, r: '{p}想了一会儿：“我试试，先慢下来。”' },\n      { t: '把他的跑动数据给他看', fx: { p: { aff: 7, mood: 4, form: .5 }, flag: 'an1' }, r: '{p}盯着那张图，轻声说：“原来我已经跑了这么多。”' },\n      { t: '“你想练，我陪你练。”', fx: { fatigue: 2, p: { aff: 8, mood: 5, form: .8 }, flag: 'an1' }, r: '你们练到天黑。{p}说：“我从没有教练陪我练到这么晚。”' }] },\n    { id: 'an_h2', cat: '专属线 · 安德森', who: AN, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'an1') >= 5 && aff(c, AN) >= 68 && (!done(c, 'an_l1') || done(c, 'an_fix')); }, t: '一场失球之后，{p}被本地媒体打了很低的分，球迷论坛里有人写：“他还没有准备好。”他看着手机，看了很久，才把它扣在桌上。', o: [\n      { t: '坐到他身边，把手机拿走', fx: { p: { aff: 7, mood: 7 }, flag: 'an2' }, r: '{p}看着你，终于笑了：“谢谢，教练。我今晚不看了。”' },\n      { t: '“明天训练，把那个球练一百遍。”', fx: { p: { aff: 5, form: 1, mood: 3 }, flag: 'an2' }, r: '第二天{p}练到了第一百零一次，才肯走。' },\n      { t: '让恩佐去陪他吃饭', fx: { unity: 2, p: { aff: 5, mood: 6 }, flag: 'an2' }, r: '两个人吃了很久。回来时，{p}走路都轻了很多。' }] },\n    { id: 'an_h3', cat: '专属线 · 安德森', who: AN, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'an2') >= 6 && aff(c, AN) >= 72 && (!done(c, 'an_l1') || done(c, 'an_fix')); }, t: '国家队大名单公布的前一晚，{p}来敲你的门：“教练，不管名单里有没有我，我都想说一句——这个赛季，我没有一天觉得自己是外人。”', o: [\n      { t: '“不管名单怎样，这里有你的位置。”', fx: { p: { aff: 5, mood: 8, form: 1.2, ovr: 1 }, flag: 'an3' }, r: '{p}点点头，眼睛有点红：“谢谢。”' },\n      { t: '“去吧，回来后我们还有一场硬仗。”', fx: { morale: 2, p: { aff: 4, mood: 6, form: 1.5, ovr: .5 }, flag: 'an3' }, r: '{p}挺直了背：“好，我会带着东西回来。”' },\n      { t: '把他的跑动数据整理成一本小册子送给他', fx: { p: { aff: 6, mood: 7, ovr: .5, form: 1 }, flag: 'an3' }, r: '{p}翻了很久，最后合上，说：“我会留着。”' }] },\n    { id: 'an_l1', cat: '专属线 · 安德森', who: AN, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, AN) <= 30 && !done(c, 'an2'); }, t: '{p}的跑动数据明显下降了，上场时总是慢半拍。有人听见他在更衣室里小声说：“我是不是根本不属于这里？”', o: [\n      { t: '单独找他，先道歉', roll: { p: .65, ok: { fx: { p: { aff: 11, mood: 6 }, flag: ['an_l1', 'an_fix'] }, r: '“我没想到你会道歉。”{p}说，“我以为……我只是个听话的人。”' }, fail: { fx: { p: { aff: 3, mood: 1 }, flag: 'an_l1' }, r: '{p}点点头，但你知道，他需要更久的时间。' } } },\n      { t: '“比赛不是幼儿园。”', fx: { p: { aff: -6, mood: -8, form: -.6, ego: -3 }, unity: 1, flag: 'an_l1' }, r: '{p}没有哭，也没有反驳，只是低着头走开了。' },\n      { t: '给他放两天假，让他去外面走走', fx: { p: { aff: 3, mood: 5, fit: 8 }, flag: 'an_l1' }, r: '两天后他回来了，眼神清楚了一些，也没提那件事。' }] },\n    { id: 'an_l2', cat: '专属线 · 安德森', who: AN, force: true, story: true, once: true, when: function (c) { return c.S.week >= 16 && calm(c) && since(c, 'an_l1') >= 4 && aff(c, AN) <= 35 && !done(c, 'an_fix'); }, t: '{p}的父母给你打来电话，语气很客气：“他最近很少说话。我们想问问，他是不是更适合一个能踢满的地方？”', o: [\n      { t: '约他和家人一起，把计划讲清楚', roll: { p: .55, ok: { fx: { p: { aff: 12, mood: 7 }, flag: 'an_fix' }, r: '谈到最后，{p}说：“我只是想知道，我在这里是有未来的。”' }, fail: { fx: { p: { aff: -2, mood: -3 }, flag: 'an_cold' }, r: '父母说了很多，{p}一句话都没说。' } } },\n      { t: '“出场机会，是靠表现挣的。”', fx: { p: { aff: -6, mood: -6, ego: -2 }, flag: 'an_cold' }, r: '电话那头沉默了一会儿，说“我们明白了”。' },\n      { t: '承诺他下个月起，至少有两次首发', fx: { unity: -1, p: { aff: 8, mood: 8, ego: 4, form: -.3 }, flag: 'an_fix' }, r: '{p}回到训练场的时候，声音大了一点。' }] },\n\n    /* ---- 谢尔基 · 魔术师 ---- */\n    { id: 'ch_h1', cat: '专属线 · 谢尔基', who: CH, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, CH) >= 62 && !done(c, 'ch_l1'); }, t: '训练赛里，{p}尝试了一次几乎不可能的转身，结果被断了球。助教在场边皱了皱眉。{p}走到你面前，认真地问：“教练，你觉得我该改吗？”', o: [\n      { t: '“你可以玩，但要先选对时机。”', fx: { chem: 1.5, p: { aff: 6, mood: 3, form: .6 }, flag: 'ch1' }, r: '{p}想了想：“好，我只在前场三十米里玩。”' },\n      { t: '“不改。我就是为这个才要你。”', fx: { atk: 1.5, p: { aff: 7, mood: 6, ego: 3, form: .8 }, flag: 'ch1' }, r: '{p}笑得很亮：“教练，你说话我爱听。”' },\n      { t: '“先守住球，再做魔术。”', fx: { def: 1, p: { aff: 3, mood: -1, ego: -3, form: .3 }, flag: 'ch1' }, r: '{p}耸耸肩：“好吧，我先把基本功做一遍。”' }] },\n    { id: 'ch_h2', cat: '专属线 · 谢尔基', who: CH, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'ch1') >= 5 && aff(c, CH) >= 68 && (!done(c, 'ch_l1') || done(c, 'ch_fix')); }, t: '一场关键比赛里，{p}在门前炫了一个脚后跟，结果球被拦下。媒体把这个画面放了一整天，标题是《太花哨了》。他坐在更衣室里，一直没抬头。', o: [\n      { t: '“那个球是对的。下次我们换个角度。”', fx: { p: { aff: 7, mood: 7, ego: 2 }, flag: 'ch2' }, r: '{p}抬起头：“你是第一个这么说的人。”' },\n      { t: '“你可以保留花样，但要在关键时刻选择更稳的。”', fx: { chem: 1.5, p: { aff: 5, mood: 3, form: .8, ego: -3 }, flag: 'ch2' }, r: '{p}沉默了一会儿：“我会学着判断。”' },\n      { t: '什么也不说，让他自己想', fx: { p: { aff: 2, mood: -2, form: .5 }, flag: 'ch2' }, r: '第二天训练，他异常安静，只做了最简单的传球。' }] },\n    { id: 'ch_h3', cat: '专属线 · 谢尔基', who: CH, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'ch2') >= 6 && aff(c, CH) >= 72 && (!done(c, 'ch_l1') || done(c, 'ch_fix')); }, t: '赛季最后阶段的一个夜晚，{p}给你放了一段手机里的老视频：一个水泥地的小球场，一个小男孩，脚下的球在人群里穿来穿去。“那时候没有教练，也没有人对我说‘不要这样’，”他说，“我现在只想让自己的足球，还有那时候的样子。”', o: [\n      { t: '“那就带着它，去赢下一场。”', fx: { atk: 3, p: { aff: 5, mood: 8, form: 1.5, ovr: 1, ego: 2 }, flag: 'ch3' }, r: '{p}把视频关了，抬起头：“好。”' },\n      { t: '“比赛里，你可以把那个孩子放出来一次。”', fx: { p: { aff: 5, mood: 7, form: 1.8, ovr: .5 }, flag: 'ch3' }, r: '那一周，{p}在场上多做了三次不可思议的传球。其中两次变成了进球。' },\n      { t: '“我会把这段视频放进战术会，给大家看。”', fx: { unity: 3, chem: 2, p: { aff: 4, mood: 6, ovr: .5 }, flag: 'ch3' }, r: '全队安静地看完。有人说：“我也想回到那个球场。”' }] },\n    { id: 'ch_l1', cat: '专属线 · 谢尔基', who: CH, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, CH) <= 30 && !done(c, 'ch2'); }, t: '{p}最近不再尝试任何冒险的传球，一脚球就是一个安全选择。有人听见他对助教说：“我是不是变成了一个只会按按钮的人？”', o: [\n      { t: '单独约他，承认你需要他的想法', roll: { p: .55, ok: { fx: { p: { aff: 10, mood: 6, ego: 2 }, flag: ['ch_l1', 'ch_fix'] }, r: '“我想看你变戏法，”你说。{p}愣了一下，眼睛重新有了光。' }, fail: { fx: { p: { aff: 2, mood: -2 }, flag: 'ch_l1' }, r: '{p}点点头，但他显然没有被说服。' } } },\n      { t: '“团队优先，个人花样放一边。”', fx: { p: { aff: -6, mood: -6, ego: -3 }, unity: 2, flag: 'ch_l1' }, r: '{p}没有反驳，只是在训练里再也没有炫过技。' },\n      { t: '给他一场不限制的比赛，让他放开踢', fx: { p: { aff: 5, mood: 6, form: .5, ego: 4 }, flag: 'ch_l1' }, r: '那场球，{p}触球四十次，其中二十次让对手摸不着头脑。' }] },\n    { id: 'ch_l2', cat: '专属线 · 谢尔基', who: CH, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'ch_l1') >= 4 && aff(c, CH) <= 35 && !done(c, 'ch_fix'); }, t: '{p}的经纪人联系了俱乐部：“他想去一个能让他放开踢的环境。”CEO 把这条消息转给了你。', o: [\n      { t: '直接找他谈：“你要的自由，我给你。”', roll: { p: .5, ok: { fx: { p: { aff: 14, mood: 8, ego: 3 }, flag: 'ch_fix' }, r: '你们谈了一个小时。最后他说：“我没想到，你真的会听。”' }, fail: { fx: { p: { aff: -3, mood: -8, form: -1 }, unity: -2, flag: 'ch_cold' }, r: '{p}听完说：“你说得好听，但我已经不太相信了。”' } } },\n      { t: '“合同在，你不会走。”', fx: { p: { aff: -8, mood: -8, ego: 3 }, unity: -2, flag: 'ch_cold' }, r: '{p}什么都没说。第二天，他在训练里没有再看你一眼。' },\n      { t: '答应他：赛季结束后，由他自己选', fx: { p: { mood: 5, aff: 6, form: .5 }, flag: 'ch_promise' }, r: '{p}长出一口气：“谢谢你，教练。”你不确定这是不是对的决定。' }] },\n\n    /* ---- 布阿迪 · 十八岁 ---- */\n    { id: 'bo_h1', cat: '专属线 · 布阿迪', who: BO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, BO) >= 62 && !done(c, 'bo_l1'); }, t: '训练后，{p}抱着一个厚厚的笔记本站在你面前：“教练，我把大家每个人的习惯都记下来了。恩佐喜欢后脚接球，安德森喜欢向右转身……我想知道，我这样做对不对？”', o: [\n      { t: '“对。继续记，我也想看看。”', fx: { chem: 1.5, p: { aff: 7, mood: 5, form: .6 }, flag: 'bo1' }, r: '{p}翻开笔记本，指着其中一页：“这是你的，教练。”你笑了。' },\n      { t: '“很用心，但别把自己累坏了。”', fx: { p: { aff: 5, mood: 3, form: .3 }, flag: 'bo1' }, r: '{p}挠头：“我睡得挺好的。”' },\n      { t: '请恩佐看看他的笔记', fx: { unity: 2, p: { aff: 6, mood: 6 }, flag: 'bo1' }, r: '恩佐翻完后说：“这孩子，比我年轻时仔细。”' }] },\n    { id: 'bo_h2', cat: '专属线 · 布阿迪', who: BO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'bo1') >= 5 && aff(c, BO) >= 68 && (!done(c, 'bo_l1') || done(c, 'bo_fix')); }, t: '昨天那个传球失误导致了一个丢球，{p}一个人坐在更衣室的角落，毛巾盖着头。所有人都从他身边绕了过去。', o: [\n      { t: '坐到他旁边，一句话也不说', fx: { unity: 1, p: { aff: 8, mood: 8 }, flag: 'bo2' }, r: '十分钟后，{p}把毛巾拿下来，说：“谢谢你没有说话。”' },\n      { t: '“明天训练，我们把那个球练一百遍。”', fx: { p: { aff: 5, form: 1, mood: 3 }, flag: 'bo2' }, r: '第二天{p}练到了第一百零一次，才肯走。' },\n      { t: '让恩佐去陪他', fx: { unity: 2, p: { aff: 3, mood: 4 }, flag: 'bo2' }, r: '恩佐和他在更衣室待了很久。出来的时候，{p}笑了一下。' }] },\n    { id: 'bo_h3', cat: '专属线 · 布阿迪', who: BO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'bo2') >= 6 && aff(c, BO) >= 72 && (!done(c, 'bo_l1') || done(c, 'bo_fix')); }, t: '欧冠夜的前一晚，{p}来敲你的门。他在门口站了很久，才说：“教练，我怕自己搞砸。能不能教教我，怎么不去想后果？”', o: [\n      { t: '“你不用不想。你只要一次想一件事——下一个球。”', fx: { p: { aff: 6, mood: 8, form: 1.5, ovr: 1 }, flag: 'bo3' }, r: '{p}反复念了几遍：“下一个球，下一个球……”' },\n      { t: '“你没有一个人上场。恩佐、安德森，他们都在你身边。”', fx: { unity: 3, p: { aff: 5, mood: 7, form: 1, ovr: .5 }, flag: 'bo3' }, r: '{p}深吸了一口气：“好。我相信他们。”' },\n      { t: '带他去球场，在空荡的看台下走一圈', fx: { morale: 2, p: { aff: 6, mood: 7, form: 1.2, ovr: .5 }, flag: 'bo3' }, r: '你们站在中圈，看着空空的座位。{p}说：“其实，也没那么可怕。”' }] },\n    { id: 'bo_l1', cat: '专属线 · 布阿迪', who: BO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, BO) <= 30 && !done(c, 'bo2'); }, t: '{p}几乎没有上场机会，却每天最早到训练场，最晚离开。他不说话，也不提要求。助教私下说：“他在等一个信号，但没有人给他。”', o: [\n      { t: '单独约他，告诉他你的计划', roll: { p: .6, ok: { fx: { p: { aff: 10, mood: 7 }, flag: ['bo_l1', 'bo_fix'] }, r: '“我只是想知道，自己有没有被看见。”{p}说。你说：“有。”' }, fail: { fx: { p: { aff: 2, mood: 1 }, flag: 'bo_l1' }, r: '{p}点点头，但眼神里依旧带着疑问。' } } },\n      { t: '“好好练，机会会来的。”', fx: { p: { aff: -3, mood: -3 }, flag: 'bo_l1' }, r: '{p}点点头，没有再问。' },\n      { t: '让他在下一场杯赛里首发', fx: { p: { aff: 6, mood: 8, form: .4 }, unity: -1, flag: 'bo_l1' }, r: '更衣室里有人皱眉。{p}却认真地擦了一遍球鞋。' }] },\n    { id: 'bo_l2', cat: '专属线 · 布阿迪', who: BO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 16 && calm(c) && since(c, 'bo_l1') >= 4 && aff(c, BO) <= 35 && !done(c, 'bo_fix'); }, t: '{p}的家人给俱乐部打了电话：“他需要稳定的出场时间，是不是应该租借出去？”CEO 把这件事交给了你。', o: [\n      { t: '约家人和{p}一起，谈明年的规划', roll: { p: .5, ok: { fx: { board: 1, p: { aff: 12, mood: 6 }, flag: 'bo_fix' }, r: '谈到最后，{p}说：“我想留在这里，但我想知道，有没有路。”' }, fail: { fx: { board: -1, p: { aff: -2, mood: -2 }, flag: 'bo_cold' }, r: '谈判桌上，家人说得最多，{p}一句话都没说。' } } },\n      { t: '同意租借，赛季末再回来', fx: { unity: -1, p: { aff: 3, mood: 3, form: -.4 }, flag: 'bo_cold' }, r: '{p}礼貌地谢了你，但你听得出，这是一句告别。' },\n      { t: '给他一个固定的“杯赛首发”位置', fx: { unity: -1, p: { aff: 8, mood: 8, ego: 4, form: -.3 }, flag: 'bo_fix' }, r: '{p}在训练场上开口喊了队友的名字，声音比平时大。' }] },\n\n    /* ---- 福登 · 曼彻斯特的孩子 ---- */\n    { id: 'fo_h1', cat: '专属线 · 福登', who: FO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, FO) >= 62 && !done(c, 'fo_l1'); }, t: '训练结束，{p}一个人站在走廊里，看着墙上的青训照片发呆。你走过去，他指着其中一张：“教练，你觉得现在的我，比那时候更好吗？”', o: [\n      { t: '“你比那时候强得多。但最好的那个你，还在后面。”', fx: { p: { aff: 6, mood: 5, form: .6 }, flag: 'fo1' }, r: '{p}点点头：“我知道。我还在等那个人。”' },\n      { t: '“别比。你只需要成为今天的自己。”', fx: { p: { aff: 5, mood: 4, ego: -1 }, flag: 'fo1' }, r: '{p}笑了：“教练，你总是把事情说得很简单。”' },\n      { t: '“你问我，不如问照片里的那个小孩。”', roll: { p: .6, ok: { fx: { p: { aff: 8, mood: 6, form: .5 }, flag: 'fo1' }, r: '{p}盯着那张照片很久，然后说：“他应该会说，不错。”' }, fail: { fx: { p: { aff: 2, mood: 1 }, flag: 'fo1' }, r: '{p}点点头，但显然没有被说动。' } } }] },\n    { id: 'fo_h2', cat: '专属线 · 福登', who: FO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'fo1') >= 5 && aff(c, FO) >= 68 && (!done(c, 'fo_l1') || done(c, 'fo_fix')); }, t: '前场的竞争越来越激烈，几个位置上都有人状态正好。{p}坐在替补席上的次数多了一些。记者在发布会上问你：“福登是不是应该考虑换个环境？”', o: [\n      { t: '“他是这里的一部分，没有人需要离开。”', fx: { fans: 2, p: { aff: 8, mood: 6 }, flag: 'fo2' }, r: '{p}在走廊里等你，什么也没说，只是把水递给了你。' },\n      { t: '私下告诉他，他的位置是安全的', fx: { p: { aff: 7, mood: 6, form: .5 }, flag: 'fo2' }, r: '{p}沉默了一会儿：“我知道我该做什么。”' },\n      { t: '“位置永远是靠表现挣的。”', fx: { p: { form: 1.2, ego: 3, aff: 2, mood: -1 }, flag: 'fo2' }, r: '那周{p}在训练里踢得极其认真。你在场边看着，没有鼓掌。' }] },\n    { id: 'fo_h3', cat: '专属线 · 福登', who: FO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'fo2') >= 6 && aff(c, FO) >= 72 && (!done(c, 'fo_l1') || done(c, 'fo_fix')); }, t: '赛季的最后阶段，{p}提出了一个有些不好意思的请求：“教练，能不能带大家去我小时候踢球的那个小球场，踢一场？就一场，不为赢，只为踢。”', o: [\n      { t: '“好，周末我们都去。”', fx: { unity: 5, morale: 4, fatigue: -3, p: { aff: 5, mood: 9, form: 1.2, ovr: 1 }, flag: 'fo3' }, r: '那个下午，一群顶级球员在一片小草皮上追着一个旧球跑。{p}进了一个很丑的球，笑得整个人都在抖。' },\n      { t: '“好，但要带摄影机，给球迷看。”', fx: { fans: 4, unity: 3, p: { aff: 3, mood: 5, form: .8, ovr: .5 }, flag: 'fo3' }, r: '视频被转了二十万次。评论区里有一句话被顶到了最上面：“这就是我们的孩子。”' },\n      { t: '“好，只有我们自己人。”', fx: { unity: 4, morale: 3, p: { aff: 6, mood: 7, form: 1, ovr: .5 }, flag: 'fo3' }, r: '那个下午没有一张照片流出去。但每个人后来都记得，球门是两件外套摆的。' }] },\n    { id: 'fo_l1', cat: '专属线 · 福登', who: FO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, FO) <= 30 && !done(c, 'fo2'); }, t: '{p}最近一句话也不说了。训练时他总是第一个到，最后一个走，但眼神里没有光。队友们开始私下议论：“他是不是想走？”', o: [\n      { t: '约他在青训旧球场见面，不谈足球', roll: { p: .55, ok: { fx: { p: { aff: 10, mood: 7 }, flag: ['fo_l1', 'fo_fix'] }, r: '你们在球门前坐了一个小时。{p}终于说：“我只是不想让你失望。”' }, fail: { fx: { p: { aff: 2, mood: -1 }, flag: 'fo_l1' }, r: '{p}礼貌地答完每一个问题，但你知道，他没有真正说出口。' } } },\n      { t: '“你该加练了，状态不对。”', fx: { p: { aff: -5, mood: -5, form: -.3 }, flag: 'fo_l1' }, r: '{p}点点头，转身去加练了。你知道他不是不愿意，而是没有被听到。' },\n      { t: '给他放几天假，让他回家看看', fx: { p: { aff: 4, mood: 6, fit: 8 }, flag: 'fo_l1' }, r: '几天后他回来了，脸色好了一些。' }] },\n    { id: 'fo_l2', cat: '专属线 · 福登', who: FO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'fo_l1') >= 4 && aff(c, FO) <= 35 && !done(c, 'fo_fix'); }, t: '{p}的经纪人联系了俱乐部：“他想去一个自己是第一选择的地方。”这条消息传到了更衣室，所有人都知道，他是看着青训照片长大的。', o: [\n      { t: '去他家，跟他的家人坐下来谈', roll: { p: .5, ok: { fx: { p: { aff: 14, mood: 8 }, flag: 'fo_fix' }, r: '他的母亲给你倒了茶。最后{p}说：“我留下，不是因为合同，是因为这里是家。”' }, fail: { fx: { p: { aff: -3, mood: -8, form: -1 }, unity: -2, flag: 'fo_cold' }, r: '{p}听完说：“我知道你想让我留下。但我需要的，是被需要。”' } } },\n      { t: '“赛季结束后，我们再谈。”', fx: { p: { mood: 3, aff: 3 }, flag: 'fo_promise' }, r: '{p}点点头：“好。”你听不出那是同意还是妥协。' },\n      { t: '“没有人可以随便离开这里。”', fx: { p: { aff: -8, mood: -8, ego: 3 }, unity: -2, flag: 'fo_cold' }, r: '{p}什么都没说。第二天，他的储物柜上，青训时的名牌不见了。' }] }\n  ],\n\n  /* 梗图鉴（成就）：check(S, H, final) 返回 true 就解锁 */\n  achievements: [\n    { id: 'first', name: '第一周', desc: '完成第一周的排程', check: function (S) { return S.week >= 1; } },\n    { id: 'derby', name: '曼彻斯特是蓝色的', desc: '联赛中赢下一场曼市德比', check: function (S) { return S.hist.some(function (h) { return h.opp === 'MUN' && h.cn === '英超' && h.out === 'W'; }); } },\n    { id: 'bigwin', name: '血洗', desc: '一场比赛净胜三球以上', check: function (S) { return S.stats.bigWins >= 1; } },\n    { id: 'streak8', name: '一场一场来', desc: '各项赛事 8 连胜', check: function (S) { return S.streak >= 8; } },\n    { id: 'unbeaten10', name: '十场不败', desc: '各项赛事 10 场不败', check: function (S) { return S.unbeaten >= 10; } },\n    { id: 'talks20', name: '心灵导师', desc: '累计找球员谈话 20 次', check: function (S) { return S.stats.talks >= 20; } },\n    { id: 'unity85', name: '一家人', desc: '更衣室团结达到 85', check: function (S) { return S.attrs.unity >= 85; } },\n    { id: 'atk80', name: '肋部三角', desc: '进攻体系达到 80', check: function (S) { return S.attrs.atk >= 80; } },\n    { id: 'def80', name: '高位防线', desc: '防守体系达到 80', check: function (S) { return S.attrs.def >= 80; } },\n    { id: 'ucl_qf', name: '八强之上', desc: '欧冠打进八强', check: function (S) { var u = S.ucl; return u.stage === 'sf' || u.stage === 'f' || u.stage === 'won' || (u.exit && ['qf', 'sf', 'f'].indexOf(u.exit) >= 0); } },\n    { id: 'liga', name: '夺回英超', desc: '拿下英超冠军', check: function (S, H, final) { return final && S.ending && S.ending.rank === 1; } },\n    { id: 'efl', name: '联赛杯的老朋友', desc: '拿下联赛杯', check: function (S) { return S.trophies.indexOf('联赛杯') >= 0; } },\n    { id: 'fa', name: '温布利的蓝色', desc: '拿下足总杯', check: function (S) { return S.trophies.indexOf('足总杯') >= 0; } },\n    { id: 'ucl', name: '大耳朵杯，再一次', desc: '拿下欧冠', check: function (S) { return S.trophies.indexOf('欧冠') >= 0; } },\n    { id: 'treble', name: '三冠王，第二次', desc: '同一赛季拿下英超、足总杯和欧冠', check: function (S) { var t = S.trophies; return t.indexOf('欧冠') >= 0 && t.indexOf('足总杯') >= 0 && t.indexOf('英超') >= 0; } },\n    { id: 'quad', name: '四座奖杯', desc: '同一赛季拿下英超、足总杯、联赛杯和欧冠', check: function (S) { var t = S.trophies; return t.indexOf('欧冠') >= 0 && t.indexOf('足总杯') >= 0 && t.indexOf('联赛杯') >= 0 && t.indexOf('英超') >= 0; } },\n    { id: 'haa30', name: '算不清的进球', desc: '哈兰德赛季总进球达到 30', check: function (S) { return S.pl[HA].goals >= 30; } },\n    { id: 'fortress', name: '伊蒂哈德堡垒', desc: '整个英超赛季主场不败', check: function (S, H, final) { if (!final) return false; var hs = S.hist.filter(function (h) { return h.cn === '英超' && h.h; }); return hs.length >= 19 && !hs.some(function (h) { return h.out === 'L'; }); } },\n    { id: 'story_ha', name: '两个球之间', desc: '走完哈兰德的专属线', check: function (S) { return !!S.flags.ha3; } },\n    { id: 'story_en', name: '场上口令', desc: '走完恩佐的专属线', check: function (S) { return !!S.flags.en3; } },\n    { id: 'story_an', name: '不会累的人', desc: '走完安德森的专属线', check: function (S) { return !!S.flags.an3; } },\n    { id: 'story_ch', name: '水泥地上的孩子', desc: '走完谢尔基的专属线', check: function (S) { return !!S.flags.ch3; } },\n    { id: 'story_bo', name: '下一个球', desc: '走完布阿迪的专属线', check: function (S) { return !!S.flags.bo3; } },\n    { id: 'story_fo', name: '两件外套当球门', desc: '走完福登的专属线', check: function (S) { return !!S.flags.fo3; } },\n    { id: 'story_all', name: '六个故事，一个更衣室', desc: '同一赛季走完六条专属线', check: function (S) { var f = S.flags; return !!(f.ha3 && f.en3 && f.an3 && f.ch3 && f.bo3 && f.fo3); } },\n    { id: 'fix', name: '冰释前嫌', desc: '把一段正在破裂的关系拉了回来', check: function (S) { var f = S.flags; return !!(f.ha_fix || f.en_fix || f.an_fix || f.ch_fix || f.bo_fix || f.fo_fix); } },\n    { id: 'cold', name: '谈崩了', desc: '一名核心球员和你的关系彻底破裂', check: function (S) { var f = S.flags; return !!(f.ha_cold || f.en_cold || f.an_cold || f.ch_cold || f.bo_cold || f.fo_cold); } },\n    { id: 'endall', name: '全结局收藏家', desc: '集齐结局图鉴里的所有结局', check: function () { return false; } }\n  ],\n\n  /* 结局 */\n  endings: function (S, r) {\n    var t = r.tro, has = function (n) { return t.indexOf(n) >= 0; };\n    var liga = has('英超'), fa = has('足总杯'), efl = has('联赛杯'), ucl = has('欧冠');\n    var cup = fa || efl;\n    var head, body, grade;\n    if (r.fired) { head = '提前离开的人'; grade = 'D'; body = '董事会的耐心比赛季更短。你收拾办公室的时候，更衣室里没有人说话，直到最后一个人走过来，把那件训练服还给你。\\n你在门口回头看了一眼，对自己说：一场一场来。'; }\n    else if (liga && fa && efl && ucl) { head = '四冠王'; grade = 'S+'; body = '四座奖杯，一个赛季。那天晚上的伊蒂哈德，没有人愿意回家。\\n你想起了那条语音：“其实我也不总是知道怎么踢。”这一次，你知道了。'; }\n    else if (liga && ucl && cup) { head = '三冠王'; grade = 'S+'; body = '联赛、欧冠，还有一座杯赛。那天晚上的更衣室里放的是你最不喜欢的歌，但你一首也没有关。\\n这支球队再一次做到了所有人都觉得不可能的事。'; }\n    else if (ucl && liga) { head = '欧冠与英超双冠'; grade = 'S'; body = '大耳朵杯捧起来的那一刻，你抬头看了一眼看台。第一次，你没有躲开镜头。\\n联赛和欧洲，同一个赛季，同一支球队。'; }\n    else if (ucl) { head = '大耳朵杯'; grade = 'S'; body = '欧冠夜的哨声响起时，你站在原地，等所有人都抱在了一起，才慢慢走过去。\\n你想：原来是这么重。'; }\n    else if (liga && fa && efl) { head = '国内三冠'; grade = 'A+'; body = '英超、足总杯、联赛杯，三座奖杯整整齐齐地摆在了展示柜里。\\n欧洲的故事，留给明年。'; }\n    else if (liga && cup) { head = '国内双冠'; grade = 'A+'; body = '联赛冠军和杯赛冠军同时到手。球迷在街头唱了一整夜，邻居们的窗户都关得紧紧的。\\n欧洲的故事，留给明年。'; }\n    else if (liga) { head = '英超冠军'; grade = 'A'; body = '最后一轮结束的哨声响起时，你没有冲到场边。你站在原地，等所有人都抱在了一起，才慢慢走过去。\\n你终于，把这座奖杯带回了蓝色的那一半曼彻斯特。'; }\n    else if (r.ucl === 'f') { head = '决赛夜的另一边'; grade = 'B+'; body = '决赛之后，你一个人在更衣室里坐了很久。最后是恩佐过来，把一瓶水塞到你手里：“教练，明年还来。”\\n你没有回答，但你记住了这句话。'; }\n    else if (cup) { head = '杯赛冠军'; grade = 'B+'; body = '一座杯赛冠军，不是最大的，但足以让这个赛季不被遗忘。\\n赛季结束的那天，你在训练场上多待了一会儿。'; }\n    else if (r.rank <= 2) { head = '差了一点点的亚军'; grade = 'B+'; body = '赛季结束的时候，积分榜上你的名字紧挨着榜首。球迷们给你鼓掌，你却想起了那几场本可以赢的比赛。\\n“一点点，永远是最远的距离。”'; }\n    else if (r.rank <= 4 && (r.ucl === 'qf' || r.ucl === 'sf' || r.ucl === 'r16')) { head = '稳稳站在欧冠区'; grade = 'B'; body = '联赛前四，欧冠也走得不近不远。对这支球队来说算不上伟大，却是一个对得起这座球场的赛季。\\n你用笔在日历上划掉了最后一周。'; }\n    else if (r.rank <= 4) { head = '欧冠资格到手'; grade = 'B'; body = '联赛前四，赛季目标达成。看台上没有欢呼，也没有嘘声。\\n对一支习惯了奖杯的球队来说，这是一个“不够好”的赛季，但也是一个能继续往前走的赛季。'; }\n    else if (r.rank < \/span><\/div>' + l.tails.map(function (t) { return '<p class=\"hint\">' + esc(t) + '<\/p>'; }).join('');\n  out += '<div class=\"sec-h\"><span>已打出的风格<\/span><small>共打出 ' + r.n + ' 次<\/small><\/div><div class=\"st\">' + sn.map(function (k) { return tag(STYLE_N[k] + (r.styles[k] ? ' ×' + r.styles[k] : ''), r.styles[k] ? 'good' : ''); }).join('') + '<\/div>';\n  return out + '<button class=\"btn\" data-act=\"closesheet\">关闭<\/button>';\n}\n\n/* ---------------- 文案小工具 ---------------- */\nfunction moodW(v) { return v < 35 ? ['低落', 'bad'] : v < 50 ? ['偏低', 'warn'] : v < 70 ? ['平稳', 'mid'] : v < 85 ? ['不错', 'good'] : ['高涨', 'good']; }\nfunction formW(v) { return v > 1.5 ? ['火热', 'good'] : v > .5 ? ['良好', 'good'] : v > -.5 ? ['正常', 'mid'] : v > -1.5 ? ['低迷', 'warn'] : ['糟糕', 'bad']; }\nfunction egoW(v) { return v < 45 ? ['沉稳', 'good'] : v < 65 ? ['自信', 'mid'] : v < 80 ? ['膨胀', 'warn'] : ['失控', 'bad']; }\nfunction hearts(v) { var n = Math.max(0, Math.min(5, Math.round(v / 20))); return '♥'.repeat(n) + '♡'.repeat(5 - n); }\nfunction tag(t, c) { return '<span class=\"tag ' + (c || '') + '\">' + esc(t) + '<\/span>'; }\nfunction fatLabel(f) { return f < 25 ? '精力充沛' : f < 45 ? '状态良好' : f < 62 ? '有些疲劳' : f < 80 ? '疲劳偏高' : '濒临极限'; }\nfunction wkRange() { return CG.dTxt(S.date) + ' – ' + CG.dTxt(CG.addDays(S.date, 6)); }\nfunction seasonProg() { return Math.min(100, Math.round(S.week / 42 * 100)); }\nfunction ACT(id) { return CG.ACTS[id]; }\nfunction kp(id) { return CFG.keyPlayers.filter(function (k) { return k.id === id; })[0]; }\nfunction P(id) { return DATA.byId[id]; }\n\n/* ---------------- 顶栏 ---------------- */\nfunction topbar(label, range) {\n  var f = S.fatigue, fc = f < 45 ? 'up' : f < 62 ? 'flat' : 'down';\n  return '<header class=\"top\"><div class=\"row\"><div class=\"brand\">' + esc(CFG.title) + '<\/div><div class=\"wk\"><b class=\"num\">' + (label || '第 ' + (S.week + 1) + ' 周') + '<\/b> ' + esc(range || wkRange()) + '<\/div><\/div><div class=\"prog\" role=\"progress \n\n/* ---------------- 总览 ---------------- */\nfunction tabHome() {\n  var wf = CG.weekFixtures(S), out = '';\n  out += '<section class=\"panel\"><h2>本周赛程<\/h2>';\n  if (!wf.length) out += '<p class=\"hint\">本周没有比赛。适合安排重一点的训练。<\/p>';\n  wf.forEach(function (x) {\n    var f = x.f, t = CG.oppTier(S, f.opp), st = CG.team(f.opp).style;\n    out += '<div class=\"fixt\"><div class=\"d\">' + CG.DAYN[x.d].slice(1) + '<small>' + CG.dTxt(f.date) + '<\/small><\/div><div class=\"o\"><b>' + (f.neutral ? '' : f.h ? '主 ' : '客 ') + esc(CG.tname(f.opp)) + '<\/b><small>' + esc(f.cn + ' · ' + f.rd) + (st ? ' · ' + esc(st) : '') + '<\/small><\/div><div>' + tag(t[0], t[1]) + '<\/div><\/div>';\n  });\n  out += '<\/section>';\n  var hs = hints();\n  if (hs.length) out += '<section class=\"panel\"><h2>助教提示<\/h2>' + hs.map(function (h) { return '<div class=\"tip ' + h[0] + '\">' + esc(h[1]) + '<\/div>'; }).join('') + '<\/section>';\n  var ou = CG.ourStr(S), b = ou.b;\n  out += '<section class=\"panel\"><h2>球队数值<\/h2>';\n  CG.ATTRS.forEach(function (a) {\n    var v = S.attrs[a.k], d = S.prev ? v - S.prev[a.k] : 0;\n    out += '<div class=\"attr\" title=\"' + esc(a.d) + '\"><span>' + a.n + '<\/span><div class=\"bar\"><i style=\"width:' + v + '%\"><\/i><u><\/u><\/div><span class=\"v\">' + Math.round(v) + '<em class=\"' + clsd(d) + '\">' + (Math.abs(d) >= .05 ? sg(d) : '') + '<\/em><\/span><\/div>';\n  });\n  var fc = S.fatigue < 45 ? '' : S.fatigue < 62 ? 'w' : 'b';\n  out += '<div class=\"attr\"><span>疲劳<\/span><div class=\"fatbar\"><i class=\"' + fc + '\" style=\"width:' + S.fatigue + '%\"><\/i><\/div><span class=\"v\">' + Math.round(S.fatigue) + '<\/span><\/div>';\n  out += '<div class=\"strbox\"><div><small class=\"hint\">本队实力（含养成加成）<\/small><div class=\"big\">' + f1(ou.all) + '<\/div><\/div><div class=\"hint\">基础 ' + f1(ou.base) + '<br>养成加成 <b class=\"' + clsd(b.A + b.D + b.G * 2) + '\">' + sg((b.A + b.D) / 2 + b.G) + '<\/b><\/div><\/div>';\n  out += '<\/section>';\n  out += '<section cl
