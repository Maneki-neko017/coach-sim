6' }\n  },\n  ucl: { dates: ['2026-09-09', '2026-10-13', '2026-10-20', '2026-11-03', '2026-11-25', '2026-12-09', '2027-01-19', '2027-01-27'] },\n  cups: [\n    { id: 'SUP', name: '西超杯', rounds: [\n      { st: 'sf', name: '半决赛', date: '2027-02-02', opp: 'BAR', neutral: true, venue: '伊斯坦布尔 沙拉卓卢球场' },\n      { st: 'f', name: '决赛', date: '2027-02-06', neutral: true, venue: '伊斯坦布尔 拉姆斯公园球场', final: true, pool: [['RMA', 4], ['RSO', 1]] }] },\n    { id: 'CDR', name: '国王杯', rounds: [\n      { st: 'r32', name: '32 强', date: '2026-12-16', topWeight: .5, lowerWeight: 2.5 },\n      { st: 'r16', name: '16 强', date: '2027-01-06', topWeight: 1.5, lowerWeight: 1.2 },\n      { st: 'qf', name: '八强战', date: '2027-01-13', topWeight: 3, lowerWeight: .6 },\n      { st: 'sf', name: '半决赛', dates: ['2027-02-10', '2027-03-03'], topWeight: 6, lowerWeight: .3 },\n      { st: 'f', name: '决赛', date: '2027-04-24', neutral: true, venue: '塞维利亚 拉卡尔图哈球场', final: true, topWeight: 10, lowerWeight: .2 }] }\n  ],\n  rivals: ['RMA', 'BAR'],\n  intro: '2011 年 12 月，你从球员变成了这支球队的主教练，一待就是十五个赛季。两个联赛冠军，三个欧联杯，两次倒在欧冠决赛，对手都是同一个邻居。更衣室门上还是那句话：一场一场来。\\n\\n新赛季，董事会没有给你新援，也没有给你新的承诺，只给了你一张周历。每个周一，你可以看数值、找球员聊聊，然后把这一周的训练一格一格排满。剩下的，交给周末。',\n\n  /* 关键球员：养成的主要对象。tags 决定谈话效果；aff 好感初值；ego 傲气初值 */\n  keyPlayers: [\n    { id: AL, tags: ['hot', 'star'], aff: 40, ego: 55, role: '前锋 · 头号进攻点', blurb: '脾气和脚头一样硬。吃表扬也吃激将，傲气一高就容易失控。',\n      talk: { criticize: { good: ['{p}瞪着你，半天吐出一句：“行，我知道了。”下午的训练里他进了三个球。'], bad: ['{p}把水瓶摔在地上：“我进了那么多球，你还要我怎样？”'] }, encourage: { bad: ['{p}笑着说：“教练，这个我自己知道。”'] } } },\n    { id: KO, tags: ['veteran', 'calm', 'leader'], aff: 60, ego: 25, role: '中场 · 队长', blurb: '球队史上出场最多的人，更衣室的锚。比起表扬，他更喜欢被当成同事。',\n      talk: { consult: { good: ['{p}想了一会儿：“教练，边路那几个孩子需要有人带，我来。”'] }, heart: { good: ['你们聊起了十几年前的第一场比赛。“那时候我连球鞋都没钱买。”{p}笑着说。'] } } },\n    { id: OB, tags: ['calm', 'perfectionist'], aff: 50, ego: 30, role: '门将 · 最后一道防线', blurb: '丢一个球能在门前多练两个小时的人。需要的是被信任，不是被安慰。',\n      talk: { focus: { good: ['{p}只说了两个字：“明白。”然后一整周没再丢过球。'] } } },\n    { id: BA, tags: ['sensitive', 'young'], aff: 45, ego: 35, role: '中场 · 年轻核心', blurb: '才华满溢，也容易多想。被吼一句，能琢磨一整晚。',\n      talk: { criticize: { bad: ['{p}低着头，很久才说：“教练，我是不是不行？”'] }, heart: { good: ['{p}说起刚到马德里时一个人在公寓里吃泡面的夜晚，眼圈有点红。'] } } },\n    { id: GI, tags: ['young', 'pressure'], aff: 55, ego: 35, role: '边路 · 教练的儿子', blurb: '“教练的儿子”这个标签，他从来没有摘下来过。比所有人跑得多，也比所有人更怕出错。',\n      talk: { heart: { good: ['{p}说：“我不想让人觉得我是靠你才站在这里的。”你没有回答，只是拍了拍他的肩。'] } } },\n    { id: GR, tags: ['veteran', 'hot'], aff: 50, ego: 45, role: '后卫 · 边路发动机', blurb: '左脚是武器，嘴巴也是。训练场上的气氛担当，也是最容易冲动的人。',\n      talk: { encourage: { good: ['{p}大笑：“教练你再这么说，我今天还能再多跑十公里！”'] } } }\n  ],\n\n  /* 事件。week 指定则必在该周出现；force 条件满足必出；其余按权重随机。who: 球员ID 或 'random' */\n  events: [\n    { id: 'goal', week: 0, cat: '董事会', t: '赛季开始前，CEO 在办公室里问你：“今年的目标是什么？”窗外训练场上，球员们正在热身。', o: [\n      { t: '稳稳地进欧冠，这是底线', tip: '董事会更宽容，奖励较小', fx: { goal: 'safe', board: 3 }, r: '“很务实。”CEO 点点头，在文件上签了字。' },\n      { t: '争一争联赛冠军', tip: '期望更高，成功的回报也更高', fx: { goal: 'push', fans: 3, morale: 2 }, r: '“我们等这一天很久了。”CEO 说。球迷论坛里一夜之间多了几千条评论。' },\n      { t: '三线都要拿，大耳朵杯也不放过', tip: '压力最大，容错最低', fx: { goal: 'dream', morale: 4, board: -4 }, r: '会议室里安静了五秒，然后所有人都笑了。你没笑。' }] },\n    { id: 'winter', win: [17, 21], cat: '冬训营', t: '圣诞前后，球队难得有几天空档。助教建议去南部搞一次冬训营，你只能选一个重点。', o: [\n      { t: '把防守体系再磨一遍', fx: { def: 6, fatigue: 6 }, r: '三十米区域，现在可以闭着眼站出来。' },\n      { t: '把进攻套路练熟', fx: { atk: 6, fatigue: 6 }, r: '边路的传中和中路的跑位，终于对上了。' },\n      { t: '体能储备，赛季下半程靠它', fx: { cond: 6, fatigue: 10 }, r: '最后一周的拉练让所有人都骂了你，但没人掉队。' },\n      { t: '什么都不练，全队休整、吃饭', fx: { unity: 6, morale: 6, fatigue: -18 }, r: '烤肉店里，罗梅罗和格里马尔多抢着买单。' }] },\n    { id: 'window', win: [22, 26], cat: '转会窗', t: '一月的转会窗口快关了，董事会问你要不要补强。预算有限，但他们愿意听。', o: [\n      { t: '“不需要，现有的人就够了。”', fx: { unity: 3, morale: 2, board: 1 }, r: '你说得很平静。更衣室里有人听见了，晚上多了几声笑。' },\n      { t: '“给我一个最缺位置的替补。”', fx: { funds: -16, atk: 2, def: 2, board: -1 }, r: '新的替补当天晚上到队，虽然只能站在板凳上，但教练组松了口气。' },\n      { t: '“把钱留着，夏天再说。”', fx: { funds: 16, board: 2 }, r: 'CEO 露出了难得的笑容。' }] },\n    { id: 'derby_eve', cat: '德比', force: true, once: true, when: function (c) { return soon(c, 'RMA', 6) && c.S.week >= 2; }, t: '本周末是马德里德比。记者们在训练场外挤成一团，等你说点什么。更衣室里，球员们也在等。', o: [\n      { t: '“一场一场来。”', fx: { morale: 2 }, r: '你说了十几年的话。今天更衣室里每个人都重复了一遍。' },\n      { t: '让老兵给年轻人讲讲德比', fx: { unity: 3, chem: 2, p: { mood: 4 } }, r: '科克站起来讲了五分钟。结束时，没有人说话，但也没有人看手机。', },\n      { t: '什么都不说，让他们自己想', fx: { morale: -1, atk: 2, def: 2 }, r: '训练场上，除了脚步声和喘气声，什么也没有。' }] },\n    { id: 'derby_win', cat: '德比', w: 3, when: function (c) { return c.last && c.last.opp === 'RMA' && c.last.out === 'W' && c.last.cn === '西甲'; }, t: '赢下德比之后，几个年轻球员在更衣室里放起了歌，老球员们围着球场边走边唱。', o: [\n      { t: '一起唱', fx: { morale: 4, fans: 3, unity: 3 }, r: '视频被球员发上社交媒体，评论区一半是床垫军团的泪水。' },\n      { t: '“明天训练，八点。”', fx: { board: 1, atk: 1, def: 1 }, r: '歌停了，但没人觉得扫兴。' }] },\n    { id: 'derby_loss', cat: '德比', w: 3, when: function (c) { return c.last && c.last.opp === 'RMA' && c.last.out === 'L'; }, t: '输给皇马之后，有记者翻出 2014 年的往事，问你：每次面对他们，是不是都差一口气？', o: [\n      { t: '“我只记得下一场。”', fx: { morale: 1, fans: 1 }, r: '同一句话，你说了十几年。' },\n      { t: '沉默地看了他一眼', fx: { fans: 3, morale: -1 }, r: '那条新闻最后没有发出来。' }] },\n    { id: 'crisis', cat: '危机', force: true, cd: 8, when: function (c) { return c.lossStreak >= 3; }, t: '球队已经连续三场没赢。更衣室里有人开始互相指责，球迷论坛也出现了“西蒙尼下课”的帖子。', o: [\n      { t: '开一次全队会，所有人都要说话', fx: { unity: 4, morale: 3, fatigue: 4 }, r: '会开了两个小时。有人哭，有人拍桌子，最后所有人一起喊了口号。' },\n      { t: '给全队放一天假', fx: { morale: 4, fatigue: -10, board: -1 }, r: '董事会不太满意，但球员们回来的时候像换了一批人。' },\n      { t: '加练，罚站，让他们记住', fx: { def: 3, atk: 2, morale: -4, fatigue: 8, key: { mood: -3 } }, r: '训练场的灯亮到了十点。有人在回家的路上摔了手机。' }] },\n    { id: 'board_talk', cat: '董事会', force: true, once: true, when: function (c) { return c.S.board < 32 && c.S.week >= 8; }, t: 'CEO 把你叫到办公室，桌上放着一份文件。“我们需要谈谈这个赛季了。”', o: [\n      { t: '“给我三个星期。”', fx: { board: 5, morale: -2 }, r: 'CEO 看着你很久，点了点头。“三个星期。”' },\n      { t: '“你们挑的人，你们说了算。”', fx: { board: -3, fans: 2 }, r: '这句话传出去之后，球迷论坛转了三天。' },\n      { t: '拿出一份赛季回顾报告', fx: { board: 3, funds: -8 }, r: '报告翻了三页，CEO 的表情缓和了一点。' }] },\n    { id: 'unity_party', cat: '更衣室', w: 2, when: function (c) { return c.S.attrs.unity > 60; }, t: '团结指数很高。今天训练结束后，几个年轻球员自发在更衣室里搞了一场“烤肉大会”，他们问你来不来。', o: [\n      { t: '去，当然去', fx: { unity: 3, morale: 3, key: { mood: 2 } }, r: '你坐在角落吃了半个小时，没人提战术。' },\n      { t: '让他们自己玩，你在办公室看录像', fx: { atk: 1, def: 1 }, r: '你关了门，听着楼下的笑声，反而更专心。' }] },\n    { id: 'a_son', cat: '球员', who: GI, w: 2, once: true, t: '记者在发布会上问：{p}是你的儿子，他今天首发或者没首发，有人会说是因为这个。你怎么回答？', o: [\n      { t: '“在训练场上，他是队里最后一个吃饭的。”', fx: { morale: 2, board: 1, p: { mood: 3, aff: 3 } }, r: '队友们笑了一整天，{p}说自己没得选。' },\n      { t: '“他踢得好，就这么简单。”', fx: { p: { form: 1 }, fans: 1 }, r: '这句话你说了十年，每次都一样平静。' },\n      { t: '“你们去问他的教练。”', fx: { fans: 3, p: { mood: 2 } }, r: '记者愣了一下，才反应过来你就是他的教练。' }] },\n    { id: 'a_koke', cat: '球员', who: KO, w: 2, t: '{p}是球队史上出场最多的人。今天训练，几个小将围着他问：“这么多年，你是怎么不累的？”', o: [\n      { t: '让他给年轻人讲讲', fx: { morale: 2, unity: 2, p: { form: 1, aff: 3 } }, r: '{p}讲了半小时，最后一句是：“累，但是不能说。”' },\n      { t: '让他轮休一场', fx: { p: { fit: 8, mood: 2 } }, r: '{p}嘴上说不需要，晚上睡了十个小时。' }] },\n    { id: 'a_alvarez', cat: '球员', who: AL, w: 2, t: '{p}在训练里被你要求回撤到中场线抢球，他一边跑一边回头看你，像是在确认自己没有听错。', o: [\n      { t: '“你就是第一个后卫。”', fx: { def: 1.5, p: { mood: -2, aff: -1 } }, r: '{p}点点头，又跑了回去。球队的压迫更凶了。' },\n      { t: '给他自由，让他留在前面', fx: { p: { form: 1.5, mood: 3, ego: 3 } }, r: '{p}松了一口气，下一次训练多进了两个球。' }] },\n    { id: 'a_ego', cat: '球员', who: AL, force: true, cd: 10, when: function (c) { return c.S.pl[AL].ego > 70; }, t: '{p}最近在社交媒体上的言论越来越多，队友们开始私下抱怨他“只想着自己进球”。', o: [\n      { t: '单独谈一次，压一压他', fx: { p: { ego: -14, mood: -3, form: .5 }, unity: 2 }, r: '{p}被说得有点不服气，但第二天训练里他多回防了三次。' },\n      { t: '公开表扬他，同时点名要求团队', fx: { p: { ego: -6, mood: 3 }, unity: 1, morale: 1 }, r: '一句话说得所有人都听明白了。' },\n      { t: '装作没看见', fx: { p: { ego: 4 }, unity: -4, key: { mood: -1 } }, r: '更衣室里的空气有点微妙。' }] },\n    { id: 'a_oblak', cat: '球员', who: OB, w: 2, t: '训练后，{p}一个人留在球门前扑了很久的球。你走过去问怎么了，他说：“今天丢了一个球，我还要想想。”', o: [\n      { t: '陪他练到天黑', fx: { p: { form: 1.5, aff: 4 }, fatigue: 2, def: 1 }, r: '你们谁都没说话，但第二天他比赛里一脚没漏。' },\n      { t: '告诉他：“门将也会丢球。”', fx: { p: { form: .5, mood: 2 } }, r: '{p}点点头，转头继续练。' }] },\n    { id: 'a_grimaldo', cat: '球员', who: GR, w: 2, t: '{p}在训练里连续用任意球打进了三个，门将气得把手套扔在了地上。', o: [\n      { t: '“比赛里就这么踢。”', fx: { p: { form: 1.5, mood: 2, ego: 3 }, morale: 1 }, r: '队友们围过来喊他“左脚大师”。' },\n      { t: '让他专心防守', fx: { board: 1, def: 1, p: { mood: -1 } }, r: '{p}耸耸肩：“边后卫也要有点自己的生活。”' }] },\n    { id: 'a_barrios', cat: '球员', who: BA, w: 2, t: '{p}在训练里被你吼了一句，之后一整天都没有说话。晚上你收到他发来的消息：“教练，我今天哪里没做好？”', o: [\n      { t: '回复：“明天我给你看录像。”', fx: { p: { form: 1.5, aff: 5, mood: 3 } }, r: '第二天他提前一个小时到了训练场。' },\n      { t: '不回复，等他自己想明白', fx: { p: { form: .5, mood: -3, aff: -2 } }, r: '第二天训练，他踢得比谁都狠，但没跟你说话。' }] },\n    { id: 'a_lisbon', cat: '教练', w: 1, once: true, when: function (c) { return c.S.week >= 14; }, t: '深夜，你在办公室翻看旧录像，看到了 2014 年里斯本补时阶段的那一幕。门口传来敲门声，是科克。', o: [\n      { t: '请他进来，一起看完', fx: { unity: 3, morale: 2, p: { aff: 4 } }, r: '你们谁也没说话。结束的时候，他说：“教练，我们还有下一场。”' },\n      { t: '合上电脑，说“早点回去睡”', fx: { morale: 1 }, r: '你关了灯，走廊里的光比平时亮。' }] },\n    { id: 'a_sprint', cat: '教练', w: 2, when: function (c) { return c.last && c.last.out === 'W'; }, t: '终场哨响，你冲出技术区，沿着边线一路跑到了看台下面，第四官员追着你跑了二十米。', o: [\n      { t: '“我只是想和球迷待在一起。”', fx: { fans: 3, morale: 2 }, r: '这段视频成了本周最受欢迎的短视频。' },\n      { t: '向第四官员道歉', fx: { board: 1, fans: 1 }, r: '他接受了道歉，但表情仍然很复杂。' }] },\n    { id: 'press_trap', cat: '媒体', w: 2, t: '一个记者问你：“很多人说，你的足球过时了，你怎么看？”会场安静了下来。', o: [\n      { t: '“你们每年都这么说。”', fx: { fans: 3, board: -1 }, r: '球迷论坛立刻开了个新帖：#我们的足球#。' },\n      { t: '笑笑，什么都不说', fx: { board: 1, morale: 1 }, r: '记者追问了三遍，你只是点了点头。' },\n      { t: '“你来训练场看看吧。”', fx: { fans: 1, unity: 1 }, r: '第二天，那个记者真的来了，站在场边被淋了一身水。' }] },\n    { id: 'young_star', cat: '球员', who: BA, w: 2, when: function (c) { return c.S.pl[BA].form > .6; }, t: '{p}最近状态火热，欧洲的几家豪门开始公开表达兴趣，经纪人也联系了俱乐部。', o: [\n      { t: '把他叫来，直接说清楚规划', fx: { p: { aff: 5, mood: 3, ego: 2 }, board: 1 }, r: '{p}听完点头：“教练，我愿意留在这里。”' },\n      { t: '什么都不说，让他自己做决定', fx: { p: { mood: -2, aff: -3, ego: 4 }, unity: -1 }, r: '他踢了几场球，状态忽高忽低。' }] },\n    { id: 'injury_crisis', cat: '医疗', w: 2, when: function (c) { return c.S.fatigue > 65; }, t: '队医敲门，神色严肃：“教练，最近的伤病报告看起来不太对，大家的身体在报警。”', o: [\n      { t: '这周全队轻练，优先恢复', fx: { fatigue: -14, morale: 1, board: -1 }, r: '队医松了一口气，小声说了句“谢谢”。' },\n      { t: '硬撑过去，赛季不等人', fx: { fatigue: 4, def: 1, unity: -1 }, r: '你拍了拍他的肩：“再坚持两周。”' }] },\n    { id: 'captain_speech', cat: '更衣室', who: KO, w: 1, when: function (c) { return c.S.attrs.morale < 45; }, t: '士气不高。赛后更衣室里，{p}突然站起来，对全队说了几句话。', o: [\n      { t: '让他说完，你什么也不加', fx: { morale: 6, unity: 3, p: { aff: 3 } }, r: '没有人记得他具体说了什么，但所有人都记得那天晚上的灯光。' },\n      { t: '补充一句：“我们还没输。”', fx: { morale: 4, unity: 2 }, r: '这句话在更衣室里回响了一整晚。' }] },\n    { id: 'fan_banner', cat: '球迷', w: 2, t: '赛前，南看台升起一条巨大的横幅：“我们不要被理解，只要被坚持。”', o: [\n      { t: '赛后走到看台，向他们鞠躬', fx: { fans: 4, morale: 2 }, r: '球场的灯一盏盏熄灭，但看台上没有人愿意离开。' },\n      { t: '低头走进球员通道', fx: { fans: 1 }, r: '你什么也没说，但手心是湿的。' }] },\n    { id: 'assistant_idea', cat: '教练组', w: 2, t: '助教拿着笔记本找你：“教练，我有一个新训练想法，但可能需要多花一点时间。”', o: [\n      { t: '听听他的想法，试一次', fx: { atk: 2, chem: 2, fatigue: 3 }, r: '训练课结束，球员们说“这个很新鲜”。助教脸上写满了得意。' },\n      { t: '让他先和队医对一遍', fx: { chem: 1, unity: 1 }, r: '助教有点失望，但第二天他拿来了更完整的版本。' }] },\n    { id: 'dressing_spat', cat: '更衣室', who: 'random', w: 2, when: function (c) { return c.S.attrs.unity < 52 || c.lossStreak >= 2; }, t: '训练中，{p}和一名队友因为一次抢断起了冲突，两个人被队友拉开。更衣室里的空气像是凝固了。', o: [\n      { t: '把两人叫到办公室，当面说开', fx: { unity: 3, fatigue: 2, p: { aff: 2 } }, r: '十分钟后，两个人一起出来，谁也不看谁，但一起去吃了饭。' },\n      { t: '各打五十大板，罚跑', fx: { unity: -1, def: 1, fatigue: 6 }, r: '队友们安静地看着他们跑。从那天起，没人再提这件事。' },\n      { t: '当作没发生', fx: { unity: -4, morale: -2 }, r: '气氛一直没有真正缓和。' }] },\n    { id: 'mattress', cat: '球迷', w: 1, once: true, t: '一家小型媒体问：“床垫军团”这个称呼，你个人喜欢吗？', o: [\n      { t: '“床垫很舒服，能睡个好觉。”', fx: { fans: 3, morale: 1 }, r: '这句话三天后变成了T恤。' },\n      { t: '“我更喜欢叫它们球队。”', fx: { board: 1, fans: 1 }, r: '记者低头记下，没有再追问。' }] },\n    { id: 'weather', cat: '日常', w: 1, t: '马德里下了一周的大雨，训练场积水能没过脚踝。助教问你要不要把课改到室内。', o: [\n      { t: '照常训练，雨天才有马竞味', fx: { def: 2, unity: 2, fatigue: 4, morale: 1 }, r: '所有人都回家感冒了，但没有一个人缺席第二天的训练。' },\n      { t: '改到室内做体能和录像', fx: { cond: 1.5, atk: 1, fatigue: -2 }, r: '这周很安静。' }] },\n    { id: 'intl_break', cat: '国家队', who: 'random', w: 1, when: function (c) { return [3, 7, 11, 19, 31].indexOf(c.S.week) >= 0; }, t: '国际比赛日，{p}代表国家队踢了全场，回来时脸上写着“没睡好”。', o: [\n      { t: '让他休息一天', fx: { p: { fit: 8, mood: 2 } }, r: '{p}睡了一整天，醒来先问有没有吃的。' },\n      { t: '“明天正常训练。”', fx: { p: { form: 1 }, fatigue: 3 }, r: '{p}什么也没说，第二天依旧很拼。' }] },\n    { id: 'benched_player', cat: '球员', who: 'random', w: 2, when: function (c) { return c.S.pl && c.S.key.some(function (id) { return c.S.pl[id].mood < 42; }); }, t: '{p}最近情绪低落，训练也不太积极。队友们私下议论，你看在眼里。', o: [\n      { t: '约他单独聊一聊', fx: { p: { mood: 8, aff: 4 } }, r: '{p}说：“教练，我只是想知道自己在你的计划里。”' },\n      { t: '让他自己消化', fx: { p: { mood: 2, aff: -2 } }, r: '几天后他自己好起来了，但看你的眼神变了。' }] },\n    { id: 'owner_visit', cat: '董事会', w: 1, once: true, when: function (c) { return c.S.board > 50 && c.S.week >= 10; }, t: '俱乐部主席来看了一次训练，站在场边一言不发。结束后，他走过来拍了拍你的肩。', o: [\n      { t: '请他到办公室谈', fx: { board: 3, funds: 8 }, r: '他在你的办公室里坐了二十分钟，走的时候留下一句“继续”。' },\n      { t: '“谢谢，下周我们还有比赛。”', fx: { board: 1, morale: 1 }, r: '他笑了笑，转身走了。' }] },\n    { id: 'night_walk', cat: '教练', w: 1, when: function (c) { return c.S.week >= 5; }, t: '深夜你在空无一人的大都会球场走了一圈。保安认出了你，什么也没说，只是把灯又多开了几盏。', o: [\n      { t: '在草皮上坐一会儿', fx: { morale: 1, fatigue: -3 }, r: '你坐了二十分钟，什么也没想。第二天，你感觉自己年轻了一点。' },\n      { t: '回办公室继续看录像', fx: { atk: 1, def: 1, fatigue: 2 }, r: '凌晨三点你关了电脑，在笔记本上写了一页字。' }] },\n    /* ---- 以下是随机事件：每周按概率抽取，14 周内不重复；带“结果不确定”的选项会掷骰子 ---- */\n    { id: 'sponsor', cat: '赞助商', w: 2, t: '一家新赞助商想让你亲自出镜拍一条广告，开价不低，时间要占掉半天训练。', o: [\n      { t: '拍，钱是真的', tip: '收入 +，但会累', roll: { p: .7, ok: { fx: { funds: 22, fans: 1, fatigue: 3 }, r: '拍摄很顺利。你全程一个表情，导演说这正好是广告需要的。' }, fail: { fx: { funds: 10, fans: -2, fatigue: 5 }, r: '你把台词说成了“一场一场来”，广告被剪了三遍才勉强能用。' } } },\n      { t: '推掉，训练要紧', fx: { atk: 1, def: 1 }, r: '你让助教回了一封礼貌的邮件。赞助商说下次再约。' }] },\n    { id: 'youth_call', cat: '青训', w: 2, t: '青年队一名 19 岁的中场球员连续几场表现抢眼，青训总监来问：“能不能让他跟一线队训练几天？”', o: [\n      { t: '让他来，看看成色', tip: '有概率给球队带来活力', roll: { p: .6, ok: { fx: { morale: 3, chem: 2, fatigue: -3, board: 1 }, r: '小伙子跑得比谁都欢，老队员们都说“像看到了十年前的自己”。' }, fail: { fx: { morale: -1, unity: -1 }, r: '他在对抗里被几位老队员撞得很惨，当天晚上就回了青年队。' } } },\n      { t: '再等等，别揠苗助长', fx: { board: 1, unity: 1 }, r: '青训总监点点头：“您总是这么稳。”' }] },\n    { id: 'agent_call', cat: '球员', who: 'random', w: 2, t: '{p}的经纪人在媒体上放话，说“有几家俱乐部很感兴趣”。球员本人对此没有表态。', o: [\n      { t: '把球员叫来，问他怎么想', fx: { p: { aff: 4, mood: 2 }, board: -1 }, r: '{p}说：“教练，我只想踢球。”你让他早点回去休息。' },\n      { t: '直接对媒体说“他不卖”', fx: { fans: 3, board: 1, p: { ego: 5 } }, r: '球迷论坛一片叫好，{p}的脸上有点不好意思。' },\n      { t: '装作没看到', fx: { p: { mood: -2, aff: -1 } }, r: '谣言又飘了几天，然后被另一条新闻盖了过去。' }] },\n    { id: 'ref_row', cat: '媒体', w: 2, when: function (c) { return c.last && c.last.out === 'L'; }, t: '输球之后，有记者问你对裁判判罚的看法。你的助教在桌子底下悄悄递给你一张纸条：“别说话。”', o: [\n      { t: '照着纸条，什么都不说', fx: { board: 1, morale: 1 }, r: '记者追问两遍，你都只点头。这条新闻没有发酵。' },\n      { t: '“我们没有输给裁判。”', fx: { fans: 2, board: 1, morale: 1 }, r: '这句话在球迷论坛里被转了几千次。' },\n      { t: '“有些判罚，我看不懂。”', fx: { fans: 4, board: -3, morale: 2 }, r: '足协的邮件第二天就到了。球迷却很满意。' }] },\n    { id: 'rival_trash', cat: '对手', w: 1, when: function (c) { return soon(c, 'RMA', 14) || soon(c, 'BAR', 14); }, t: '对手教练在发布会上暗示：“某些球队只会防守。”记者把这句话原封不动地转给了你。', o: [\n      { t: '“他说得对，我们防守得很好。”', fx: { fans: 3, morale: 2, def: 1 }, r: '这句话被印在了第二天的小报头条上，更衣室里传阅了好几遍。' },\n      { t: '“我不评论别人的足球。”', fx: { board: 1 }, r: '你平静地结束了采访。晚上，助教说你太克制了。' }] },\n    { id: 'charity', cat: '俱乐部', w: 1, t: '俱乐部邀请球队去儿童医院做一次探访。半天时间，没有训练，也没有摄像机。', o: [\n      { t: '全队一起去', fx: { unity: 3, morale: 3, fans: 3, fatigue: -4 }, r: '回程的大巴里很安静。没人拿手机出来拍，只是都在看窗外。' },\n      { t: '派几个代表，其他人训练', fx: { fans: 1, atk: 1, def: 1 }, r: '代表们回来说孩子们问了很多关于“你们教练为什么总是不笑”的问题。' }] },\n    { id: 'late_arrival', cat: '球员', who: 'random', w: 2, t: '训练开始五分钟了，{p}还没有出现。队友们互相看了看，没有人说话。', o: [\n      { t: '等他，不扣分', fx: { p: { aff: 3, mood: 2, ego: 4 }, unity: -1 }, r: '{p}满头大汗地跑进来，道歉的话说了三遍。' },\n      { t: '罚他加练，规矩就是规矩', fx: { p: { ego: -6, mood: -3, aff: -2 }, unity: 2 }, r: '{p}被罚了两圈，那天没人再迟到。' },\n      { t: '把他叫到办公室，问出了什么事', roll: { p: .55, ok: { fx: { p: { aff: 6, mood: 4 }, unity: 1 }, r: '{p}家里有点事。你让他先回去处理，他走时的眼神变了。' }, fail: { fx: { p: { aff: -2, mood: -3 }, unity: -1 }, r: '{p}什么也没说。你们沉默了很久。' } } }] },\n    { id: 'legend_visit', cat: '俱乐部', w: 1, once: true, when: function (c) { return c.S.week >= 6; }, t: '一位球队传奇来训练场看望大家，他在场边看了整整一场对抗赛，什么都没说，最后只是笑了笑。', o: [\n      { t: '请他给大家讲几句', fx: { morale: 4, unity: 3, key: { mood: 2 } }, r: '他讲了半个小时，讲到最后一句话时，全队都站了起来。' },\n      { t: '请他单独指点一名球员', fx: { p: { form: 1, aff: 3 } }, r: '你们在场边聊了很久。' }] },\n    { id: 'tactics_leak', cat: '媒体', w: 1, when: function (c) { return c.S.attrs.def > 55; }, t: '训练场外有人拍到了你们的战术演练，视频在网上流传。助教紧张地跑来问：“教练，要不要追查？”', o: [\n      { t: '追查，修个围墙', tip: '花钱，但防止泄露', fx: { funds: -10, board: 1 }, r: '一周后训练场周围多了三米高的围板。有球员说：“像是在拍电影。”' },\n      { t: '不管，他们看得懂吗？', fx: { fans: 1, def: 1 }, r: '你对着镜头的方向挥了挥手。视频后来被删了。' }] },\n    { id: 'diet', cat: '医疗', w: 1, t: '营养师提交报告：球员们最近的饮食越来越随意，建议统一管理，但需要球员们配合。', o: [\n      { t: '全队统一食谱', fx: { cond: 2, unity: -1, morale: -1, fatigue: -4 }, r: '食堂里多了一堆蒸菜，几个球员偷偷点了外卖。' },\n      { t: '让营养师给每人单独方案', fx: { funds: -8, cond: 1.5, morale: 1, fatigue: -3 }, r: '花了一些钱，但没有人抱怨。' },\n      { t: '不管，成年人自己负责', fx: { morale: 1, fatigue: 3 }, r: '周三的更衣室里飘出了烧烤味。' }] },\n    { id: 'bus_break', cat: '日常', w: 1, t: '客场比赛归程中，球队大巴在高速上抛锚。全队站在路边等了两个小时。', o: [\n      { t: '带着大家在路边玩球', fx: { unity: 4, morale: 2, fatigue: 2 }, r: '没人知道谁先开始的，总之一群职业球员在高速路边踢起了五人制。' },\n      { t: '让所有人在车里休息', fx: { fatigue: -3 }, r: '你把外套披在最年轻的球员身上，自己站在车外。' }] },\n    { id: 'prank', cat: '更衣室', who: 'random', w: 2, t: '{p}把一只橡皮鸭放进了助教的战术包里。助教打开包的时候，更衣室里安静了三秒，然后爆发出一阵大笑。', o: [\n      { t: '假装没看见，笑着走出去', fx: { unity: 3, morale: 2, p: { aff: 2 } }, r: '你在走廊里笑了一会儿才回到办公室。' },\n      { t: '“明天训练，每人加一圈。”', fx: { unity: 1, def: 1, fatigue: 3 }, r: '没人抱怨。第二天，那只鸭子被摆在了更衣室的架子上。' }] },\n    { id: 'language', cat: '更衣室', w: 1, t: '一位新来的小将还不太会说西班牙语，在训练里几次因为沟通不畅造成失误，有点沮丧。', o: [\n      { t: '安排老队员带他', fx: { unity: 3, chem: 2, p: { mood: 0 } }, r: '科克每天带他吃午饭，两周后他已经会用西语骂裁判了。' },\n      { t: '请语言老师，每天课后上课', fx: { funds: -6, chem: 2, morale: 1 }, r: '语言老师在训练场边的小黑板上写满了拼音。' }] },\n    { id: 'doc_warn', cat: '医疗', w: 2, when: function (c) { return c.S.fatigue > 50; }, t: '队医拿着一份报告来找你：“教练，有三个人的肌肉负荷已经到临界值。”', o: [\n      { t: '听队医的，立刻减量', fx: { fatigue: -10, atk: -.5 }, r: '你把周三的重练改成了泳池恢复。' },\n      { t: '再坚持一场，之后补', tip: '有风险', roll: { p: .5, ok: { fx: { fatigue: 2, def: 1 }, r: '你赌对了。队医看着你，脸上没有表情。' }, fail: { fx: { fatigue: 5, p: { inj: 3 } }, r: '有人在训练里拉伤了，队医什么都没说，只是把报告又递了一次。' } } }] },\n    { id: 'captain_bday', cat: '球员', who: KO, w: 1, t: '今天是{p}的生日。更衣室里有人偷偷订了蛋糕，但他一直装作没发现。', o: [\n      { t: '带头唱生日歌', fx: { morale: 3, unity: 3, p: { aff: 4, mood: 4 } }, r: '你唱得很难听，但没人敢笑。' },\n      { t: '“训练结束后再说。”', fx: { atk: 1, p: { aff: 1 } }, r: '训练一结束，蛋糕就被端了出来，所有人早已站好位置。' }] },\n    { id: 'gk_coach', cat: '教练组', w: 1, t: '门将教练来找你：“教练，我想试试给他们加一套新的出击训练。”', o: [\n      { t: '同意，试一个月', fx: { def: 2, fatigue: 2 }, r: '门前的出击更果断了。一个月后，对手的传中少了。' },\n      { t: '“现在这套就够了。”', fx: { board: 1 }, r: '门将教练点点头，带着笔记本回去了。' }] },\n    { id: 'fan_letter', cat: '球迷', w: 1, t: '一位十岁的球迷写来一封信，说他想当球员，但他个子太小。信封里夹着一张他自己画的你。', o: [\n      { t: '回信，并寄去一件训练服', fx: { fans: 2, morale: 1 }, r: '一个月后，他寄回了一张照片：训练服被他穿得过长，袖子卷了三圈。' },\n      { t: '贴在办公室墙上', fx: { morale: 1 }, r: '你每天进门都会看到那幅画。' }] },\n    { id: 'cold_snap', cat: '日常', w: 1, t: '马德里突然降温，训练场的草皮结了薄霜，球员们裹着外套在场边活动。', o: [\n      { t: '改成室内力量训练', fx: { cond: 2, fatigue: 2 }, r: '体能教练笑得很开心：“终于可以练核心了。”' },\n      { t: '照常训练，穿厚点', fx: { unity: 2, morale: 1, fatigue: 3 }, r: '你看着自己呼出的白气，想起了十五年前第一次站在这里。' }] },\n    { id: 'old_boot', cat: '教练', w: 1, once: true, when: function (c) { return c.S.week >= 12; }, t: '你在办公室的抽屉里找到了一双旧球鞋，是你自己踢球时穿的。鞋底已经磨得很薄。', o: [\n      { t: '带到更衣室，放在显眼的地方', fx: { morale: 3, unity: 2 }, r: '鞋被摆在了更衣室的入口。球员们进门都会多看它一眼。' },\n      { t: '放回抽屉', fx: { morale: 1 }, r: '你关上抽屉，笑了笑。' }] },\n    { id: 'surprise_test', cat: '教练组', w: 1, t: '体能教练提出一个想法：搞一次突击体测，让球员们“知道自己真实的状态”。', o: [\n      { t: '搞，当场公布成绩', roll: { p: .6, ok: { fx: { cond: 3, morale: 1, unity: 1 }, r: '全队咬着牙跑完。有人第一次发现自己比队友强，有人第一次发现不是。' }, fail: { fx: { cond: 1, morale: -3, unity: -2 }, r: '结果公布后，更衣室里传出了几声叹息。' } } },\n      { t: '不公布，只给个人反馈', fx: { cond: 1.5, morale: 1 }, r: '体能教练一个一个把球员叫到办公室。' }] },\n\n    /* ================= 专属线：好感触发的个人剧情（v1.6） =================\n       高好感线 3 段（好感达标 + 间隔数周才会出现）；低好感线 2 段（好感太低才会出现，有补救机会）。\n       flag 记录发生的周数，下一段靠它排先后。 */\n\n    /* ---- 朱利亚诺 · 教练的儿子 ---- */\n    { id: 'gi_h1', cat: '专属线 · 朱利亚诺', who: GI, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, GI) >= 62 && !done(c, 'gi_l1'); }, t: '训练结束，大家都走了，{p}一个人留在场边，把一只球在脚下停了很久。你走过去，他才开口：“教练，我一直想问……你对我的要求，是不是比对别人多一些？”', o: [\n      { t: '“是。因为你比谁都能跑，我知道你扛得住。”', fx: { p: { aff: 6, mood: 4, form: .5 }, flag: 'gi1' }, r: '{p}愣了一下，然后低头笑了：“那我就多跑一点。”' },\n      { t: '“没有。在这里，你就是一个球员。”', fx: { p: { aff: 5, mood: 3, ego: -2 }, unity: 1, flag: 'gi1' }, r: '{p}点点头，眼神里有什么东西松开了。' },\n      { t: '“回家再说。”', roll: { p: .6, ok: { fx: { p: { aff: 8, mood: 5 }, flag: 'gi1' }, r: '那天晚上你们聊了很久，没有一句和战术有关。第二天训练，{p}把外套披在了你肩上。' }, fail: { fx: { p: { aff: 1, mood: -2 }, flag: 'gi1' }, r: '{p}说“好”，但你知道，他其实想在场上听到答案。' } } }] },\n    { id: 'gi_h2', cat: '专属线 · 朱利亚诺', who: GI, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'gi1') >= 5 && aff(c, GI) >= 68 && (!done(c, 'gi_l1') || done(c, 'gi_fix')); }, t: '一家媒体发了篇长文，标题是《他能留在这里，是因为姓什么》。{p}在更衣室里刷到了，没说话，把手机扣进了柜子里。', o: [\n      { t: '赛后发布会，你把他的跑动数据念了出来', fx: { fans: 2, p: { aff: 5, mood: 5, form: 1 }, flag: 'gi2' }, r: '记者们没再追问。{p}在走廊里等你，什么也没说，只是把水递给了你。' },\n      { t: '私下找他：“别人怎么写，不影响你的位置。”', fx: { p: { aff: 7, mood: 6 }, flag: 'gi2' }, r: '{p}沉默了很久，说：“我知道。我只是想听你说。”' },\n      { t: '什么都不说，让他用比赛回答', fx: { p: { form: 1.2, ego: 3, aff: 2, mood: -1 }, flag: 'gi2' }, r: '那周{p}多跑了一公里。你在场边看着，没有鼓掌。' }] },\n    { id: 'gi_h3', cat: '专属线 · 朱利亚诺', who: GI, force: true, story: true, once: true, when: function (c) { return c.S.week >= 26 && calm(c) && since(c, 'gi2') >= 6 && aff(c, GI) >= 72 && (!done(c, 'gi_l1') || done(c, 'gi_fix')); }, t: '关键比赛的前一晚，{p}敲开办公室的门，把一件洗得发白的小球衣放在桌上，那是他小时候在场边捡球时穿的。“那时候我只想站在那里。”他说，“现在我想让您知道：我不是来当‘西蒙尼的儿子’的，我是来踢球的。”', o: [\n      { t: '“我知道。我一直是以球员的标准在看你。”', fx: { p: { aff: 5, mood: 8, form: 1.5, ovr: 1 }, unity: 2, flag: 'gi3' }, r: '{p}站得笔直，像是第一次在你面前没有紧张。' },\n      { t: '把球衣还给他：“明天穿上它去踢。”', fx: { p: { form: 2, mood: 6, ovr: .5, aff: 3 }, morale: 3, flag: 'gi3' }, r: '第二天，球衣的一角从他的训练服里露了出来。' },\n      { t: '什么也没说，只是点了点头', fx: { p: { aff: 3, mood: 4, form: 1, ovr: .5 }, flag: 'gi3' }, r: '你们谁都没再提这件事。但从那以后，{p}叫你“教练”的声音不一样了。' }] },\n    { id: 'gi_l1', cat: '专属线 · 朱利亚诺', who: GI, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, GI) <= 30 && !done(c, 'gi2'); }, t: '{p}最近训练得很安静。他一个人跑，一个人收拾，不和你对视。助教悄悄告诉你：“他私下说，在您面前，他做什么都像是错的。”', o: [\n      { t: '主动约他，不谈足球', roll: { p: .55, ok: { fx: { p: { aff: 10, mood: 6 }, flag: ['gi_l1', 'gi_fix'] }, r: '你们在食堂坐了一个小时，聊的是小时候的足球场。{p}走的时候说：“下次别约在办公室。”' }, fail: { fx: { p: { aff: 2, mood: -2 }, flag: 'gi_l1' }, r: '{p}礼貌地回答了每一个问题，但你知道他没有说真话。' } } },\n      { t: '当众点名，给全队立规矩', fx: { p: { aff: -5, mood: -5, ego: -3 }, unity: 2, flag: 'gi_l1' }, r: '更衣室安静了。{p}没有反驳，只是低头系鞋带，系了很久。' },\n      { t: '让助教去聊聊', fx: { p: { aff: 1, mood: 1 }, flag: 'gi_l1' }, r: '{p}知道是谁派来的。他礼貌地说了谢谢。' }] },\n    { id: 'gi_l2', cat: '专属线 · 朱利亚诺', who: GI, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'gi_l1') >= 4 && aff(c, GI) <= 35 && !done(c, 'gi_fix'); }, t: '{p}的经纪人联系了俱乐部，说他想换一个环境，一个“没有人叫他教练的儿子”的地方。CEO 把消息转给了你。', o: [\n      { t: '拒绝，亲自去找他谈', roll: { p: .5, ok: { fx: { p: { aff: 14, mood: 8 }, flag: ['gi_fix'] }, r: '你们谈了两个小时。最后他说：“我留下，不是因为您是我爸……是因为您是教练。”' }, fail: { fx: { p: { aff: -3, mood: -8, form: -1 }, unity: -2, flag: 'gi_cold' }, r: '{p}听完说：“我知道您想让我留下。但我想听的不是这个。”' } } },\n      { t: '答应他：赛季结束后，由他自己决定', fx: { p: { mood: 5, aff: 6, form: .5 }, flag: 'gi_promise' }, r: '{p}长出了一口气：“谢谢您。”你不确定自己是不是做对了。' },\n      { t: '“没有人可以随便离开。”', fx: { p: { aff: -8, mood: -8, ego: 3 }, unity: -2, flag: 'gi_cold' }, r: '{p}什么都没说。第二天，他的柜子里少了几样东西。' }] },\n\n    /* ---- 科克 · 队长 ---- */\n    { id: 'ko_h1', cat: '专属线 · 科克', who: KO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, KO) >= 62 && !done(c, 'ko_l1'); }, t: '{p}在你办公室门口站了很久才敲门。“教练，我今年三十四了。”他说，“每一场我都在想，是不是最后一场。你需要我，还是我只是习惯了待在这里？”', o: [\n      { t: '“球队需要的不是你的腿，是你在场上说的每一句话。”', fx: { p: { aff: 6, mood: 5 }, unity: 2, flag: 'ko1' }, r: '{p}沉默了一下，说：“那我就多说几句。”' },\n      { t: '把战术板推给他：“你来告诉我，下一场怎么踢。”', fx: { p: { aff: 8, mood: 4, ego: 3 }, chem: 2, flag: 'ko1' }, r: '{p}看了你很久，然后拿起了笔。' },\n      { t: '“赛季结束再说。现在只想赢下一场。”', fx: { p: { aff: 2, form: .3 }, flag: 'ko1' }, r: '{p}点点头：“好，那就先赢。”' }] },\n    { id: 'ko_h2', cat: '专属线 · 科克', who: KO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'ko1') >= 5 && aff(c, KO) >= 68 && (!done(c, 'ko_l1') || done(c, 'ko_fix')); }, t: '最近几天，更衣室里的气氛不太对。{p}没有等你开口，把全队叫进更衣室，关上了门。二十分钟后，大家一个一个走出来，没有人说里面发生了什么。', o: [\n      { t: '什么也不问：“你们的事，你们自己说了算。”', fx: { unity: 5, chem: 2, morale: 3, p: { aff: 5, mood: 3 }, flag: 'ko2' }, r: '{p}路过你身边，轻轻拍了拍你的肩，什么也没说。' },\n      { t: '事后问他，里面说了什么', fx: { unity: 3, p: { aff: 3, mood: 2 }, flag: 'ko2' }, r: '“说了点你不会让我说的话。”{p}说完，自己先笑了。' },\n      { t: '“下次叫我一起进去。”', fx: { unity: 1, p: { aff: 2, mood: -1, ego: 1 }, flag: 'ko2' }, r: '{p}想了想：“那下次，我提前通知你。”' }] },\n    { id: 'ko_h3', cat: '专属线 · 科克', who: KO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'ko2') >= 6 && aff(c, KO) >= 72 && (!done(c, 'ko_l1') || done(c, 'ko_fix')); }, t: '赛季快结束了。{p}把一个信封放在你桌上，没有打开。“我有个决定，要在赛季结束时告诉你。”他说，“但今天不是说它的日子。今天我只想把剩下的比赛踢完。”', o: [\n      { t: '“那就踢完。我们一起把它踢完。”', fx: { p: { aff: 5, mood: 8, form: 1.5, ovr: .5 }, morale: 4, unity: 3, flag: 'ko3' }, r: '{p}把信封收了回去，说：“那我们就好好踢。”' },\n      { t: '让他自己决定，下一场要不要首发', roll: { p: .7, ok: { fx: { p: { aff: 6, mood: 6, ego: 4, form: 1.5, ovr: .5 }, unity: 2, flag: 'ko3' }, r: '他选了首发。那场球，他一次都没有停下来喘气。' }, fail: { fx: { p: { aff: 3, mood: 2, form: .5 }, flag: 'ko3' }, r: '他选了坐在板凳上，在场边指挥了整整九十分钟。' } } },\n      { t: '“你不用告诉我，我已经知道了。”', fx: { p: { aff: 4, mood: 5, form: 1 }, morale: 3, flag: 'ko3' }, r: '{p}笑了，眼眶有点红：“这么多年，还是瞒不过你。”' }] },\n    { id: 'ko_l1', cat: '专属线 · 科克', who: KO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, KO) <= 30 && !done(c, 'ko2'); }, t: '{p}不再在更衣室里替你说话了。年轻球员们开始自己看你的脸色，赛前动员，也没有人站起来。', o: [\n      { t: '单独约他，问他怎么想', roll: { p: .6, ok: { fx: { p: { aff: 10, mood: 5 }, unity: 2, flag: ['ko_l1', 'ko_fix'] }, r: '“我只是觉得，你已经不太听我们的了。”{p}说。你把这句话记在了本子上。' }, fail: { fx: { p: { aff: 1 }, unity: -1, flag: 'ko_l1' }, r: '{p}说“没事”，说得很快。' } } },\n      { t: '公开让他重新担起队长的责任', fx: { p: { aff: -4, mood: -3 }, unity: 1, flag: 'ko_l1' }, r: '{p}站起来，说了几句标准的话。每个人都听出来，那不是他自己的话。' },\n      { t: '先不管，看看球队能不能自己走出来', fx: { unity: -3, p: { aff: -2 }, flag: 'ko_l1' }, r: '这周的更衣室，安静得有点奇怪。' }] },\n    { id: 'ko_l2', cat: '专属线 · 科克', who: KO, force: true, story: true, once: true, when: function (c) { return c.S.week >= 16 && calm(c) && since(c, 'ko_l1') >= 4 && aff(c, KO) <= 35 && !done(c, 'ko_fix'); }, t: '更衣室里出现了“两派”：老球员站在{p}这边，年轻球员站在你这边。训练时，两拨人连传球都刻意绕开对方。', o: [\n      { t: '请{p}当面谈，把话说开', roll: { p: .5, ok: { fx: { unity: 6, p: { aff: 14, mood: 6 }, flag: 'ko_fix' }, r: '你们谈了整整一个下午。出来的时候，他把袖标重新戴了回去。' }, fail: { fx: { unity: -4, p: { aff: -2, mood: -3 }, flag: 'ko_cold' }, r: '“你需要的是一个听话的队长。”{p}说，“我不是那种人。”' } } },\n      { t: '把袖标交给别人', fx: { p: { aff: -10, mood: -10, ego: 4 }, unity: -4, flag: 'ko_cold' }, r: '袖标换了人，{p}坐在更衣室最靠里的位置，很久没有动。' },\n      { t: '“所有人到会议室，一个一个说。”', fx: { unity: 1, p: { aff: -3, mood: -2 }, flag: 'ko_cold' }, r: '会开了两个小时。该说的都说了，但有些东西没有被说开。' }] },\n\n    /* ---- 阿尔瓦雷斯 · 头号进攻点 ---- */\n    { id: 'al_h1', cat: '专属线 · 阿尔瓦雷斯', who: AL, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, AL) >= 60 && !done(c, 'al_l1'); }, t: '训练结束了，{p}没有走。他站在禁区弧顶，对着空门一个一个地踢。等你看过去，他才说：“教练，有个角度我总是踢不好，你能陪我练吗？”', o: [\n      { t: '陪他练到天黑', fx: { p: { aff: 6, form: 1.2, mood: 3 }, fatigue: 2, flag: 'al1' }, r: '灯亮起来的时候，{p}终于把那个角度踢了进去，笑得像个孩子。' },\n      { t: '让进攻教练去陪他', fx: { p: { aff: 2, form: .6 }, atk: 1, flag: 'al1' }, r: '{p}点点头，没说什么，但你看到他回头看了你一眼。' },\n      { t: '“你想进球？先把回防做好。”', fx: { p: { aff: 3, ego: -5, mood: -1, form: .4 }, def: 1.2, flag: 'al1' }, r: '{p}撇了撇嘴，第二天训练，他回防的次数多了一倍。' }] },\n    { id: 'al_h2', cat: '专属线 · 阿尔瓦雷斯', who: AL, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'al1') >= 5 && aff(c, AL) >= 68 && (!done(c, 'al_l1') || done(c, 'al_fix')); }, t: '一家海外俱乐部的报价传到了更衣室，所有人都在看{p}。他走进办公室，把手机屏幕朝下放在桌上：“我不想聊这个。我只想问你，下一场怎么踢。”', o: [\n      { t: '“你想走可以。但我希望你留下。”', fx: { p: { aff: 8, mood: 5, ego: -3 }, flag: 'al2' }, r: '{p}看了你很久：“你是第一个这么说的人。”' },\n      { t: '“下一场你首发。别的赛季后再说。”', fx: { p: { aff: 5, form: 1, mood: 3 }, flag: 'al2' }, r: '{p}点点头，起身时顺手把手机揣回了口袋。' },\n      { t: '当着全队的面：“这件事我替他回答了——他留下。”', fx: { fans: 3, unity: 2, p: { aff: 3, mood: 2, ego: 3 }, flag: 'al2' }, r: '更衣室里炸开了锅。{p}挠着头，没有反驳。' }] },\n    { id: 'al_h3', cat: '专属线 · 阿尔瓦雷斯', who: AL, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'al2') >= 6 && aff(c, AL) >= 72 && (!done(c, 'al_l1') || done(c, 'al_fix')); }, t: '关键比赛的前夜，{p}敲开你的门，递过来一张战术图复印件，上面全是他用红笔画的跑位，而且大部分是回防的路线。“教练，明天这场，我想先做那个防守的人。”', o: [\n      { t: '“那我们明天就这么踢。”', fx: { def: 2, p: { aff: 5, mood: 6, form: 1.5, ovr: 1 }, flag: 'al3' }, r: '第二天，{p}第一个回到了本方禁区。' },\n      { t: '“你最锋利的时候是在门前，别想太多。”', fx: { p: { aff: 4, mood: 5, form: 2, ego: 2, ovr: .5 }, flag: 'al3' }, r: '{p}笑了：“那我就把该做的都做了。”' },\n      { t: '把那张纸贴在更衣室的墙上', fx: { unity: 3, morale: 3, p: { aff: 3, mood: 4, ego: -3, form: 1, ovr: .5 }, flag: 'al3' }, r: '那张纸一直贴到了赛季结束，没有人去撕。' }] },\n    { id: 'al_l1', cat: '专属线 · 阿尔瓦雷斯', who: AL, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, AL) <= 30 && !done(c, 'al2'); }, t: '{p}在采访里说了一句：“我觉得我可以做得更多。”他没有说“在这支球队”。记者们问你的看法。', o: [\n      { t: '单独约他谈', roll: { p: .55, ok: { fx: { p: { aff: 10, ego: -5, mood: 4 }, flag: ['al_l1', 'al_fix'] }, r: '“我只是想踢得更好。”{p}说。你说：“那我们一起想想怎么办。”' }, fail: { fx: { p: { aff: 1, mood: -3 }, flag: 'al_l1' }, r: '{p}听完说“我知道了”，然后去加练了。你没听出是不是真的。' } } },\n      { t: '发布会上说：“他很重要，但球队不是他一个人的。”', fx: { fans: 1, unity: 2, p: { aff: -4, ego: -8, mood: -3 }, flag: 'al_l1' }, r: '这句话被登上了头条。{p}没有回应，下一场却进了球。' },\n      { t: '保持沉默', fx: { unity: -2, p: { aff: -2, ego: 4 }, flag: 'al_l1' }, r: '没有回应，也是一种回应。更衣室里开始有人窃窃私语。' }] },\n    { id: 'al_l2', cat: '专属线 · 阿尔瓦雷斯', who: AL, force: true, story: true, once: true, when: function (c) { return c.S.week >= 16 && calm(c) && since(c, 'al_l1') >= 4 && aff(c, AL) <= 35 && !done(c, 'al_fix'); }, t: '训练赛中被换下，{p}把训练背心甩在草地上，头也不回地走进了球员通道。队友们愣在原地，等着你的反应。', o: [\n      { t: '追过去，在通道里一个人跟他谈', roll: { p: .5, ok: { fx: { p: { aff: 14, mood: 6, ego: -8 }, flag: 'al_fix' }, r: '你们在通道里站了十分钟。他回到场上的时候，把背心重新穿上了。' }, fail: { fx: { p: { aff: -3, mood: -6 }, unity: -2, flag: 'al_cold' }, r: '{p}靠着墙，一句话也不说。最后你先回了球场。' } } },\n      { t: '罚款，并要求他当众道歉', fx: { p: { aff: -8, mood: -8, ego: -10 }, unity: 3, board: 1, flag: 'al_cold' }, r: '道歉很标准，也很冷。{p}说完就走了。' },\n      { t: '当作什么都没发生，让他自己冷静', fx: { p: { aff: -3, ego: 4, mood: -3 }, unity: -3, flag: 'al_cold' }, r: '训练继续了。但所有人都看得出，今天什么都没有被解决。' }] },\n\n    /* ---- 巴里奥斯 · 年轻核心 ---- */\n    { id: 'ba_h1', cat: '专属线 · 巴里奥斯', who: BA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 6 && calm(c) && aff(c, BA) >= 60 && !done(c, 'ba_l1'); }, t: '训练后，{p}一直盯着你手里的战术笔记本。“教练，我能问你一件事吗？”他说，“你觉得我现在，差在哪里？”', o: [\n      { t: '“你想得太多了。球到脚下，别想后果。”', fx: { p: { aff: 6, mood: 4, form: .5, ego: -1 }, flag: 'ba1' }, r: '{p}点点头，那天训练里第一次没有回头看你。' },\n      { t: '把自己的笔记本递给他：“回去看，明天告诉我你怎么想。”', fx: { p: { aff: 7, mood: 3, form: .6 }, flag: 'ba1' }, r: '第二天，{p}带着满满三页的批注来了。' },\n      { t: '“你比自己想的好得多。”', fx: { p: { aff: 4, mood: 6, ego: 2 }, flag: 'ba1' }, r: '{p}不好意思地挠了挠头：“那我就信你一次。”' }] },\n    { id: 'ba_h2', cat: '专属线 · 巴里奥斯', who: BA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 14 && calm(c) && since(c, 'ba1') >= 5 && aff(c, BA) >= 68 && (!done(c, 'ba_l1') || done(c, 'ba_fix')); }, t: '昨天那个失误之后，{p}一个人坐在更衣室的角落里，毛巾盖着头。所有人都从他身边绕了过去。', o: [\n      { t: '坐到他旁边，一句话也不说', fx: { unity: 1, p: { aff: 8, mood: 8 }, flag: 'ba2' }, r: '十分钟后，{p}把毛巾拿下来，说：“谢谢你没有说话。”' },\n      { t: '“明天训练，我们把那个球练一百遍。”', fx: { p: { aff: 5, form: 1, mood: 3 }, flag: 'ba2' }, r: '第二天{p}练到了第一百零一次，才肯走。' },\n      { t: '让队友去陪他', fx: { unity: 2, p: { aff: 3, mood: 4 }, flag: 'ba2' }, r: '科克和他在更衣室待了很久。出来的时候，{p}笑了一下。' }] },\n    { id: 'ba_h3', cat: '专属线 · 巴里奥斯', who: BA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 28 && calm(c) && since(c, 'ba2') >= 6 && aff(c, BA) >= 72 && (!done(c, 'ba_l1') || done(c, 'ba_fix')); }, t: '{p}的经纪人带来了一份新合同草案。但在对方开口之前，{p}先说话了：“教练，我不想先看数字。我想先知道，明年你还在这里吗？”', o: [\n      { t: '“我还在。你也在。”', fx: { board: 1, fans: 3, p: { aff: 5, mood: 8, form: 1.5, ovr: 1 }, flag: 'ba3' }, r: '{p}在合同上签了字，抬头时眼里亮亮的。' },\n      { t: '“我不能保证自己的位置，但能保证你每一场都有机会。”', fx: { p: { aff: 6, mood: 5, form: 1, ovr: .5 }, flag: 'ba3' }, r: '{p}听完点了点头：“这样的话，我信。”' },\n      { t: '“你值得一份更好的合同。”', fx: { funds: -6, p: { aff: 4, mood: 6, ovr: .5 }, flag: 'ba3' }, r: '经纪人愣了一下。{p}笑着说：“我早就说了，教练最懂我。”' }] },\n    { id: 'ba_l1', cat: '专属线 · 巴里奥斯', who: BA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 8 && calm(c) && aff(c, BA) <= 30 && !done(c, 'ba2'); }, t: '{p}的传球越来越保守，每一脚都是安全球。有人在更衣室里听见他说：“我不想再被当着所有人的面吼了。”', o: [\n      { t: '单独找他，先道歉', roll: { p: .65, ok: { fx: { p: { aff: 11, mood: 6 }, flag: ['ba_l1', 'ba_fix'] }, r: '“我没想到你会道歉。”{p}说，“我以为……我只是个听话的人。”' }, fail: { fx: { p: { aff: 3, mood: 1 }, flag: 'ba_l1' }, r: '{p}点点头，但你知道，他需要更久的时间。' } } },\n      { t: '“比赛不是幼儿园。”', fx: { p: { aff: -6, mood: -8, form: -.6, ego: -3 }, unity: 1, flag: 'ba_l1' }, r: '{p}没有哭，也没有反驳，只是低着头走开了。' },\n      { t: '给他放两天假，什么都不要求', fx: { p: { aff: 3, mood: 5, fit: 8 }, flag: 'ba_l1' }, r: '两天后他回来了，眼神清楚了一些，也没提那件事。' }] },\n    { id: 'ba_l2', cat: '专属线 · 巴里奥斯', who: BA, force: true, story: true, once: true, when: function (c) { return c.S.week >= 16 && calm(c) && since(c, 'ba_l1') >= 4 && aff(c, BA) <= 35 && !done(c, 'ba_fix'); }, t: '本地媒体的头条是{p}的经纪人说的一句话：“巴里奥斯在这里被低估了。”这周的更衣室，没人敢提这个名字。', o: [\n      { t: '约经纪人、{p}和 CEO 一起谈', roll: { p: .5, ok: { fx: { board: 1, p: { aff: 12, mood: 6 }, flag: 'ba_fix' }, r: '谈到最后，{p}说：“我只是想知道，我在这里是有未来的。”' }, fail: { fx: { board: -1, p: { aff: -2, mood: -2 }, flag: 'ba_cold' }, r: '谈判桌上，经纪人说得最多，{p}一句话都没说。' } } },\n      { t: '对媒体说：“这是球员和俱乐部之间的事。”', fx: { fans: -1, p: { aff: -3, mood: -2 }, flag: 'ba_cold' }, r: '新闻第二天就被别的新闻盖过去了，但{p}没有忘。' },\n      { t: '给他更重要的位置和更多的信任', fx: { unity: -1, p: { aff: 8, mood: 8, ego: 6, form: -.3 }, flag: 'ba_fix' }, r: '{p}在训练场上喊了几次队友的名字，声音比平时大。' }] }\n  ],\n\n  /* 梗图鉴（成就）：check(S, H, final) 返回 true 就解锁 */\n  achievements: [\n    { id: 'first', name: '第一周', desc: '完成第一周的排程', check: function (S) { return S.week >= 1; } },\n    { id: 'derby', name: '马德里的主人', desc: '联赛中赢下一场德比', check: function (S) { return S.hist.some(function (h) { return h.opp === 'RMA' && h.cn === '西甲' && h.out === 'W'; }); } },\n    { id: 'bigwin', name: '血洗', desc: '一场比赛净胜三球以上', check: function (S) { return S.stats.bigWins >= 1; } },\n    { id: 'streak8', name: '一场一场来', desc: '各项赛事 8 连胜', check: function (S) { return S.streak >= 8; } },\n    { id: 'unbeaten10', name: '十场不败', desc: '各项赛事 10 场不败', check: function (S) { return S.unbeaten >= 10; } },\n    { id: 'talks20', name: '心灵导师', desc: '累计找球员谈话 20 次', check: function (S) { return S.stats.talks >= 20; } },\n    { id: 'unity85', name: '一家人', desc: '更衣室团结达到 85', check: function (S) { return S.attrs.unity >= 85; } },\n    { id: 'atk80', name: '边路之王', desc: '进攻体系达到 80', check: function (S) { return S.attrs.atk >= 80; } },\n    { id: 'def80', name: '三十米区域', desc: '防守体系达到 80', check: function (S) { return S.attrs.def >= 80; } },\n    { id: 'ucl_qf', name: '八强之上', desc: '欧冠打进八强', check: function (S) { var u = S.ucl; return u.stage === 'sf' || u.stage === 'f' || u.stage === 'won' || (u.exit && ['qf', 'sf', 'f'].indexOf(u.exit) >= 0); } },\n    { id: 'liga', name: '第 12 个联赛冠军', desc: '拿下西甲冠军', check: function (S, H, final) { return final && S.ending && S.ending.rank === 1; } },\n    { id: 'cdr', name: '第 11 座国王杯', desc: '拿下国王杯', check: function (S) { return S.trophies.indexOf('国王杯') >= 0; } },\n    { id: 'ucl', name: '第一座大耳朵杯', desc: '拿下欧冠', check: function (S) { return S.trophies.indexOf('欧冠') >= 0; } },\n    { id: 'treble', name: '梦中的三冠', desc: '同一赛季拿下西甲、国王杯和欧冠', check: function (S) { var t = S.trophies; return t.indexOf('欧冠') >= 0 && t.indexOf('国王杯') >= 0 && t.indexOf('西甲') >= 0; } },\n    { id: 'story_gi', name: '我是来踢球的', desc: '走完朱利亚诺的专属线', check: function (S) { return !!S.flags.gi3; } },\n    { id: 'story_ko', name: '没有拆开的信封', desc: '走完科克的专属线', check: function (S) { return !!S.flags.ko3; } },\n    { id: 'story_al', name: '先防守的人', desc: '走完阿尔瓦雷斯的专属线', check: function (S) { return !!S.flags.al3; } },\n    { id: 'story_ba', name: '先不看数字', desc: '走完巴里奥斯的专属线', check: function (S) { return !!S.flags.ba3; } },\n    { id: 'story_all', name: '四个故事，一个更衣室', desc: '同一赛季走完四条专属线', check: function (S) { var f = S.flags; return !!(f.gi3 && f.ko3 && f.al3 && f.ba3); } },\n    { id: 'fix', name: '冰释前嫌', desc: '把一段正在破裂的关系拉了回来', check: function (S) { var f = S.flags; return !!(f.gi_fix || f.ko_fix || f.al_fix || f.ba_fix); } },\n    { id: 'cold', name: '谈崩了', desc: '一名核心球员和你的关系彻底破裂', check: function (S) { var f = S.flags; return !!(f.gi_cold || f.ko_cold || f.al_cold || f.ba_cold); } },\n    { id: 'endall', name: '全结局收藏家', desc: '集齐结局图鉴里的所有结局', check: function () { return false; } }\n  ],\n\n  /* 结局 */\n  endings: function (S, r) {\n    var t = r.tro, has = function (n) { return t.indexOf(n) >= 0; };\n    var liga = has('西甲'), cdr = has('国王杯'), ucl = has('欧冠'), sup = has('西超杯');\n    var head, body, grade;\n    if (r.fired) { head = '提前离开的人'; grade = 'D'; body = '董事会的耐心比赛季更短。你收拾办公室的时候，更衣室里没有人说话，直到最后一个人走过来，把那件训练服还给你。\\n你在门口回头看了一眼，对自己说：一场一场来。'; }\n    else if (liga && cdr && ucl) { head = '三冠王'; grade = 'S+'; body = '那天晚上的大都会球场，没有人愿意回家。更衣室里放的是你最不喜欢的歌，但你一首也没有关。\\n十五年了，这支球队终于做到了所有人都觉得不可能的事。'; }\n    else if (ucl && liga) { head = '欧冠与联赛双冠'; grade = 'S'; body = '大耳朵杯捧起来的那一刻，你抬头看了一眼看台。第一次，你没有躲开镜头。\\n联赛和欧洲，同一个赛季，同一支球队。'; }\n    else if (ucl) { head = '大耳朵杯'; grade = 'S'; body = '你曾两次站在欧冠决赛的失败者那一边。这一次，没有人再提里斯本，也没有人再提米兰。\\n奖杯在你手里很沉。你想：原来是这么重。'; }\n    else if (liga && cdr) { head = '国内双冠'; grade = 'A+'; body = '联赛冠军和国王杯同时到手。球迷在街头唱了一整夜，邻居们的窗户都关得紧紧的。\\n欧洲的故事，留给明年。'; }\n    else if (liga) { head = '联赛冠军'; grade = 'A'; body = '最后一轮结束的哨声响起时，你没有冲到场边。你站在原地，等所有人都抱在了一起，才慢慢走过去。\\n那是你的第三个联赛冠军。'; }\n    else if (r.ucl === 'f') { head = '再一次站在决赛的另一边'; grade = 'B+'; body = '决赛之后，你一个人在更衣室里坐了很久。最后是科克过来，把一瓶水塞到你手里：“教练，明年还来。”\\n你没有回答，但你记住了这句话。'; }\n    else if (cdr || sup) { head = (cdr ? '国王杯' : '西超杯') + '冠军'; grade = 'B+'; body = '一座杯赛冠军，不是最大的，但足以让这个赛季不被遗忘。\\n赛季结束的那天，你在训练场上多待了一会儿。'; }\n    else if (r.rank <= 2) { head = '差了一点点的亚军'; grade = 'B+'; body = '赛季结束的时候，积分榜上你的名字紧挨着榜首。球迷们给你鼓掌，你却想起了那几场本可以赢的比赛。\\n“一点点，永远是最远的距离。”'; }\n    else if (r.rank <= 4 && (r.ucl === 'qf' || r.ucl === 'sf' || r.ucl === 'r16')) { head = '稳稳站在欧冠区'; grade = 'B'; body = '联赛前四，欧冠也走得不近不远。算不上伟大，却是一个对得起这座城市的赛季。\\n你用笔在日历上划掉了最后一周。'; }\n    else if (r.rank <= 4) { head = '欧冠资格到手'; grade = 'B'; body = '联赛前四，赛季目标达成。看台上没有欢呼，也没有嘘声。\\n对一支“马德里的另一半”来说，这是一个正常的好赛季。'; }\n    else if (r.rank <= 7) { head = '欧联区的赛季'; grade = 'C+'; body = '联赛第' + r.rank + '，欧战资格勉强保住。董事会没有说话，球迷们互相安慰：“明年会更好。”\\n你没有反驳。'; }\n    else if (r.rank <= 14) { head = '平淡的中游'; grade = 'C'; body = '联赛第' + r.rank + '。没有降级压力，也没有什么惊喜。赛季结束，球员们各自回家，你在更衣室里待了很久，把每个人的储物柜都看了一遍。'; }\n    else { head = '惊险过关'; grade = 'D+'; body = '联赛第' + r.rank + '，离降级区只差几个积分。赛季结束的那一晚，你在车里坐了很久，才发动引擎。'; }\n    /* 风格尾注 */\n    var sty = { iron: '你的训练场上永远有最后一圈。球员们抱怨过，也都跑完了。', kind: '你的办公室永远是打开的。更衣室里，没有人觉得自己是一个人。', tactic: '你的笔记本写满了字。每一节课、每一段录像，球员们都记得。', media: '你把发布会当成了第二个训练场。无论赢输，球迷们都愿意听你说话。', mix: '你什么都做了一点，也许这就是“一场一场来”。' };\n    var nm = { iron: '铁腕型', kind: '亲和型', tactic: '战术大师型', media: '公关型', mix: '均衡型' };\n    var extra = '';\n    if (!r.fired && r.goal === 'dream' && ucl && liga && cdr) extra = '当初你在会议室里说的话，成真了。';\n    else if (!r.fired && r.goal === 'dream' && !ucl) extra = '三线作战的豪言壮语，终究只是一句话。';\n    else if (!r.fired && r.goal === 'push' && r.rank > 3) extra = '“争冠”两个字，还是太重了。';\n    else if (!r.fired && r.goal === 'safe' && r.rank <= 2) extra = '一个“稳健”的目标，被你打成了争冠。';\n    var IDS = { '提前离开的人': 'fired', '三冠王': 'treble', '欧冠与联赛双冠': 'uclliga', '大耳朵杯': 'ucl', '国内双冠': 'double', '联赛冠军': 'liga', '再一次站在决赛的另一边': 'final', '国王杯冠军': 'cup', '西超杯冠军': 'cup', '差了一点点的亚军': 'runner', '稳稳站在欧冠区': 'top4far', '欧冠资格到手': 'top4', '欧联区的赛季': 'europa', '平淡的中游': 'mid', '惊险过关': 'scare' };\n    return { id: IDS[head], title: head, grade: grade, body: body, style: r.style, styleName: nm[r.style] || nm.mix, styleText: sty[r.style] || sty.mix, extra: extra };\n  },\n\n  /* 结局图鉴：id 对应 endings() 返回的 id；hint 是没打出来时给的线索 */\n  endi v class=\"fixt\" style=\"grid-template-columns:44px 1fr auto\"><div class=\"d\">' + CG.dTxt(h.date).replace('月', '/').replace('日', '') + '<\/div><div class=\"o\"><b>' + esc(CG.tname(h.opp)) + '<\/b><small>' + esc(h.cn + ' · ' + h.rd) + '<\/small><\/div><div class=\"num\"><b class=\"' + (h.out === 'W' ? 'up' : h.out === 'L' ? 'down' : 'flat') + '\">' + h.gf + '–' + h.ga + '<\/b><\/div><\/div>'; }).join('') + '<\/section>';\n  out += endCodex() + achPanel();\n  return out;\n}\nfunction achPanel() {\n  var g = getAch(), all = CFG.achievements || [];\n  return '<section class=\"panel\"><h2>梗图鉴 <small class=\"hint\" style=\"font-weight:400;text-transform:none;letter-spacing:0\">' + Object.keys(g).length + ' / ' + all.length + '<\/small><\/h2><div class=\"ach\">' + all.map(function (a) { var on = g[a.id] || (S && S.ach && S.ach[a.id]); return '<div class=\"' + (on ? '' : 'off') + '\"><b>' + (on ? esc(a.name) : '？？？') + '<\/b>' + esc(on ? a.desc : '尚未解锁') + '<\/div>'; }).join('') + '<\/div><\/section>';\n}\n\n/* ---------------- 主界面 ---------------- */\nfunction main() {\n  var tabs = [['home', '总览'], ['players', '球员'], ['sched', '排程'], ['season', '赛季']];\n  var out = '<div class=\"app\">' + topbar() + '<nav class=\"tabs\" role=\"tablist\">' + tabs.map(function (t) { return '<button role=\"tab\" data-act=\"tab\" data-t=\"' + t[0] + '\" aria-selected=\"' + (U.tab === t[0]) + '\">' + t[1] + '<\/button>'; }).join('') + '<\/nav>';\n  out += U.tab === 'home' ? tabHome() : U.tab === 'players' ? tabPlayers() : U.tab === 'sched' ? tabSched() : tabSeason();\n  out += '<\/div><div class=\"bar-fixed\"><div class=\"in\"><button class=\"btn\" data-act=\"ff\" title=\"用助教安排自动推进，遇到事件或重要比赛停下\">快进<\/button><button class=\"btn pri\" data-act=\"go\">开始本周 ▶<\/button><\/div><\/div>';\n  if (U.ffNote) out += '';\n  return out;\n}\n\n/* ---------------- 周报 ---------------- */\nfunction matchCard(m) {\n  var f = m.f, r = m.res, me = esc(CFG.short), op = esc(CG.tname(f.opp));\n  var home = f.neutral ? null : f.h;\n  var left = home === false ? op : me, right = home === false ? me : op;\n  var sl = home === false ? r.ga : r.gf, sr = home === false ? r.gf : r.ga;\n  var sc = r.sc.map(function (x) { return esc(CG.pname(x.id)) + ' ' + CG.fmtMin(x.m) + '\\''; }).join('，');\n  var out = '<div class=\"mcard ' + r.out + '\"><div class=\"hd\"><span>' + CG.DAYN[m.d] + ' · ' + esc(f.cn + ' ' + f.rd) + '<\/span><span>' + (f.neutral ? '中立场' : f.h ? '主场' : '客场') + '<\/span><\/div>' +\n    '<div class=\"sc\"><div class=\"t me\">' + left + '<\/div><div class=\"s\">' + sl + ' – ' + sr + '<\/div><div class=\"t op\">' + right + '<\/div><\/div><div class=\"body\">';\n  if (sc) out += '<div>进球：' + sc + '<\/div>';\n  if (r.agg) out += '<div class=\"g\">两回合总比分 ' + r.agg[0] + '–' + r.agg[1] + (r.tieOut === 'W' ? '，晋级' : r.tieOut === 'L' ? '，出局' : '') + '<\/div>';\n  r.text.forEach(function (t) { out += '<div class=\"g\">' + esc(t) + '<\/div>'; });\n  return out + '<\/div><\/div>';\n}\nfunction reportView() {\n  var rep = U.report, out = '<div class=\"app\">' + topbar('第 ' + (rep.week + 1) + ' 周回顾', CG.dTxt(rep.date) + ' – ' + CG.dTxt(CG.addDays(rep.date, 6)));\n  if (U.ffNote) out += '<div class=\"tip\">' + esc(U.ffNote) + '<\/div>';\n  if (rep.matches.length) out += rep.matches.map(matchCard).join(''); else out += '<section class=\"panel\"><p class=\"hint\">本周没有比赛。<\/p><\/section>';\n  /* 数值变化 */\n  var d = [], pv = rep.before;\n  CG.ATTRS.forEach(function (a) { var dv = S.attrs[a.k] - pv.attrs[a.k]; if (Math.abs(dv) >= .1) d.push('<span class=\"pv ' + clsd(dv) + '\">' + a.n + ' ' + sg(dv) + '<\/span>'); });\n  var db = S.board - pv.board, df = S.fans - pv.fans;\n  if (Math.abs(db) >= .1) d.push('<span class=\"pv ' + clsd(db) + '\">董事会信任 ' + sg(db) + '<\/span>');\n  if (Math.abs(df) >= .1) d.push('<span class=\"pv ' + clsd(df) + '\">球迷热度 ' + sg(df) + '<\/span>');\n  d.push('<span class=\"pv ' + clsd(S.fatigue - pv.fat, true) + '\">疲劳 ' + sg(S.fatigue - pv.fat) + '<\/span>');\n  out += '<section class=\"panel\"><h2>本周变化<\/h2><div class=\"delta\">' + d.join('') + '<\/div><\/section>';\n  if (rep.news && rep.news.length) out += '<section class=\"panel\"><h2>消息<\/h2>' + rep.news.map(function (n) { return '<p class=\"hint\">' + esc(n) + '<\/p>'; }).join('') + '<\/section>';\n  out += '<details class=\"panel\"><summary>训练日志<\/summary>' + rep.days.map(function (d) {\n    if (!d.slots.length) return '<div class=\"daylog\"><b>' + d.name + '<\/b><span class=\"lg\">休息日<\/span><\/div>';\n    return '<div class=\"daylog\"><b>' + d.name + '<\/b><div>' + d.slots.map(function (s) { return '<div>' + esc(s.half + ' ' + s.txt) + (s.log && s.log.length ? ' <span class=\"lg\">· ' + esc(s.log.join('，')) + '<\/span>' : '') + '<\/div>'; }).join('') + '<\/div><\/div>';\n  }).join('') + '<\/details>';\n  out += '<\/div><div class=\"bar-fixed\"><div class=\"in\"><span><\/span><button class=\"btn pri\" data-act=\"next\">' + (S.ended ? '查看赛季结局' : S.pending ? '继续' : '进入下一周') + '<\/button><\/div><\/div>';\n  return out;\n}\n\n/* ---------------- 事件 / 结局 / 标题 ---------------- */\nfunction eventSheet() {\n  var pe = S.pending, out = '';\n  if (U.evResult != null) return '<h3>' + esc(U.evCat || '事件') + '<\/h3><p>' + esc(U.evResult) + '<\/p><button class=\"btn pri\" data-act=\"evok\">继续<\/button>';\n  out += '<span class=\"tag comp\" style=\"justify-self:start\">' + esc(pe.cat) + '<\/span><p>' + esc(pe.text) + '<\/p>';\n  pe.opts.forEach(function (o) { out += '<button class=\"opt\" data-act=\"evopt\" data-i=\"' + o.i + '\"><b>' + esc(o.t) + '<\/b>' + (o.tip ? '<small>' + esc(o.tip) + '<\/small>' : '') + '<\/button>'; });\n  return out;\n}\nfunction endView() {\n  var e = S.ending, tro = S.trophies;\n  var out = '<div class=\"app plain end\"><div class=\"hero\"><span class=\"sub\">' + esc(CFG.motto) + ' · 赛季结束<\/span><div class=\"grade\">' + esc(e.grade) + '<\/div>' + (U.endNew && U.endNew.isNew ? '<span class=\"tag comp\" style=\"justify-self:start\">新结局 · 已收入图鉴<\/span>' : '') ---- 渲染 ---------------- */\nfunction render() {\n  var html = U.screen === 'title' ? titleView() : U.screen === 'report' ? reportView() : U.screen === 'end' ? endView() : main();\n  var sheet = '';\n  if (U.sheet) {\n    var body = U.sheet.kind === 'player' ? playerSheet() : U.sheet.kind === 'slot' ? slotSheet() : U.sheet.kind === 'event' ? eventSheet() : U.sheet.kind === 'ending' ? endcardSheet() : '';\n    sheet = '<div class=\"mask\" data-act=\"mask\"><div class=\"sheet\" role=\"dialog\" aria-modal=\"true\">' + body + '<\/div><\/div>';\n  }\n  APP.innerHTML = html + sheet;\n}\n\n/* ---------------- 动作 ---------------- */\nfunction startNew() { clearSave(); S = CG.newGame(); U.screen = 'main'; U.tab = 'home'; U.report = null; U.newAch = []; save(); openEventIfAny(); render(); window.scrollTo(0, 0); }\nfunction openEventIfAny() { if (S.pending) { U.sheet = { kind: 'event' }; U.evResult = null; U.evCat = S.pending.cat; } }\nfunction beginWeek(auto) {\n  var before = { attrs: JSON.parse(JSON.stringify(S.attrs)), board: S.board, fans: S.fans, fat: S.fatigue };\n  var plan = auto ? CG.autoPlan(S) : S.plan;\n  var rep = CG.playWeek(S, plan);\n  rep.before = before;\n  return rep;\n}\nfunction afterWeek(rep) {\n  U.report = rep;\n  if (S.ended) { U.endNew = recordEnding(); U.newAch = mergeAch(); }\n  save();\n  U.screen = 'report'; U.sheet = null; U.tab = 'home'; render(); window.scrollTo(0, 0);\n}\nfunction fastForward() {\n  var rep = null, merged = [], n = 0, startAttrs = null;\n  var before = { attrs: JSON.parse(JSON.stringify(S.attrs)), board: S.board, fans: S.fans, fat: S.fatigue };\n  while (n < 6) {\n    S.plan = CG.autoPlan(S);\n    rep = CG.playWeek(S, S.plan); n++;\n    rep.matches.forEach(function (m) { merged.push(m); });\n    if (S.ended || S.pending) break;\n    /* 下周有欧冠淘汰赛、德比或杯赛决赛就停下 */\n    var nx = CG.weekFixtures(S).filter(function (x) { return x.f.ko || CFG.rivals.indexOf(x.f.opp) >= 0; });\n    if (nx.length) break;\n    if (S.key.some(function (id)
