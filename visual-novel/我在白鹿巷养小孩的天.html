    if (c.route === 'top') { S.route = top(); var hi = S.aff[S.route]; if (IDS.filter(function (p) { return S.aff[p] === hi; }).length > 1) S.flags.tie = true; }
    else S.route = c.route;
    return step();
  }
  if (c.ending) { return showEnding(c.ending); }
  if (c.flag) { S.flags[c.flag] = true; return step(); }
  if (c.ch) { S.ch = c.ch; $('chapTag').textContent = c.ch; return step(); }
  if (c.if) { if (c.if(ctx)) { jump(c.go); return run(); } return step(); }
  if (c.go) { jump(c.go); return run(); }
  if (c.back) { S.pc = S.ret; S.ret = null; S.sprs = []; layout(true); return run(); }
  if (c.card) { return showCard(c.card); }
  if (c.choice) { return showChoice(c.choice); }
  if (c.free) { return showFree(c.free); }
  if (c.end) { return endChapter(c.end); }
  for (var k in KEY) if (c[k] !== undefined) {
    var who = KEY[k]; setFocus(who);
    if (c.e) setSpr(who, c.e);
    return showLine(CAST[who].name, c[k]);
  }
  if (c.a !== undefined) return showLine(ST.player || '你', c.a, 'you');
  if (c.n !== undefined) return showLine('', c.n);
  if (c.who) return showLine(c.who, c.t);
  throw new Error('看不懂的剧本指令：' + JSON.stringify(c));
}
function hideOverlays() { $('choices').hidden = true; $('free').hidden = true; $('card').hidden = true; }

function showCard(cd) {
  stopType(); $('box').hidden = true; $('menu').hidden = true;
  var el = $('card'); el.querySelector('.ct').textContent = fill(cd.t); el.querySelector('.cs').textContent = fill(cd.s || '');
  el.hidden = false;
  if (cd.save) autosave();
  clearTimeout(autoT);
  if (skip) { skip = false; setMenu(); }
  el.onclick = function () { el.onclick = null; el.hidden = true; step(); };
}
function showChoice(list) {
  stopType(); clearTimeout(autoT);
  if (skip) { skip = false; setMenu(); }
  var box = $('choices'); box.innerHTML = '';
  list.filter(function (o) { return !o.when || o.when(ctx); }).forEach(function (o) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = o.t;
    b.addEventListener('click', function (ev) {
      ev.stopPropagation(); box.hidden = true;
      S.log.push({ w: '→', t: o.t });
      if (o.flag) [].concat(o.flag).forEach(function (k) { S.flags[k] = true; });
      if (o.aff) addAff(o.aff, o.p);
      if (o.go) { jump(o.go); run(); } else step();
    });
    box.appendChild(b);
  });
  box.hidden = false;
  var f = box.querySelector('button'); if (f) f.focus({ preventScroll: true });
}
function showFree(fr) {
  stopType(); clearTimeout(autoT);
  if (skip) { skip = false; setMenu(); }
  var key = S.pc.l + ':' + S.pc.i;
  if (!S.free || S.free.key !== key) S.free = { key: key, left: fr.n, used: {} };
  if (S.free.left <= 0) { S.free = null; return step(); }
  $('box').hidden = true; $('menu').hidden = false;
  var el = $('free'), spots = fr.spots.filter(function (s) { return !s.when || s.when(ctx); });
  var giftsLeft = ST.giftList.filter(function (g) { return !S.gifted[g.id] && (!g.when || g.when(ctx)); });
  el.innerHTML = '<div class="fh">' + (fr.title || '自由时间') + '</div><div class="fs">还可以行动 ' + S.free.left + ' 次</div><div class="spots"></div><div class="fbtns"></div>';
  var box = el.querySelector('.spots');
  spots.forEach(function (sp) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'spot';
    b.innerHTML = '<b></b><small></small>'; b.querySelector('b').textContent = sp.name; b.querySelector('small').textContent = sp.d;
    if (S.free.used[sp.id]) { b.disabled = true; b.querySelector('small').textContent = '已经去过了'; }
    b.addEventListener('click', function (ev) { ev.stopPropagation(); useSpot(sp.go, sp.id); });
    box.appendChild(b);
  });
  if (fr.gift !== false) {
    var g = document.createElement('button'); g.type = 'button'; g.className = 'spot';
    g.innerHTML = '<b>送点东西</b><small></small>';
    g.querySelector('small').textContent = giftsLeft.length ? '抽屉里还有 ' + giftsLeft.length + ' 样东西' : '抽屉空了';
    if (!giftsLeft.length || S.free.used.gift) { g.disabled = true; if (S.free.used.gift) g.querySelector('small').textContent = '今天已经送过了'; }
    g.addEventListener('click', function (ev) { ev.stopPropagation(); openGifts(); });
    box.appendChild(g);
  }
  var fb = el.querySelector('.fbtns'), skipB = document.createElement('button'); skipB.type = 'button'; skipB.textContent = '直接往下走';
  skipB.addEventListener('click', function (ev) { ev.stopPropagation(); S.free = null; step(); });
  fb.appendChild(skipB);
  el.hidden = false;
}
function useSpot(label, id) {
  S.free.used[id] = true; S.free.left -= 1; S.spots = (S.spots || 0) + 1;
  S.ret = { l: S.pc.l, i: S.pc.i };
  $('free').hidden = true; jump(label); run();
}
function openGifts() {
  var list = ST.giftList.filter(function (g) { return !S.gifted[g.id] && (!g.when || g.when(ctx)); });
  var body = '<div class="gifts">' + list.map(function (g) { return '<button type="button" data-g="' + g.id + '"><em>给' + esc(CAST[g.p].name) + '</em>' + esc(g.name) + '<small>' + esc(g.d) + '</small></button>'; }).join('') + '</div>';
  modal('送谁、送什么（每次自由时间只能送一样）', body);
  $('mBody').querySelectorAll('[data-g]').forEach(function (b) {
    b.addEventListener('click', function () {
      var id = b.dataset.g; closeModal();
      S.gifted[id] = true; S.free.used.gift = true;
      ST.giftList.forEach(function (g) { if (g.id === id) S.focus = g.p; });
      useSpot('g.gift_' + id, 'gift');
    });
  });
}
function endChapter(to) {
  if (to === 'fin') return finale();
  jump(to + '.start'); run();
}
function finale() {
  stopType(); $('box').hidden = true; $('menu').hidden = true; $('hud').hidden = true;
  var ends = ST.volumeEnd(ctx, S);
  var el = $('card'); el.querySelector('.ct').textContent = '共通线 完';
  el.querySelector('.cs').textContent = ends + '\n\n' + IDS.map(function (p) { return CAST[p].name + '：' + tier(p); }).join('　') + '\n（第 7 章以后的个人线还在写。点一下回到标题）';
  el.hidden = false; autosave();
  el.onclick = function () { el.onclick = null; el.hidden = true; toTitle(); };
}

/* ---------- 结局和图鉴：看过的结局记在存档里（每次发布会和存档一起清掉） ---------- */
function endingOf(id) { var e = null; ST.endings.forEach(function (x) { if (x.id === id) e = x; }); if (!e) throw new Error('没有这个结局：' + id); return e; }
function showEnding(id) {
  var e = endingOf(id), st = readStore();
  st.seen = st.seen || {}; var isNew = !st.seen[id]; st.seen[id] = stamp(); writeStore(st);
  stopType(); clearTimeout(autoT); auto = skip = false; setMenu();
  $('box').hidden = true; $('menu').hidden = true; $('hud').hidden = true;
  music(/_hi$|family|sign/.test(id) ? 'warm' : /_lo$|expire|board|tie/.test(id) ? 'sad' : 'title');
  var el = $('card'); el.querySelector('.ct').textContent = e.t;
  el.querySelector('.cs').textContent = (e.kind || '结局') + (isNew ? ' · 新收录到图鉴' : '') + '\n\n' + IDS.map(function (p) { return CAST[p].name + '：' + tier(p); }).join('　') + '\n\n点一下回到标题';
  el.hidden = false;
  el.onclick = function () { el.onclick = null; el.hidden = true; toTitle(); };
}
function openGallery() {
  var seen = readStore().seen || {}, n = ST.endings.filter(function (e) { return seen[e.id]; }).length;
  if (!ST.endings.length) return modal('结局图鉴', '<p>这个版本的结局还在写。</p>');
  modal('结局图鉴（' + n + ' / ' + ST.endings.length + '）', '<div class="gal">' + ST.endings.map(function (e) {
    var on = !!seen[e.id];
    return '<div class="ge' + (on ? ' on' : '') + '"><b>' + (on ? esc(e.t) : '？？？') + '</b><span>' + esc(e.kind || '结局') + '</span><small>' + esc(on ? '看到于 ' + seen[e.id] : e.hint) + '</small></div>';
  }).join('') + '</div>');
}

/* ---------- 菜单 ---------- */
function setMenu() {
  document.querySelector('[data-m="auto"]').setAttribute('aria-pressed', auto ? 'true' : 'false');
  document.querySelector('[data-m="skip"]').setAttribute('aria-pressed', skip ? 'true' : 'false');
}
function modal(title, html) { $('mTitle').textContent = title; $('mBody').innerHTML = html; $('modal').hidden = false; busy = true; }
function closeModal() { $('modal').hidden = true; busy = false; }
$('mClose').addEventListener('click', closeModal);
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function stamp() { var d = new Date(); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function snapshot() { var o = JSON.parse(JSON.stringify(S)); o.when = stamp(); return o; }
function autosave() { var st = readStore(); st.slots.auto = snapshot(); writeStore(st); }
function slotsHtml(mode) {
  var st = readStore(), keys = ['auto', '1', '2', '3', '4', '5'];
  return '<div class="slots">' + keys.map(function (k) {
    var s = st.slots[k], dis = (mode === 'save' && k === 'auto') || (mode === 'load' && !s);
    return '<button type="button" class="slot" data-k="' + k + '"' + (dis ? ' disabled' : '') + '><b>' + (k === 'auto' ? '自动存档' : '存档 ' + k) + '</b>' +
      (s ? '<span>' + esc(s.ch || '序章') + '</span><small>' + esc(s.when) + '</small>' : '<small>空</small>') + '</button>';
  }).join('') + '</div>';
}
function openSave() {
  modal('存档', slotsHtml('save'));
  $('mBody').querySelectorAll('.slot').forEach(function (b) { b.addEventListener('click', function () {
    var st = readStore(); st.slots[b.dataset.k] = snapshot(); if (writeStore(st)) toast('已存到存档 ' + b.dataset.k); else toast('浏览器不让存档，可能是无痕模式');
    closeModal();
  }); });
}
function openLoad() {
  modal('读档', slotsHtml('load'));
  $('mBody').querySelectorAll('.slot').forEach(function (b) { b.addEventListener('click', function () {
    var s = readStore().slots[b.dataset.k]; if (!s) return; closeModal(); restore(s);
  }); });
}
function restore(s) {
  S = JSON.parse(JSON.stringify(s)); delete S.when;
  $('title').hidden = true; $('hud').hidden = false; $('chapTag').textContent = S.ch || '';
  $('bg').innerHTML = S.bg ? BG[S.bg]() : ''; $('bg').style.opacity = 1; if (S.bg) music(VN_BGM.moodFor(S.bg));
  $('spr').innerHTML = ''; $('spr').classList.remove('title'); S.sprs.forEach(function (s) { sprEl(s.p); }); layout(true);
  setCg(S.cg); updHud();
  run();
}
function openLog() {
  modal('对话记录', S && S.log.length ? S.log.slice().reverse().map(function (l) { return '<div class="logline">' + (l.w ? '<b>' + esc(l.w) + '</b>' : '') + esc(l.t) + '</div>'; }).join('') : '还没有对话。');
}
function about() {
  modal('关于', '<div class="about">' + ST.about + '</div>');
}
function toTitle() {
  stopType(); clearTimeout(autoT); auto = skip = false; setMenu();
  hideOverlays(); $('box').hidden = true; $('menu').hidden = true; $('hud').hidden = true; setCg(null);
  $('bg').innerHTML = BG.stadium_night(); $('bg').style.opacity = 1; music('title');
  S = fresh(); S.sprs = IDS.map(function (p) { return { p: p, e: 'smile' }; }); S.focus = null;
  $('spr').innerHTML = ''; $('spr').classList.add('title'); S.sprs.forEach(function (s) { sprEl(s.p); }); layout(true);
  $('btnCont').hidden = !readStore().slots.auto;
  $('title').hidden = false;
  setTimeout(function () { var b = $('btnCont').hidden ? $('btnNew') : $('btnCont'); b.focus({ preventScroll: true }); }, 50);
}
document.querySelectorAll('#menu button').forEach(function (b) {
  b.addEventListener('click', function (ev) {
    ev.stopPropagation(); var m = b.dataset.m;
    if (m === 'log') openLog();
    else if (m === 'save') openSave();
    else if (m === 'load') openLoad();
    else if (m === 'title') toTitle();
    else if (m === 'bgm') setBgmBtns(VN_BGM.toggle());
    else if (m === 'auto') { auto = !auto; skip = false; setMenu(); if (auto && !typing && !$('box').hidden) advance(); }
    else if (m === 'skip') { skip = !skip; auto = false; setMenu(); if (skip && !$('box').hidden) advance(); }
  });
});
$('box').addEventListener('click', advance);
$('btnNew').addEventListener('click', function () { S = fresh(); $('spr').innerHTML = ''; $('spr').classList.remove('title'); $('title').hidden = true; $('hud').hidden = false; updHud(); run(); });
$('btnCont').addEventListener('click', function () { var s = readStore().slots.auto; if (s) restore(s); });
$('btnLoad').addEventListener('click', openLoad);
$('btnAbout').addEventListener('click', about);
$('btnGal').addEventListener('click', openGallery);
function setBgmBtns(on) {
  document.querySelector('[data-m="bgm"]').setAttribute('aria-pressed', on ? 'true' : 'false');
  $('btnBgm').textContent = '音乐：' + (on ? '开' : '关');
}
$('btnBgm').addEventListener('click', function () { setBgmBtns(VN_BGM.toggle()); });
setBgmBtns(VN_BGM.isOn());
$('btnMode').addEventListener('click', function () { setMode(MODE === 'crack' ? 'normal' : 'crack'); toTitle(); });
document.addEventListener('keydown', function (e) {
  if (!$('modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (!$('title').hidden) return;
  if (e.key === ' ' || e.key === 'Enter') {
    if (!$('card').hidden) { e.preventDefault(); $('card').click(); return; }
    if (!$('box').hidden && $('choices').hidden && $('free').hidden) { e.preventDefault(); advance(); }
  }
});
window.VN_TEST = { state: function () { return S; }, tierOf: tierOf, top: function () { return top(); }, mode: function () { return MODE; }, setMode: setMode };
setMode(MODE);
toTitle();
})();
</script>

</body></html>
